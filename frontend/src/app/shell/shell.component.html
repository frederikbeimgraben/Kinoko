<div
  class="shell"
  [class.shell--column]="wide()"
  [attr.data-pane]="wide() ? frame().pane : null"
  [style.--top-bar-height]="topBarHeight()"
>
  @if (mapWanted()) {
    @defer (when mapWanted()) {
      <app-map
        class="shell__map"
        [class.shell__map--lead]="mapInFront()"
        [class.shell__map--hidden]="mapHidden()"
        [surfaceOnly]="!onTheMap()"
      />
    }
  }
  @if (!bare()) {
    <app-nav class="shell__nav" [active]="active()" [variant]="wide() ? 'rail' : 'bottom'">
      <app-avatar-button [name]="avatarName()" [label]="avatarLabel()" (pressed)="toAccount()" />
    </app-nav>
  }
  <main
    class="shell__content"
    [class.shell__content--off]="onTheMap()"
    [class.shell__content--full]="wide() && frame().full"
  >
    <router-outlet />
  </main>
  @if (updateReady()) {
    <app-banner
      class="shell__banner"
      [class.shell__banner--float]="bannerFloats()"
      [float]="bannerFloats()"
      kind="update"
      actionIcon="refresh"
      actionLabel="app.update.reload"
      (actionClick)="reload()"
    />
  }
  @if (showAvatar()) {
    <app-avatar-button
      class="shell__avatar"
      [name]="avatarName()"
      [label]="avatarLabel()"
      (pressed)="toAccount()"
    />
  }
</div>
