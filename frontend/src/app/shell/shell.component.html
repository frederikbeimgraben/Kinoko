<div class="shell" [class.shell--column]="wide()" [style.--update-bar-height]="updateBarHeight()">
  <app-update-bar />
  @if (wide()) {
    @defer (when wide()) {
      <app-map class="shell__map" [class.shell__map--lead]="mapInFront()" [surfaceOnly]="!onTheMap()" />
    }
  }
  @if (!bare()) {
    <app-nav class="shell__nav" [active]="active()" [variant]="wide() ? 'rail' : 'bottom'">
      <app-avatar-button [name]="avatarName()" [label]="avatarLabel()" (pressed)="toAccount()" />
    </app-nav>
  }
  <main
    class="shell__content"
    [class.shell__content--off]="wide() && onTheMap()"
    [class.shell__content--full]="wide() && fullWidth()"
  >
    <router-outlet />
  </main>
  @if (showAvatar()) {
    <app-avatar-button
      class="shell__avatar"
      [name]="avatarName()"
      [label]="avatarLabel()"
      (pressed)="toAccount()"
    />
  }
</div>
