<label
  class="field__label"
  [class.field__label--section]="section()"
  [class.sr-only]="hideLabel()"
  [attr.for]="readOnly() ? null : fieldId"
  >{{ label() }}</label
>
@if (readOnly()) {
  <button
    class="field field--button tap"
    type="button"
    data-press="scale"
    [class.field--empty]="empty()"
    (click)="displayClick.emit()"
  >
    {{ empty() ? placeholder() : value() }}
  </button>
} @else if (multiline()) {
  <textarea
    class="field field--multiline tap"
    data-press="scale"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    [attr.inputmode]="mode()"
    [attr.enterkeyhint]="hint()"
    (input)="onInput($event)"
  ></textarea>
} @else if (icon()) {
  <span class="field field--icon tap" data-press="scale">
    <app-svg-icon class="field__icon" [name]="icon()!" [size]="18" />
    <input
      class="field__input"
      type="text"
      [id]="fieldId"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      [attr.inputmode]="mode()"
      [attr.enterkeyhint]="hint()"
      (input)="onInput($event)"
    />
  </span>
} @else {
  <input
    class="field tap"
    data-press="scale"
    [type]="kind()"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    [attr.inputmode]="mode()"
    [attr.enterkeyhint]="hint()"
    (input)="onInput($event)"
  />
}
