@if (path(); as path) {
  <div
    #scrim
    class="photo__scrim"
    tabindex="-1"
    animate.enter="motion-fade-in"
    animate.leave="motion-fade-out"
    [appModalLayer]="label()"
    (dismissed)="closed.emit()"
    (keydown)="onKeydown($event)"
    (click)="onGround($event)"
  >
    <figure class="photo__panel">
      <div class="photo__frame">
        <app-private-image
          class="photo__image"
          fit="contain"
          [path]="path"
          [alt]="label()"
          (pointerdown)="onPointerDown($event)"
          (pointerup)="onPointerUp($event)"
        />
        <span class="photo__close">
          <app-icon-button icon="close" kind="over" [label]="'common.close' | t" (pressed)="closed.emit()" />
        </span>
        @if (hasPrev()) {
          <span class="photo__step photo__step--back">
            <app-icon-button icon="prev" kind="over" [label]="'image.previous' | t" (pressed)="step(-1)" />
          </span>
        }
        @if (hasNext()) {
          <span class="photo__step photo__step--next">
            <app-icon-button icon="next" kind="over" [label]="'image.next' | t" (pressed)="step(1)" />
          </span>
        }
      </div>
      <figcaption class="photo__caption">
        <span>{{ dayText() }}</span>
        <span>{{ counter() }}</span>
      </figcaption>
    </figure>
  </div>
}
