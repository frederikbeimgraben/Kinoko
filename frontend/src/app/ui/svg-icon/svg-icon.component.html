<svg
  [attr.viewBox]="viewBox()"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.role]="role()"
  [attr.aria-label]="label() ?? null"
  [attr.aria-hidden]="hidden()"
  [class.filled]="filled()"
  [class.dim]="tone() === 'dim'"
  [style.stroke-width.px]="strokeWidth()"
  [innerHTML]="markup()"
></svg>
