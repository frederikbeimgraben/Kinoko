<nav class="nav" [class.nav--rail]="variant() === 'rail'" [attr.aria-label]="'nav.label' | t">
  @for (tab of tabs; track tab.path) {
    <app-nav-tab
      [icon]="tab.icon"
      [label]="tab.labelKey | t"
      [path]="tab.path"
      [active]="tab.path === active()"
      [rail]="variant() === 'rail'"
    />
  }
  @if (variant() === 'rail') {
    <span class="nav__grow"></span>
    <div class="nav__slot"><ng-content /></div>
  }
</nav>
