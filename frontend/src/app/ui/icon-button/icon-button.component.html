<button
  class="icon-button"
  type="button"
  appRipple
  [class.icon-button--tonal]="kind() === 'tonal'"
  [class.icon-button--plain]="kind() === 'plain'"
  [class.icon-button--fab]="kind() === 'fab'"
  [class.icon-button--fabl]="kind() === 'fabl'"
  [class.icon-button--accept]="kind() === 'accept'"
  [class.icon-button--reject]="kind() === 'reject'"
  [class.icon-button--over]="kind() === 'over'"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
>
  @if (!own()) {
    <app-svg-icon
      class="icon-button__glyph"
      [name]="catalogue()"
      [size]="iconSize()"
      [strokeWidth]="glyph().stroke"
    />
  } @else if (filled()) {
    <svg
      class="icon-button__glyph"
      viewBox="0 0 24 24"
      fill="currentColor"
      [attr.width]="iconSize()"
      [attr.height]="iconSize()"
      aria-hidden="true"
    >
      @if (icon() === 'prev') {
        <path d="M16.500 6v12l-9-6z" />
      } @else {
        <path d="M7.500 6v12l9-6z" />
      }
    </svg>
  } @else {
    <svg
      class="icon-button__glyph"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      [attr.width]="iconSize()"
      [attr.height]="iconSize()"
      [attr.stroke-width]="glyph().stroke"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (icon()) {
        @case ('check') {
          <path d="M5 12l5 5 9-10" />
        }
        @case ('close') {
          <path d="M6 6l12 12M18 6L6 18" />
        }
        @case ('delete') {
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
        }
        @case ('pencil') {
          <path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" />
        }
        @case ('share') {
          <path
            d="M15.5 5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M3.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M15.5 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M8.2 10.800l7.600-4.500M8.200 13.200l7.600 4.500"
          />
        }
        @case ('sign-out') {
          <path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" />
        }
        @case ('undo') {
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        }
      }
    </svg>
  }
</button>
