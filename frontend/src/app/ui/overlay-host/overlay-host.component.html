@if (open()) {
  <button
    class="overlay__scrim tap"
    [class.overlay__scrim--modal]="modal()"
    type="button"
    data-press="tint"
    [attr.aria-label]="'common.close' | t"
    (click)="closed.emit()"
  ></button>
  <div class="overlay__panel" tabindex="-1" (keydown)="onKeydown($event)">
    <ng-content />
  </div>
}
