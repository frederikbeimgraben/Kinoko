<div class="colors" role="radiogroup" [attr.aria-label]="label()">
  @for (farbe of colors(); track farbe.value) {
    <button
      class="colors__field tap"
      type="button"
      role="radio"
      data-press="scale"
      [class.colors__field--selected]="farbe.value === value()"
      [attr.aria-checked]="farbe.value === value()"
      [attr.aria-label]="farbe.label"
      [attr.tabindex]="farbe.value === value() ? 0 : -1"
      [style.background]="farbe.value"
      (click)="valueChange.emit(farbe.value)"
    ></button>
  }
</div>
