<span class="filterchip">
  <span class="filterchip__label">{{ label() }}</span>
  <button
    class="filterchip__remove tap"
    type="button"
    data-press="scale"
    [attr.aria-label]="'filter.marke.entfernen' | t: { gruppe: label() }"
    (click)="removed.emit()"
  >
    <app-svg-icon name="close" [size]="15" />
  </button>
</span>
