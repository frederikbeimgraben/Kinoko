@if (clear()) {
  <span class="chip" [class.chip--on]="on()" [class.chip--small]="small()">
    @if (icon(); as glyph) {
      <app-svg-icon [name]="glyph" [size]="18" [strokeWidth]="1.8" />
    }
    @if (dot(); as colour) {
      <i class="chip__dot" [style.background]="colour"></i>
    }
    <span class="chip__label">{{ label() }}</span>
    <button
      class="chip__remove tap"
      type="button"
      appRipple
      [attr.aria-label]="'common.remove' | t"
      (click)="removed.emit()"
    >
      <app-svg-icon name="close" [size]="15" [strokeWidth]="2.2" />
    </button>
  </span>
} @else {
  <button
    class="chip tap"
    type="button"
    appRipple
    [class.chip--on]="on()"
    [class.chip--plain]="!icon() && !dot()"
    [class.chip--small]="small()"
    [class.chip--icononly]="label() === ''"
    [attr.aria-pressed]="on()"
    [attr.aria-label]="label() === '' ? (iconLabel() ?? null) : null"
    (click)="chosen.emit()"
  >
    @if (icon(); as glyph) {
      <app-svg-icon [name]="glyph" [size]="18" [strokeWidth]="1.8" />
    }
    @if (dot(); as colour) {
      <i class="chip__dot" [style.background]="colour"></i>
    }
    {{ label() }}
    @if (caret()) {
      <app-svg-icon name="chevron" [size]="14" [style.rotate]="'90deg'" />
    }
  </button>
}
