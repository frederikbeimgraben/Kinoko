<label class="row tap" [class.row--off]="locked()" [class.row--flush]="flush()" [attr.for]="fieldId">
  <input
    class="row__input"
    type="checkbox"
    [id]="fieldId"
    [checked]="checked()"
    [disabled]="locked()"
    (change)="onToggle($event)"
  />
  <span class="row__stack">
    <span class="row__title">{{ title() }}</span>
    @if (subline()) {
      <span class="row__sub">{{ subline() }}</span>
    }
  </span>
  @if (count() !== undefined) {
    <span class="row__count">{{ count() }}</span>
  }
  <span class="row__box" [class.row__box--on]="checked()" aria-hidden="true">
    @if (checked()) {
      <app-svg-icon name="check" [size]="16" [strokeWidth]="2.5" />
    }
  </span>
</label>
