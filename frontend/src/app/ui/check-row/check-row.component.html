<app-checkbox
  class="row tap"
  data-press="tint"
  [id]="fieldId"
  [ngModel]="checked()"
  [disabled]="locked()"
  (ngModelChange)="toggled.emit($event)"
>
  <span class="row__stack">
    <span class="row__title">{{ title() }}</span>
    @if (subline()) {
      <span class="row__sub">{{ subline() }}</span>
    }
  </span>
</app-checkbox>
