<label
  class="row tap"
  data-press="tint"
  [class.row--locked]="locked()"
  [class.row--flush]="flush()"
  [attr.for]="fieldId"
>
  <input
    class="row__input"
    type="checkbox"
    [id]="fieldId"
    [checked]="checked()"
    [disabled]="locked()"
    (change)="onToggle($event)"
  />
  @if (locked()) {
    <app-svg-icon class="row__lock" name="lock" [size]="16" [strokeWidth]="1.8" />
  } @else {
    <span class="row__box" [class.row__box--on]="checked()" aria-hidden="true">
      @if (checked()) {
        <app-svg-icon name="check" [size]="14" [strokeWidth]="2.4" />
      }
    </span>
  }
  <span class="row__stack">
    <span class="row__title">{{ title() }}</span>
    @if (subline()) {
      <span class="row__sub">{{ subline() }}</span>
    }
  </span>
  @if (count() !== undefined) {
    <span class="row__count">{{ count() }}</span>
  }
</label>
