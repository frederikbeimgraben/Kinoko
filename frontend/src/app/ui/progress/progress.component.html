<div
  class="progress__track"
  role="progressbar"
  [attr.aria-valuenow]="clamped()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuetext]="'karte.prozent' | t: { wert: clamped() }"
  [attr.aria-label]="'common.progress' | t"
>
  <div class="progress__fill" [style.inline-size.%]="clamped()"></div>
</div>
