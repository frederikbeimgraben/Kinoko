<app-private-image
  class="otitle__thumb"
  [path]="photo()"
  [colour]="colour()"
  [icon]="icon()"
  [alt]="title()"
/>
<span class="otitle__txt">
  @if (level() === 2) {
    <h2 class="otitle__title">{{ title() }}</h2>
  } @else {
    <h3 class="otitle__title">{{ title() }}</h3>
  }
  <span class="otitle__sub">{{ sub() }}</span>
</span>
