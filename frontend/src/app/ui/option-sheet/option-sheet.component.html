<app-overlay-host [open]="open()" [modal]="dims()" (closed)="dismiss()">
  @if (open()) {
    <app-sheet
      [label]="title()"
      [title]="title()"
      [modal]="true"
      [detent]="detent()"
      [detents]="detents()"
      (closed)="dismiss()"
    >
      <div class="overlay-body">
        <div class="option-sheet__scroll" appScrollFade role="group" [attr.aria-label]="title()">
          <div class="option-sheet__card">
            @if (multiple()) {
              @for (option of options(); track option.id) {
                <app-check-row
                  [title]="option.title"
                  [checked]="checked(option.id)"
                  (toggled)="toggle(option.id, $event)"
                />
              }
            } @else {
              @for (option of options(); track option.id) {
                <app-list-row
                  kind="filter"
                  [title]="option.title"
                  [icon]="option.icon ?? undefined"
                  [value]="option.value"
                  [chevron]="option.id !== selected()"
                  [clickable]="true"
                  [selected]="option.id === selected()"
                  (chosen)="chosen.emit(option.id)"
                >
                  @if (option.id === selected()) {
                    <app-svg-icon trail name="check" [size]="18" [strokeWidth]="2.4" />
                  }
                </app-list-row>
              }
            }
          </div>
        </div>
      </div>
      @if (multiple()) {
        <app-action-bar [primary]="confirmLabel()" (primaryClick)="confirm()" />
      }
    </app-sheet>
  }
</app-overlay-host>
