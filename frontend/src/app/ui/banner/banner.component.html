<button
  type="button"
  class="banner"
  appRipple
  aria-live="polite"
  [class.banner--error]="tone() === 'error'"
  [class.banner--info]="tone() === 'info'"
  [attr.aria-label]="ariaLabel()"
  (click)="actionClick.emit()"
>
  <app-svg-icon class="banner__glyph" [name]="glyph()" [size]="24" [strokeWidth]="1.8" />
  <span class="banner__text">{{ text() ?? (textKey() | t) }}</span>
  @if (countText(); as count) {
    <b class="banner__count">{{ count }}</b>
  }
  @if (action(); as action) {
    <app-svg-icon class="banner__action" [name]="action.icon" [size]="24" [strokeWidth]="1.8" />
  }
  @if (showsChev()) {
    <app-svg-icon class="banner__chev" name="chevron" [size]="24" [strokeWidth]="1.8" />
  }
</button>
