<div class="stepbar" role="group" [attr.aria-label]="label()">
  @if (note()) {
    <span class="stepbar__note">{{ note() }}</span>
  }
  <div class="stepbar__actions">
    @for (action of actions(); track action.label) {
      <button
        class="stepbar__action tap"
        type="button"
        data-press="scale"
        [class.stepbar__action--primary]="action.variant === 'primary'"
        [attr.aria-label]="action.label"
        (click)="chosen.emit(action)"
      >
        <app-svg-icon [name]="action.icon" [size]="16" />
      </button>
    }
  </div>
</div>
