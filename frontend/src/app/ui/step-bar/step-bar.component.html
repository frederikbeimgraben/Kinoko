<div class="stepbar" role="group" [attr.aria-label]="label()">
  @if (note()) {
    <span class="stepbar__note">{{ note() }}</span>
  }
  @for (action of secondary(); track action.label) {
    <app-icon-button
      kind="fabl"
      [icon]="roundIcon(action.icon)"
      [label]="action.label"
      (pressed)="chosen.emit(action)"
    />
  }
  @for (action of primary(); track action.label) {
    <app-floating-button [icon]="action.icon" [label]="action.label" (pressed)="chosen.emit(action)" />
  }
</div>
