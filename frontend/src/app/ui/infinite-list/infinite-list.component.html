<div class="list" appScrollFade [class.list--framed]="framed()">
  <ng-content />
  @if (pending()) {
    <app-skeleton
      kind="rows"
      [count]="skeletonCount()"
      [lead]="preset().lead"
      [trail]="preset().trail"
      [shape]="preset().shape"
      [lines]="preset().lines"
    />
  }
  <div #sentinel class="list__sentinel"></div>
</div>
