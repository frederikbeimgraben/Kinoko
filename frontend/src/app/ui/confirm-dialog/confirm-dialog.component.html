<app-dialog
  [open]="open()"
  [title]="title()"
  [closeLabel]="'common.close' | t"
  (closed)="cancelled.emit()"
>
  @if (meta(); as meta) {
    <p class="confirm__meta">{{ meta }}</p>
  }
  <div class="confirm__actions">
    <app-button
      class="confirm__confirm"
      [variant]="danger() ? 'danger' : 'primary'"
      [block]="true"
      (click)="confirmed.emit()"
    >
      {{ confirmLabel() ?? ('common.delete' | t) }}
    </app-button>
    <app-button class="confirm__cancel" variant="secondary" [block]="true" (click)="cancelled.emit()">
      {{ 'common.cancel' | t }}
    </app-button>
  </div>
</app-dialog>
