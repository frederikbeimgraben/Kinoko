@if (open()) {
  <div class="reject__scrim" aria-hidden="true" (click)="cancel()"></div>
  <div #layer="modalLayer" class="reject__panel" appModalLayer (dismissed)="cancel()">
    <span class="reject__handle" aria-hidden="true"></span>
    <h2 class="reject__title" [id]="layer.labelId">{{ 'image.rejectReasonTitle' | t }}</h2>
    <app-chip-group
      [chips]="chips()"
      [value]="chosen() ? [chosen()] : []"
      [label]="'image.rejectReasonTitle' | t"
      (valueChange)="pick($event.at(0) ?? '')"
    />
    <app-form-field
      [label]="'image.rejectReasonPlaceholder' | t"
      [placeholder]="'image.rejectReasonPlaceholder' | t"
      [multiline]="true"
      [hideLabel]="true"
      [value]="written()"
      (valueChange)="write($event)"
    />
    <app-push-button kind="danger" [wide]="true" [disabled]="!ready()" (click)="confirm()">
      {{ 'image.reject' | t }}
    </app-push-button>
    <app-push-button kind="tonal" [wide]="true" (click)="cancel()">
      {{ 'common.back' | t }}
    </app-push-button>
  </div>
}
