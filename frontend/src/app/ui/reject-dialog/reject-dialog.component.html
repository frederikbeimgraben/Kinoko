@if (open()) {
  <div class="reject__scrim" aria-hidden="true" (click)="cancel()"></div>
  <div
    #panel
    class="reject__panel"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="titleId"
    (keydown)="onKeydown($event)"
  >
    <span class="reject__handle" aria-hidden="true"></span>
    <h2 class="reject__title" [id]="titleId">{{ 'bild.grundFrage' | t }}</h2>
    <app-chip-group
      [chips]="chips()"
      [value]="reason() ? [reason()] : []"
      [label]="'bild.grundVorschlaege' | t"
      (valueChange)="pick($event.at(0) ?? '')"
    />
    <app-form-field
      [label]="'bild.grundFeld' | t"
      [placeholder]="'bild.grundPlatzhalter' | t"
      [multiline]="true"
      [value]="reason()"
      (valueChange)="write($event)"
    />
    <p class="note note--sub">{{ hint() }}</p>
    <app-button variant="danger" [block]="true" [disabled]="!ready()" (click)="confirm()">
      {{ 'bild.ablehnen' | t }}
    </app-button>
    <app-button variant="secondary" [block]="true" (click)="cancel()">
      {{ 'objekt.abbrechen' | t }}
    </app-button>
  </div>
}
