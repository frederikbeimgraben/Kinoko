@if (source(); as source) {
  <img
    class="private__image"
    draggable="false"
    [class.private__image--contain]="fit() === 'contain'"
    [class.private__image--natural]="fit() === 'natural'"
    [src]="source"
    [alt]="alt()"
  />
} @else if (!path() && fallback() === 'hero') {
  <span class="private__fallback private__fallback--hero">
    <app-svg-icon [name]="icon()" [size]="96" [strokeWidth]="1" />
  </span>
} @else if (!path()) {
  <span class="private__fallback" [class.private__fallback--dark]="darkInk()" [style.background]="colour()">
    <app-svg-icon [name]="icon()" [size]="24" [strokeWidth]="1.8" />
  </span>
}
@if (locked()) {
  <span class="private__lock" aria-hidden="true">
    <app-svg-icon name="lock" [size]="16" [strokeWidth]="1.8" />
  </span>
}
