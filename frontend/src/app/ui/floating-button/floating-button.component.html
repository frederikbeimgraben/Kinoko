<button
  class="floating tap"
  type="button"
  data-press="scale"
  [class.floating--primary]="variant() === 'primary'"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
>
  <app-svg-icon class="floating__icon" [name]="icon()" [size]="24" [style.rotate.deg]="rotation()" />
</button>
