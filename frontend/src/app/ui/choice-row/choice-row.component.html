<label class="row tap">
  <input class="row__input" type="checkbox" [checked]="checked()" (change)="onChange($event)" />
  <span class="row__stack">
    <span class="row__label">{{ label() }}</span>
    @if (subline()) {
      <span class="row__sub">{{ subline() }}</span>
    }
  </span>
  @if (count()) {
    <span class="row__count">{{ count() }}</span>
  }
  <span class="row__box" [class.row__box--on]="checked()" aria-hidden="true"><i></i></span>
</label>
