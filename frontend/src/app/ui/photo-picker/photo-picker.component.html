<div class="picker">
  @for (photo of held(); track photo.id) {
    <div class="tile">
      <app-private-image class="tile__image" [path]="photo.path" alt="" />
      <button
        class="tile__remove tap"
        type="button"
        data-press="scale"
        [attr.aria-label]="'image.remove' | t"
        (click)="heldRemoved.emit(photo.id)"
      >
        <app-svg-icon name="close" [size]="11" [strokeWidth]="2.2" />
      </button>
    </div>
  }
  @for (tile of tiles(); track tile.file; let i = $index) {
    <div class="tile">
      <img class="tile__image" [src]="tile.preview" alt="" />
      <button
        class="tile__remove tap"
        type="button"
        data-press="scale"
        [attr.aria-label]="'image.remove' | t"
        (click)="remove(tile.file)"
      >
        <app-svg-icon name="close" [size]="11" [strokeWidth]="2.2" />
      </button>
    </div>
  }
  @if (canAdd()) {
    <label class="tile tile--add tap" data-press="scale">
      <app-svg-icon name="plus" [size]="20" />
      <span class="sr-only">{{ 'image.add.title' | t }}</span>
      <input class="sr-only" type="file" accept="image/jpeg,image/webp" multiple (change)="onPick($event)" />
    </label>
  }
</div>
