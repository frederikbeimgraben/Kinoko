<div class="footer" [class.footer--inline]="inline()">
  <app-button
    class="footer__main"
    [variant]="primaryVariant()"
    [block]="!inline()"
    [loading]="busy()"
    [disabled]="busy()"
    (click)="primaryClick.emit()"
  >
    {{ primary() }}
  </app-button>
  @if (secondary(); as label) {
    <app-button
      class="footer__main"
      [variant]="secondaryDanger() ? 'danger-outline' : 'secondary'"
      [block]="!inline()"
      (click)="secondaryClick.emit()"
    >
      {{ label }}
    </app-button>
  }
</div>
