<div class="footer" [class.footer--inline]="inline()">
  <app-button
    class="footer__main"
    [class.footer__slim]="ghost() && secondary() === undefined"
    [class.footer__danger]="quietDanger()"
    [variant]="primaryVariant()"
    [block]="!inline()"
    [loading]="busy()"
    [disabled]="busy()"
    (click)="primaryClick.emit()"
  >
    {{ primary() }}
  </app-button>
  @if (secondary(); as label) {
    <app-button
      class="footer__main"
      [class.footer__slim]="secondaryDanger() || ghost()"
      [variant]="secondaryVariant()"
      [block]="!inline()"
      (click)="secondaryClick.emit()"
    >
      {{ label }}
    </app-button>
  }
</div>
