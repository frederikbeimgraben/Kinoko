<div class="footer" [class.footer--inline]="inline()">
  <ng-content />
  <div
    class="footer__pair"
    [class.footer__pair--split]="split()"
    [class.footer__pair--danger]="split() && danger()"
  >
    <app-button
      class="footer__main"
      [class.footer__lead]="split()"
      [class.footer__slim]="split() || (ghost() && secondary() === undefined)"
      [class.footer__danger]="quietDanger()"
      [variant]="primaryVariant()"
      [block]="!inline()"
      [loading]="busy()"
      [disabled]="busy()"
      (click)="primaryClick.emit()"
    >
      {{ primary() }}
    </app-button>
    @if (visibleSecondary(); as label) {
      <app-button
        class="footer__main"
        [class.footer__slim]="secondaryDanger() || ghost()"
        [variant]="secondaryVariant()"
        [block]="!inline()"
        (click)="secondaryClick.emit()"
      >
        {{ label }}
      </app-button>
    }
  </div>
</div>
