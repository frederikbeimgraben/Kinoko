<div class="footer">
  <app-button
    class="footer__main"
    [variant]="danger() ? 'danger' : 'primary'"
    [block]="true"
    (click)="primaryClick.emit()"
  >
    {{ primary() }}
  </app-button>
  @if (secondary(); as label) {
    <app-button
      class="footer__main"
      [variant]="secondaryDanger() ? 'danger' : 'secondary'"
      [block]="true"
      (click)="secondaryClick.emit()"
    >
      {{ label }}
    </app-button>
  }
</div>
