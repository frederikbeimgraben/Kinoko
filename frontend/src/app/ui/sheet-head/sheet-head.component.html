<div class="head">
  <div class="head__row">
    <p class="head__title">
      @if (titleLink()) {
        <button
          class="head__species head__species--link tap"
          type="button"
          data-press="scale"
          (click)="titleClick.emit()"
        >
          {{ title() }}
        </button>
      } @else {
        <span class="head__species">{{ title() }}</span>
      }
      @if (week()) {
        <span class="head__divider" aria-hidden="true">·</span>
        <span class="head__week">{{ week() }}</span>
      }
      @if (hint()) {
        <span class="head__hint">{{ hint() }}</span>
      }
    </p>
    @if (arrows()) {
      <div class="head__arrows">
        <button
          class="head__arrow tap"
          type="button"
          data-press="scale"
          [attr.aria-label]="backArrow.key | t"
          (click)="back.emit()"
        >
          <app-svg-icon [name]="backArrow.icon" [size]="12" />
        </button>
        <button
          class="head__arrow tap"
          type="button"
          data-press="scale"
          [attr.aria-label]="(playing() ? 'zeitleiste.anhalten' : 'zeitleiste.abspielen') | t"
          [attr.aria-pressed]="playing()"
          (click)="playback.emit()"
        >
          <app-svg-icon [name]="playing() ? 'pause' : 'abspielen'" [size]="12" />
        </button>
        <button
          class="head__arrow tap"
          type="button"
          data-press="scale"
          [attr.aria-label]="forwardArrow.key | t"
          (click)="forward.emit()"
        >
          <app-svg-icon [name]="forwardArrow.icon" [size]="12" />
        </button>
      </div>
    }
  </div>
  <div class="head__bar"><ng-content /></div>
</div>
