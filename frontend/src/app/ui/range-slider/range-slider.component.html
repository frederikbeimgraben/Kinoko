<div class="rangeslider" [class.rangeslider--dot]="variant() === 'dot'">
  <span class="rangeslider__track"></span>
  <span
    class="rangeslider__chosen"
    [style.inset-inline-start]="fromShare()"
    [style.inset-inline-end]="'calc(100% - ' + toShare() + ')'"
  ></span>
  @if (showsFrom()) {
    <input
      class="rangeslider__thumb"
      type="range"
      [attr.aria-label]="'common.rangeMin' | t"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="from()"
      (input)="onFrom($event)"
    />
  }
  @if (showsTo()) {
    <input
      class="rangeslider__thumb"
      type="range"
      [attr.aria-label]="'common.rangeMax' | t"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="to()"
      (input)="onTo($event)"
    />
  }
</div>
