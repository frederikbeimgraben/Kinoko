<div class="wrow">
  <app-icon-button
    icon="prev"
    [label]="'map.timeline.scrollEarlier' | t"
    [disabled]="!canScrollBack()"
    (pressed)="scrollByPage(-1)"
  />
  <div
    #bar
    class="weeks"
    role="group"
    [class.weeks--dimmed]="dimmed()"
    [attr.aria-label]="label()"
    (keydown)="onKey($event)"
  >
    @if (loading()) {
      @for (slot of placeholders; track slot) {
        <app-week-button [year]="0" [week]="0" [loading]="true" [inTabOrder]="false" />
      }
    }
    @for (week of shown(); track week.key; let i = $index) {
      <app-week-button
        [year]="week.year"
        [week]="week.week"
        [share]="week.share"
        [forecast]="week.forecast"
        [yearMark]="week.yearMark"
        [active]="isActive(week)"
        [locked]="dimmed()"
        [inTabOrder]="i === activeIndex()"
        (chosen)="chosen.emit(week)"
      />
    }
  </div>
  <app-icon-button
    icon="next"
    [label]="'map.timeline.scrollLater' | t"
    [disabled]="!canScrollForward()"
    (pressed)="scrollByPage(1)"
  />
</div>
