<span class="search tap" data-press="scale">
  @if (!loading()) {
    <app-svg-icon class="search__icon" name="search" [size]="18" [strokeWidth]="1.8" />
    <input
      class="search__input"
      type="text"
      inputmode="search"
      enterkeyhint="search"
      [attr.aria-label]="placeholder() || null"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      (input)="onInput($event)"
    />
    @if (!empty()) {
      <button
        class="search__clear tap"
        type="button"
        data-press="scale"
        [attr.aria-label]="'common.clear' | t"
        (click)="clear()"
      >
        <app-svg-icon name="close" [size]="14" [strokeWidth]="2.2" />
      </button>
    }
  }
</span>
