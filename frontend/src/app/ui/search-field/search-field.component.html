<label class="search" [class.search--plain]="plain()" [attr.for]="loading() ? null : fieldId">
  @if (!loading()) {
    <app-svg-icon class="search__icon" name="search" [size]="24" [strokeWidth]="1.8" />
    <input
      class="search__input"
      type="text"
      inputmode="search"
      enterkeyhint="search"
      [id]="fieldId"
      [attr.aria-label]="placeholder() || null"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      (input)="onInput($event)"
    />
    @if (!empty()) {
      <button
        class="search__clear tap"
        type="button"
        data-press="scale"
        [attr.aria-label]="'common.clear' | t"
        (click)="clear()"
      >
        <app-svg-icon name="close" [size]="24" [strokeWidth]="1.8" />
      </button>
    }
  }
</label>
