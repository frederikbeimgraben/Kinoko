<label
  class="search"
  [class.search--plain]="plain()"
  [class.search--keyboard]="keyboard()"
  [attr.for]="fieldId"
  (pointerdown)="onPointerDown()"
>
  <app-svg-icon class="search__icon" name="search" [size]="24" [strokeWidth]="1.8" />
  <input
    class="search__input"
    type="text"
    inputmode="search"
    enterkeyhint="search"
    [id]="fieldId"
    [attr.aria-label]="placeholder() || null"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  @if (!empty()) {
    <button
      class="search__clear tap"
      type="button"
      appRipple
      [attr.aria-label]="'common.clear' | t"
      (click)="clear()"
    >
      <app-svg-icon name="close" [size]="24" [strokeWidth]="1.8" />
    </button>
  }
</label>
