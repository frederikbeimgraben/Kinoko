<button
  #button
  class="row tap"
  type="button"
  appRipple
  [class.row--active]="active()"
  [class.row--soft]="soft()"
  [attr.aria-current]="active() ? 'true' : null"
  (click)="choose()"
>
  <app-private-image
    #thumb
    class="row__thumb"
    [path]="species().image ?? ''"
    [alt]="species().name"
    [colour]="species().colour ?? '#7a5230'"
  />
  <span class="row__names">
    <span class="row__name">{{ species().name }}</span>
    @if (species().latin !== species().name) {
      <span class="row__latin">{{ species().latin }}</span>
    } @else if (species().alias) {
      <span class="row__latin row__latin--alias" [attr.lang]="aliasLang">{{ species().alias }}</span>
    }
  </span>
  @if (species().forecastLabel; as mark) {
    <span class="row__forecast" [attr.title]="mark">
      <app-svg-icon name="map" [size]="20" [label]="mark" />
    </span>
  }
  @if (!muted()) {
    <app-level-pill
      class="row__badge"
      [text]="species().levelText"
      [colour]="species().levelColour"
      [background]="species().levelBackground"
      [kind]="species().levelKind ?? ''"
    />
  }
  <span class="row__trail"><ng-content select="[trail]" /></span>
  <app-svg-icon class="row__chevron" name="chevron" [size]="24" tone="dim" />
</button>
