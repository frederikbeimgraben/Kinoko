<span
  class="level"
  [class.level--ok]="kind() === 'ok'"
  [class.level--warn]="kind() === 'warn'"
  [class.level--bad]="kind() === 'bad'"
  [style.--pilz-level-colour]="colour()"
  [style.--pilz-level-area]="background()"
>
  @if (icon(); as name) {
    <app-svg-icon [name]="name" [size]="12" />
  }
  {{ text() }}</span
>
