<p class="ramp__label">{{ label() }}</p>
<div class="ramp" role="img" [attr.aria-label]="label() + ': ' + from() + ' – ' + to()">
  @for (colour of colours(); track colour) {
    <i class="ramp__step" [style.background]="colour"></i>
  }
</div>
<div class="ramp__ends">
  <span>{{ from() }}</span>
  <span>{{ to() }}</span>
</div>
@if (note(); as text) {
  <p class="note note--sub">{{ text }}</p>
}
