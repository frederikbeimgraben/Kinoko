<span class="ramp__label">{{ label() }}</span>
<div class="ramp" role="img" [attr.aria-label]="label() + ': ' + from() + ' – ' + to()">
  @for (step of steps(); track step.colour) {
    <i class="ramp__step" [style.background]="step.colour" [style.flex-basis.%]="step.width"></i>
  }
</div>
<div class="ramp__ends">
  <span>{{ from() }}</span>
  <span>{{ to() }}</span>
</div>
@if (note(); as text) {
  <p class="note note--sub">{{ text }}</p>
}
