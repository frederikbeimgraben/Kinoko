<button class="row tap" type="button" data-press="tint" (click)="chosen.emit()">
  <span class="row__stack">
    <span class="row__title">{{ entry().title }}</span>
    <span class="row__meta">{{ entry().meta }}</span>
    @if (entry().note) {
      <span class="row__note">{{ entry().note }}</span>
    }
  </span>
  @if (pending()) {
    <app-level-pill
      class="row__pending"
      [text]="'entry.badge.transferPending' | t"
      colour="var(--color-warning)"
    />
  }
</button>
