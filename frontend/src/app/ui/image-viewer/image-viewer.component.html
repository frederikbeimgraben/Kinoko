@if (image()) {
  <app-page-header class="viewer__head" [title]="title()" [back]="true" (backClick)="back.emit()" />
  <div class="viewer__body">
    <app-hero
      class="viewer__hero"
      [photo]="heroPhoto()"
      [alt]="alt()"
      [height]="300"
      [index]="index()"
      [count]="count()"
      [interactive]="false"
    />
    <section class="viewer__block">
      <h2 class="viewer__label">{{ 'image.section.image' | t }}</h2>
      <div class="viewer__facts">
        @for (row of details(); track row.labelKey) {
          <app-list-row kind="catalogue" [title]="row.labelKey | t" [value]="row.text">
            @if (row.badgeKey || row.badgeText) {
              <app-level-pill trail [text]="row.badgeKey ? (row.badgeKey | t) : (row.badgeText ?? '')" />
            }
          </app-list-row>
        }
        <ng-content select="[facts]" />
      </div>
    </section>
  </div>
}
