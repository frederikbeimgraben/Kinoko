<app-dialog
  [open]="image() !== null"
  [title]="title()"
  size="lg"
  [closeLabel]="'common.close' | t"
  (closed)="closed.emit()"
>
  @if (image(); as image) {
    <img
      class="viewer__image"
      [src]="image.url"
      [alt]="alt()"
      [width]="image.width"
      [height]="image.height"
    />
    @if (image.caption; as caption) {
      <p class="viewer__caption">{{ caption }}</p>
    }
    <app-key-value-table>
      @for (row of details(); track row.labelKey) {
        <app-key-value-row [key]="row.labelKey | t" [value]="row.text">
          @if (row.badgeKey || row.badgeText) {
            <app-badge variant="primary">{{ row.badgeKey ? (row.badgeKey | t) : row.badgeText }}</app-badge>
          }
        </app-key-value-row>
      }
    </app-key-value-table>
  }
</app-dialog>
