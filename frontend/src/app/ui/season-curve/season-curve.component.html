<div class="spark__stage" [class.spark__stage--large]="large()">
  <svg
    class="spark"
    [attr.viewBox]="'0 0 ' + drawing().width + ' ' + drawing().height"
    preserveAspectRatio="none"
    role="img"
    [attr.aria-label]="label()"
  >
    @if (drawing().thin.length) {
      <defs>
        <!-- Grauwerte statt Farben: die Maske steuert Deckkraft, nicht das Thema. -->
        <mask
          [attr.id]="maskId"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          [attr.width]="drawing().width"
          [attr.height]="drawing().height"
          color-interpolation="sRGB"
        >
          <rect x="0" y="0" [attr.width]="drawing().width" [attr.height]="drawing().height" fill="#ffffff" />
          @for (strip of drawing().thin; track strip.x) {
            <rect
              class="spark__thin"
              [attr.x]="strip.x"
              y="0"
              [attr.width]="strip.width"
              [attr.height]="drawing().height"
              fill="#8c8c8c"
            />
          }
        </mask>
      </defs>
    }
    <line
      class="spark__base"
      x1="0"
      [attr.y1]="drawing().height - 0.5"
      [attr.x2]="drawing().width"
      [attr.y2]="drawing().height - 0.5"
    />
    @for (badge of drawing().badges; track badge) {
      <line
        class="spark__badge"
        [attr.x1]="badge"
        [attr.y1]="drawing().height - 5"
        [attr.x2]="badge"
        [attr.y2]="drawing().height"
      />
    }
    <g [attr.mask]="drawing().thin.length ? 'url(#' + maskId + ')' : null">
      <path class="spark__all" [attr.d]="drawing().alleJahre" />
      @if (drawing().hasCurrent) {
        <path class="spark__current-surface" [attr.d]="drawing().currentArea" />
        <path class="spark__current" [attr.d]="drawing().currentLine" />
      }
    </g>
  </svg>
  @if (drawing().hasCurrent) {
    <span class="spark__end" [style.left.%]="drawing().endLeft" [style.top.%]="drawing().endTop"></span>
  }
</div>
@if (monthMarks().length) {
  <div class="spark__months">
    @for (badge of monthMarks(); track badge.text; let erster = $first; let letzter = $last) {
      <span
        class="spark__month"
        [class.spark__month--first]="erster"
        [class.spark__month--last]="letzter"
        [style.left.%]="badge.links"
        >{{ badge.text }}</span
      >
    }
  </div>
}
@if (legendCurrent() || legendYears()) {
  <div class="spark__legend">
    <span><i class="spark__pattern spark__pattern--line"></i>{{ legendCurrent() }}</span>
    <span><i class="spark__pattern spark__pattern--surface"></i>{{ legendYears() }}</span>
  </div>
}
