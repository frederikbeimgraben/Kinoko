<figure class="tile">
  <app-private-image class="tile__image" [path]="path()" [alt]="alt()" />
  @if (lead()) {
    <app-level-pill
      class="tile__badge"
      [text]="'image.cover' | t"
      colour="var(--color-primary)"
      background="var(--color-primary-subtle)"
    />
  }
  <figcaption class="tile__credit">
    <app-image-credit [photographer]="image().photographer" [licence]="image().licence" />
  </figcaption>
</figure>
