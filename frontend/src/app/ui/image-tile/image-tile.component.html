<figure class="tile">
  <app-private-image class="tile__image" [path]="image().thumbUrl" [alt]="alt()" />
  @if (lead()) {
    <span class="tile__badge" aria-hidden="true">
      <app-svg-icon name="check" [size]="12" />
    </span>
  }
  <figcaption class="tile__credit">
    <app-image-credit [photographer]="image().photographer" [licence]="image().licence" />
  </figcaption>
</figure>
