<header class="pageheader">
  @if (back()) {
    <button
      class="pageheader__back tap"
      type="button"
      data-press="scale"
      [attr.aria-label]="'common.back' | t"
      (click)="backClick.emit()"
    >
      <app-svg-icon name="back" [size]="20" />
    </button>
  }
  <h1 class="pageheader__title">{{ title() }}</h1>
  <div class="pageheader__actions"><ng-content /></div>
</header>
