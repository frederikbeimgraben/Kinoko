<app-page-header [title]="'species.section.taxonomy' | t" [back]="true" (backClick)="back()" />
<div class="pad">
  @if (unknown()) {
    <app-state-view icon="tree" [title]="'species.notFound' | t" />
  } @else if (page() === null) {
    <app-row-group-skeleton [count]="3" [label]="true" trail="value" />
    <app-row-group-skeleton [count]="3" [label]="true" lead="thumb" [lines]="2" trail="chevron" />
  } @else {
    <app-section class="taxonomy__ranks" [label]="'species.taxonomy.rank' | t">
      <app-row-group>
        @for (row of ranks(); track row.route) {
          <app-list-row
            [title]="row.rank"
            [plain]="row.name"
            [clickable]="!row.current"
            (chosen)="toStep(row.route)"
          />
        }
      </app-row-group>
    </app-section>
    @if (children().length > 0) {
      <app-section class="motion-list-in" [label]="childrenTitle()">
        <app-row-group>
          @for (child of children(); track child.route) {
            <app-list-row
              [title]="child.name"
              [plain]="child.count"
              [chevron]="true"
              [clickable]="true"
              (chosen)="toStep(child.route)"
            />
          }
        </app-row-group>
      </app-section>
    }
    @if (species().length > 0) {
      <app-section class="motion-list-in" [label]="speciesTitle()">
        <app-row-group>
          @for (row of species(); track row.slug) {
            <app-list-row
              [title]="row.name"
              [subline]="row.latin"
              [thumbed]="true"
              [chevron]="true"
              [clickable]="true"
              (chosen)="toSpecies(row.slug)"
            >
              <app-private-image lead [path]="row.image" [alt]="row.name" [colour]="row.colour" />
            </app-list-row>
          }
        </app-row-group>
      </app-section>
    }
  }
</div>
