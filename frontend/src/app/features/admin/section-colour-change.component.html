<app-page-header [title]="'species.section.colourChange' | t" [back]="true" (backClick)="back()" />

<div class="section">
  @if (!known()) {
    <app-state-view icon="search" [title]="'admin.part.notFound' | t" />
  } @else {
    <app-row-group>
      <app-list-row
        [title]="'admin.characteristic.part' | t"
        [plain]="partName()"
        [chevron]="true"
        [clickable]="true"
        (chosen)="picking.set(true)"
      />
    </app-row-group>

    <app-section [label]="'admin.category.trigger' | t">
      <app-segmented
        [options]="kinds()"
        [value]="kind()"
        [label]="'admin.category.trigger' | t"
        (valueChange)="chooseKind($event)"
      />
    </app-section>

    <app-section [label]="'admin.colourChange.kind' | t">
      <app-chip-group
        [small]="true"
        [chips]="triggerChips()"
        [value]="triggers()"
        [multiple]="true"
        [label]="'admin.colourChange.kind' | t"
        (valueChange)="triggers.set($event)"
      />
    </app-section>

    <app-section [label]="'common.colour' | t">
      <app-row-group>
        <app-list-row
          [title]="'common.from' | t"
          [subline]="fromName() ?? ('common.optional' | t)"
          [swatch]="from()?.hex ?? ''"
          [selected]="openEnd() === 'from'"
          [chevron]="true"
          [clickable]="true"
          (chosen)="openEnd.set('from')"
        />
        <app-list-row
          [title]="'admin.colourChange.to' | t"
          [subline]="toName()"
          [swatch]="to()?.hex ?? ''"
          [selected]="openEnd() === 'to'"
          [chevron]="true"
          [clickable]="true"
          (chosen)="openEnd.set('to')"
        />
      </app-row-group>
      <div class="section__palette">
        <app-colour-picker
          [colours]="swatches()"
          [value]="openHex()"
          [labels]="false"
          [label]="(openEnd() === 'from' ? 'common.from' : 'admin.colourChange.to') | t"
          (valueChange)="chooseHex($event)"
        />
      </div>
    </app-section>

    <app-section [label]="'admin.colourChange.speed' | t">
      <app-chip-group
        [small]="true"
        [chips]="speedChips()"
        [value]="speedValue()"
        [label]="'admin.colourChange.speed' | t"
        (valueChange)="chooseSpeed($event)"
      />
    </app-section>

    <app-action-bar
      [primary]="'common.apply' | t"
      primaryIcon="check"
      [secondary]="isNew() ? undefined : ('admin.colourChange.remove' | t)"
      secondaryIcon="trash"
      [secondaryDanger]="true"
      [stacked]="true"
      (primaryClick)="apply()"
      (secondaryClick)="remove()"
    />
  }
</div>

<app-option-sheet
  [open]="picking()"
  [title]="'admin.characteristic.part' | t"
  [options]="parts()"
  [selected]="part()"
  (chosen)="choosePart($event)"
  (closed)="picking.set(false)"
/>
