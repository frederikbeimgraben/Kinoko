<app-page-header [title]="'admin.lookalike.title' | t" [back]="true" (backClick)="back()" />

@if (picking()) {
  <div class="section">
    <app-species-picker
      [species]="choices()"
      [selected]="other()"
      [label]="'admin.lookalike.species' | t"
      (chosen)="choose($event)"
    />
  </div>
  <app-action-bar [primary]="'common.cancel' | t" [ghost]="true" (primaryClick)="picking.set(false)" />
} @else {
  <div class="section">
    <app-row-group>
      <app-list-row
        icon="mushroom"
        [title]="otherNames().name"
        [subline]="otherNames().latin"
        [chevron]="true"
        [clickable]="true"
        (chosen)="picking.set(true)"
      />
    </app-row-group>

    <app-section [label]="'admin.lookalike.distinction' | t">
      <app-form-field
        [label]="'admin.lookalike.distinction' | t"
        [hideLabel]="true"
        [multiline]="true"
        [value]="difference()"
        (valueChange)="difference.set($event)"
      />
    </app-section>

    <app-action-bar
      [primary]="'common.apply' | t"
      primaryIcon="check"
      [secondary]="known() ? ('admin.lookalike.remove' | t) : undefined"
      secondaryIcon="trash"
      [secondaryDanger]="true"
      [stacked]="true"
      (primaryClick)="apply()"
      (secondaryClick)="remove()"
    />
  </div>
}
