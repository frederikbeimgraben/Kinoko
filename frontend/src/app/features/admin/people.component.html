<app-page-header [title]="'personen.titel' | t" [back]="true" (backClick)="back()" />

<div class="people">
  <app-form-field
    icon="search"
    [label]="'personen.suche' | t"
    [hideLabel]="true"
    [value]="search()"
    [placeholder]="'personen.suche' | t"
    (valueChange)="onSearch($event)"
  />

  @if (loaded() && rows().length === 0) {
    <app-empty-state [text]="'personen.leer' | t" />
  } @else {
    <app-card>
      @for (row of rows(); track row.sub) {
        <app-list-row
          [title]="row.name"
          [subline]="row.email"
          [value]="row.roles"
          [clickable]="true"
          (chosen)="edit(row.sub)"
        />
      }
    </app-card>
    <p class="note note--sub">{{ count() }}</p>
    <p class="note">{{ 'personen.hinweis' | t }}</p>
  }
</div>

<app-confirm-dialog
  [open]="editing() !== null"
  [title]="dialogTitle()"
  [danger]="false"
  [confirmLabel]="'personen.speichern' | t"
  [confirmDisabled]="saving()"
  (confirmed)="save()"
  (cancelled)="close()"
>
  <app-card>
    @for (choice of choices(); track choice.id) {
      <app-check-row [title]="choice.name" [checked]="choice.checked" (toggled)="toggle(choice.id, $event)" />
    }
  </app-card>
  <p class="note">{{ 'personen.rollenHinweis' | t }}</p>
</app-confirm-dialog>
