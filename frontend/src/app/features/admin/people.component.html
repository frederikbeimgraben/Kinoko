<app-page-header [title]="null" [back]="true" [wide]="wide()" (backClick)="back()">
  <app-search-field
    headline
    [value]="search()"
    [placeholder]="'admin.people.searchPlaceholder' | t"
    (valueChange)="onSearch($event)"
  />
</app-page-header>

<div class="people">
  @if (!loaded()) {
    <app-row-group-skeleton [count]="5" [lines]="2" trail="badge" />
  } @else if (rows().length === 0) {
    <app-state-view icon="search" [title]="'admin.people.empty' | t" />
  } @else {
    <app-row-group>
      @for (row of rows(); track row.id) {
        <app-list-row
          [title]="row.name"
          [subline]="row.roles"
          [clickable]="true"
          [chevron]="true"
          (chosen)="edit(row.id)"
        />
      }
    </app-row-group>
  }
</div>

<app-overlay-host [open]="editing() !== null" [modal]="true" (closed)="close()">
  @if (editing(); as person) {
    <app-sheet
      [label]="'admin.people.assignRoles' | t"
      [title]="'admin.people.assignRoles' | t"
      [modal]="true"
      (closed)="close()"
    >
      <div class="people__sheet">
        <div class="people__who">
          <span class="people__avatar"><app-svg-icon name="account" [size]="22" [strokeWidth]="1.8" /></span>
          <span class="people__names">
            <b>{{ person.name ?? person.email ?? '' }}</b>
            @if (person.name && person.email) {
              <small>{{ person.email }}</small>
            }
          </span>
        </div>
        <app-row-group>
          @for (choice of choices(); track choice.id) {
            <app-check-row
              [title]="choice.name"
              [subline]="choice.note ? (choice.note | t) : undefined"
              [checked]="choice.checked"
              [locked]="choice.locked"
              (toggled)="toggle(choice.id, $event)"
            />
          }
        </app-row-group>
      </div>
      <app-action-bar
        foot
        [primary]="'common.apply' | t"
        [secondary]="'admin.people.delete' | t"
        [secondaryDanger]="true"
        [busy]="saving()"
        (primaryClick)="save()"
        (secondaryClick)="askDelete()"
      />
    </app-sheet>
  }
</app-overlay-host>

<app-confirm-dialog
  [open]="removing() !== null"
  [title]="deleteQuestion()"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="removing.set(null)"
/>
