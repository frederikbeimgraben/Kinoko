<app-page-header [title]="'admin.people.title' | t" [back]="!wide()" [wide]="wide()" (backClick)="back()" />

<div class="people">
  <app-search-field
    [value]="search()"
    [placeholder]="'admin.people.searchPlaceholder' | t"
    (valueChange)="onSearch($event)"
  />
  @if (!loaded()) {
    <app-row-group-skeleton [count]="5" [lines]="2" trail="badge" />
  } @else if (rows().length === 0) {
    <app-state-view icon="search" [title]="'admin.people.empty' | t" />
  } @else {
    <app-row-group>
      @for (row of rows(); track row.id) {
        <app-list-row
          [title]="row.name"
          [subline]="row.email"
          [clickable]="true"
          [accent]="true"
          (chosen)="edit(row.id)"
        >
          <span trail class="people__roles">
            @for (role of row.roles; track role.id) {
              <app-level-pill [text]="role.name" />
            }
          </span>
        </app-list-row>
      }
    </app-row-group>
  }
</div>

<app-overlay-host [open]="editing() !== null" [modal]="true" (closed)="close()">
  @if (editing(); as person) {
    <app-sheet
      [label]="person.name ?? ''"
      [title]="person.name ?? ''"
      [note]="person.email ?? ''"
      [modal]="true"
      (closed)="close()"
    >
      <app-row-group>
        @for (choice of choices(); track choice.id) {
          <app-check-row
            [title]="choice.name"
            [checked]="choice.checked"
            (toggled)="toggle(choice.id, $event)"
          />
        }
      </app-row-group>
      <app-action-bar
        foot
        [primary]="'common.apply' | t"
        [secondary]="'admin.people.delete' | t"
        [secondaryDanger]="true"
        [busy]="saving()"
        (primaryClick)="save()"
        (secondaryClick)="askDelete()"
      />
    </app-sheet>
  }
</app-overlay-host>

<app-confirm-dialog
  [open]="removing() !== null"
  [title]="deleteQuestion()"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="removing.set(null)"
/>
