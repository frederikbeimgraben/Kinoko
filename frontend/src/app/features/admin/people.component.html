<app-page-header [title]="'admin.people.title' | t" [back]="true" (backClick)="back()" />

<div class="people">
  <app-search-field
    [value]="search()"
    [placeholder]="'admin.people.searchPlaceholder' | t"
    (valueChange)="onSearch($event)"
  />
  <div class="people__card">
    @for (row of rows(); track row.id) {
      <app-list-row
        kind="catalogue"
        [title]="row.name"
        [subline]="row.email"
        [clickable]="true"
        (chosen)="edit(row.id)"
      >
        <span trail class="people__roles">
          @for (role of row.roles; track role.id) {
            <app-badge [variant]="role.lead ? 'primary' : 'neutral'">{{ role.name }}</app-badge>
          }
        </span>
      </app-list-row>
    }
  </div>
</div>

<app-overlay-host [open]="editing() !== null" [modal]="true" (closed)="close()">
  @if (editing(); as person) {
    <app-sheet
      [label]="person.name ?? ''"
      [title]="person.name ?? ''"
      [note]="person.email ?? ''"
      [modal]="true"
      [detents]="DETENTS"
      (closed)="close()"
    >
      <div head class="people__head">
        <b class="people__name">{{ person.name }}</b>
        <span class="people__mail">{{ person.email }}</span>
      </div>
      <div class="people__choices">
        @for (choice of choices(); track choice.id) {
          <app-check-row
            [title]="choice.name"
            [checked]="choice.checked"
            (toggled)="toggle(choice.id, $event)"
          />
        }
      </div>
      <app-action-bar [primary]="'common.apply' | t" [busy]="saving()" (primaryClick)="save()" />
    </app-sheet>
  }
</app-overlay-host>
