<app-page-header [title]="'admin.texts.title' | t" [back]="!wide()" [wide]="wide()" (backClick)="back()" />

<div class="texts">
  <app-search-field
    [value]="search()"
    [placeholder]="'admin.texts.searchPlaceholder' | t"
    (valueChange)="search.set($event)"
  />
  <app-segmented
    [options]="scopes()"
    [value]="scope()"
    [label]="'admin.texts.filter' | t"
    (valueChange)="scope.set($event)"
  />

  @if (loaded()) {
    <div class="texts__group">
      @for (row of rows(); track row.key) {
        <button class="texts__row tap" type="button" (click)="open(row)">
          <span class="texts__head">
            <span class="texts__key">{{ row.key }}</span>
            @if (row.changed) {
              <app-level-pill [text]="'admin.texts.changed' | t" />
            }
          </span>
          <span class="texts__values">
            @for (locale of locales; track locale) {
              <span class="texts__value">
                <span class="lbl">{{ localeLabel(locale) }}</span>
                <span class="texts__text" [class.texts__text--other]="locale !== leadLocale">
                  {{ row.values[locale] }}
                </span>
              </span>
            }
          </span>
        </button>
      }
    </div>
  } @else {
    <app-row-group-skeleton [count]="6" [lines]="3" />
  }
</div>

<app-overlay-host [open]="draft() !== null" [modal]="true" (closed)="close()">
  @if (draft(); as open) {
    <app-sheet [label]="open.key" [title]="open.key" [modal]="true" (closed)="close()">
      <span titleLead class="texts__mark">
        @if (resettable()) {
          <app-level-pill [text]="'admin.texts.changed' | t" />
        }
      </span>
      <div class="texts__form">
        @for (locale of locales; track locale) {
          <div class="texts__field">
            <span class="lbl">{{ localeLabel(locale) }}</span>
            <app-form-field
              [label]="localeLabel(locale)"
              [hideLabel]="true"
              [multiline]="true"
              [value]="open.values[locale]"
              (valueChange)="edit(locale, $event)"
            />
          </div>
        }
      </div>
      <app-action-bar
        foot
        [primary]="'common.save' | t"
        [secondary]="resettable() ? ('admin.texts.reset' | t) : undefined"
        [busy]="busy()"
        (primaryClick)="save()"
        (secondaryClick)="reset()"
      />
    </app-sheet>
  }
</app-overlay-host>
