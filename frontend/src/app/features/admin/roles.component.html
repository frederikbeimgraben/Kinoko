<app-page-header [title]="'admin.roles.title' | t" [back]="!wide()" [wide]="wide()" (backClick)="back()" />

<div class="roles">
  @if (loaded()) {
    <app-row-group>
      @for (row of rows(); track row.id) {
        <app-list-row
          [title]="row.name"
          [subline]="row.subline"
          [clickable]="true"
          [chevron]="true"
          (chosen)="open(row.id)"
        >
          @if (row.locked) {
            <app-svg-icon trail name="lock" tone="dim" [size]="18" [label]="lockLabel()" />
          }
        </app-list-row>
      }
    </app-row-group>
    <app-add-row [label]="'admin.roles.add' | t" [action]="'admin.role.create' | t" (pressed)="create()" />
  } @else {
    <app-row-group-skeleton [count]="4" [lines]="2" trail="chevron" />
  }
</div>
