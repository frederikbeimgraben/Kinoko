<app-page-header [title]="'admin.species.title' | t" [back]="true" (backClick)="back()">
  <button class="species__filter tap" type="button" data-press="tint" (click)="filter.openSheet()">
    <app-svg-icon name="filter" [size]="17" [strokeWidth]="1.8" />
    {{ 'common.filter' | t }}
  </button>
</app-page-header>

<div class="species">
  <app-search-field
    [value]="query()"
    [loading]="loading()"
    [placeholder]="'admin.species.searchPlaceholder' | t"
    (valueChange)="find($event)"
  />
  <div class="species__legend">
    @for (column of columns; track column) {
      <span>{{ columnTitle(column) }}</span>
    }
    <i></i>
  </div>
  <app-infinite-list class="species__list" [hasMore]="hasMore()" (more)="more()">
    <app-add-row
      [label]="'admin.species.add' | t"
      [action]="'admin.species.create' | t"
      (pressed)="create()"
    />
    <div class="species__card">
      @for (row of rows(); track row.slug) {
        <app-list-row
          kind="catalogue"
          [title]="row.name"
          [subline]="row.latin"
          [accent]="true"
          [clickable]="true"
          (chosen)="open(row.slug)"
        >
          <span trail class="species__counts">
            @for (count of row.counts; track $index) {
              <span>{{ count }}</span>
            }
            @if (row.forecast) {
              <i class="species__mark"></i>
            } @else {
              <app-svg-icon
                class="species__mark"
                name="map-off"
                [size]="14"
                [strokeWidth]="1.5"
                [label]="noForecast()"
              />
            }
          </span>
        </app-list-row>
      }
    </div>
  </app-infinite-list>
</div>

<app-species-filter-sheet />
