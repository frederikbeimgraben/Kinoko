<app-page-header
  [title]="'admin.categories.title' | t"
  [back]="!wide()"
  [wide]="wide()"
  (backClick)="back()"
/>

<div class="categories">
  <app-segmented
    [options]="kinds()"
    [value]="kind()"
    [label]="'admin.category.section' | t"
    (valueChange)="onKind($event)"
  />
  <app-search-field
    [value]="search()"
    [placeholder]="'admin.categories.search' | t"
    (valueChange)="onSearch($event)"
  />
  @if (loaded()) {
    <app-row-group>
      @for (category of rows(); track category.id) {
        <app-list-row
          [title]="category.name"
          [plain]="category.usage"
          [clickable]="true"
          (chosen)="edit(category.id)"
        >
          <app-svg-icon trail name="edit" tone="dim" [size]="22" [strokeWidth]="1.8" />
        </app-list-row>
      }
      <app-add-row [label]="'admin.category.add' | t" [action]="'admin.category.add' | t" (pressed)="add()" />
    </app-row-group>
  } @else {
    <app-row-group-skeleton [count]="6" [lines]="2" trail="chevron" />
  }
</div>

@if (editing() && asking() === null) {
  <app-form-sheet
    [title]="sheetTitle()"
    [submit]="'common.save' | t"
    [secondary]="'common.delete' | t"
    [secondaryDanger]="true"
    [busy]="saving()"
    (submitted)="save()"
    (secondaryPressed)="askDelete()"
    (cancelled)="close()"
  >
    <app-form-field [label]="'common.name' | t" [value]="name()" (valueChange)="name.set($event)" />
    @if (editing() !== 'neu') {
      <app-row-group>
        <app-list-row
          [title]="'admin.categories.merge' | t"
          [clickable]="true"
          [chevron]="true"
          (chosen)="pick()"
        />
      </app-row-group>
    }
  </app-form-sheet>
}

<app-option-sheet
  [open]="picking()"
  [title]="'admin.categories.mergeTarget' | t"
  [options]="targets()"
  (chosen)="onTarget($event)"
  (closed)="picking.set(false)"
/>

<app-confirm-dialog
  [open]="asking() !== null"
  [title]="askTitle()"
  [confirmLabel]="asking() === 'merge' ? ('admin.categories.merge' | t) : undefined"
  [confirmDisabled]="saving()"
  (confirmed)="confirm()"
  (cancelled)="cancel()"
/>
