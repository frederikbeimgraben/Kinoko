<div class="admin" [class.admin--split]="wide()">
  @if (showList()) {
    <div class="admin__list">
      <app-page-header [title]="'admin.title' | t" [back]="true" [wide]="wide()" (backClick)="back()" />
      <div class="admin__body">
        @if (waiting()) {
          <app-row-group-skeleton [count]="4" [label]="true" [lines]="2" trail="chevron" />
        } @else {
          @for (block of blocks(); track block.title) {
            <app-section class="motion-list-in" [label]="block.title">
              <app-row-group>
                @for (row of block.rows; track row.path) {
                  <app-list-row
                    [title]="row.title"
                    [badge]="row.badge"
                    [clickable]="row.ready"
                    [chevron]="true"
                    [selected]="wide() && chosen(row.path)"
                    (chosen)="open(row.path)"
                  />
                }
              </app-row-group>
            </app-section>
          }
        }
      </div>
    </div>
  }
  @if (wide() || onEntry()) {
    <div class="admin__detail">
      <router-outlet />
    </div>
  }
</div>
