<app-dialog
  [open]="open()"
  [title]="'bild.grundFrage' | t"
  [closeLabel]="'objekt.schliessen' | t"
  (closed)="cancel()"
>
  <app-chip-group
    [chips]="chips()"
    [value]="reason() ? [reason()] : []"
    [label]="'bild.grundVorschlaege' | t"
    (valueChange)="pick($event.at(0) ?? '')"
  />
  <app-form-field
    class="reject__field"
    [label]="'bild.grundFeld' | t"
    [placeholder]="'bild.grundPlatzhalter' | t"
    [multiline]="true"
    [value]="reason()"
    (valueChange)="write($event)"
  />
  <p class="note note--sub">{{ hint() }}</p>
  <div dialog-footer>
    <app-action-bar
      [primary]="'bild.ablehnen' | t"
      [danger]="true"
      [secondary]="'objekt.abbrechen' | t"
      (primaryClick)="confirm()"
      (secondaryClick)="cancel()"
    />
  </div>
</app-dialog>
