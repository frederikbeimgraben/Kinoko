<app-page-header [title]="'species.section.period' | t" [back]="true" (backClick)="back()" />

<div class="section">
  <div class="section__band">
    <app-year-band-input
      [from]="from()"
      [to]="to()"
      [label]="'species.section.period' | t"
      (fromChange)="from.set($event)"
      (toChange)="to.set($event)"
    />
  </div>

  <app-row-group>
    <app-list-row
      [title]="'common.from' | t"
      [plain]="fromName()"
      [chevron]="true"
      [clickable]="true"
      (chosen)="picking.set('from')"
    />
    <app-list-row
      [title]="'common.to' | t"
      [plain]="toName()"
      [chevron]="true"
      [clickable]="true"
      (chosen)="picking.set('to')"
    />
    <app-list-row
      [title]="'admin.season.peak' | t"
      [plain]="peakName()"
      [chevron]="true"
      [clickable]="true"
      (chosen)="picking.set('peak')"
    />
  </app-row-group>
</div>

<app-action-bar [primary]="'common.apply' | t" (primaryClick)="apply()" />

<app-option-sheet
  [open]="picking() !== null"
  [title]="pickTitle()"
  [options]="months()"
  [selected]="picked()"
  (chosen)="choose($event)"
  (closed)="picking.set(null)"
/>
