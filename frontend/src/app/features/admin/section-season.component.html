<app-page-header [title]="'species.section.period' | t" [back]="true" (backClick)="back()" />

<div class="section">
  <div class="section__band">
    <app-year-band-input
      [from]="from()"
      [to]="to()"
      [label]="'species.section.period' | t"
      (fromChange)="from.set($event)"
      (toChange)="to.set($event)"
    />
  </div>

  @for (field of fields(); track field.id) {
    <app-section [label]="field.label">
      <app-row-group>
        <app-list-row [title]="field.value" [clickable]="true" (chosen)="picking.set(field.id)" />
      </app-row-group>
    </app-section>
  }

  <app-action-bar
    [primary]="'common.apply' | t"
    primaryIcon="check"
    [stacked]="true"
    (primaryClick)="apply()"
  />
</div>

<app-option-sheet
  [open]="picking() !== null"
  [title]="pickTitle()"
  [options]="choices()"
  [selected]="picked()"
  (chosen)="choose($event)"
  (closed)="picking.set(null)"
/>
