<app-page-header [title]="'species.section.period' | t" [back]="true" (backClick)="back()" />

<div class="section">
  <figure class="section__curve">
    <svg
      [attr.viewBox]="curveSize"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="'species.section.period' | t"
    >
      <path class="section__area" [attr.d]="curve().area" />
      <path class="section__line" [attr.d]="curve().line" />
    </svg>
    <figcaption class="section__months" aria-hidden="true">
      @for (month of curveMonths(); track $index) {
        <span>{{ month }}</span>
      }
    </figcaption>
  </figure>

  @for (field of fields(); track field.id) {
    <app-section [label]="field.label">
      <app-row-group>
        <app-list-row [title]="field.value" [clickable]="true" (chosen)="picking.set(field.id)" />
      </app-row-group>
    </app-section>
  }

  <app-action-bar
    [primary]="'common.apply' | t"
    primaryIcon="check"
    [stacked]="true"
    (primaryClick)="apply()"
  />
</div>

<app-option-sheet
  [open]="picking() !== null"
  [title]="pickTitle()"
  [options]="choices()"
  [selected]="picked()"
  (chosen)="choose($event)"
  (closed)="picking.set(null)"
/>
