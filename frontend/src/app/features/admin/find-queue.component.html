<app-page-header [title]="'find.queue.title' | t" [back]="true" (backClick)="back()">
  @if (loaded()) {
    <app-level-pill class="queue__badge" kind="ok" aria-hidden="true" [text]="'' + open()" />
    <span class="sr-only">{{ openLabel() }}</span>
  }
  @if (open() > 1) {
    <app-icon-button
      icon="check"
      [label]="'find.queue.acceptAll' | t"
      [disabled]="accepting()"
      (pressed)="asking.set(true)"
    />
  }
</app-page-header>

<div class="queue" [class.queue--empty]="loaded() && open() === 0">
  @if (!loaded()) {
    <app-queue-card-skeleton />
  } @else if (cards().length === 0) {
    <app-state-view icon="check" [title]="'find.queue.empty' | t" />
  } @else {
    <app-review-queue
      [balance]="true"
      [items]="cards()"
      (accepted)="accept($event)"
      (rejected)="reject($event)"
      (undone)="undo()"
    >
      <app-state-view icon="check" [title]="'find.queue.empty' | t" />
      <ng-template let-card>
        <article class="card">
          <app-find-map class="card__map" [point]="card.point" [colour]="card.colour" />
          <div class="card__body">
            <app-object-title
              [level]="2"
              [title]="card.species"
              [sub]="card.note"
              [colour]="card.colour"
              [photo]="card.photo"
            />
            <div class="card__rows">
              @for (row of card.rows; track row.label) {
                <app-list-row [title]="row.label" [plain]="row.value" />
              }
            </div>
          </div>
        </article>
      </ng-template>
    </app-review-queue>
  }
</div>

<app-confirm-dialog
  [open]="asking()"
  [title]="'find.queue.acceptAllConfirm' | t"
  [meta]="openLabel()"
  [danger]="false"
  [confirmLabel]="'find.queue.acceptAll' | t"
  (confirmed)="acceptAll()"
  (cancelled)="asking.set(false)"
/>
