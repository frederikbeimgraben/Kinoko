<app-page-header [title]="'admin.source.title' | t" [back]="true" (backClick)="back()" />

<div class="section">
  <app-section [label]="'admin.source.section.scope' | t">
    <app-segmented
      [options]="scopes()"
      [value]="scope()"
      [label]="'admin.source.section.scope' | t"
      (valueChange)="chooseScope($event)"
    />
  </app-section>

  <app-section [label]="'admin.source.field.title' | t">
    <app-form-field
      [label]="'admin.source.field.title' | t"
      [hideLabel]="true"
      [value]="title()"
      (valueChange)="title.set($event)"
    />
  </app-section>

  <app-section [label]="'admin.source.field.url' | t">
    <app-form-field
      [label]="'admin.source.field.url' | t"
      [hideLabel]="true"
      [value]="url()"
      (valueChange)="url.set($event)"
    />
  </app-section>

  <app-section [label]="'admin.source.field.checkedOn' | t">
    <app-form-field
      [label]="'admin.source.field.checkedOn' | t"
      [hideLabel]="true"
      [kind]="'date'"
      [value]="checkedOn()"
      [display]="checkedDay()"
      (valueChange)="checkedOn.set($event)"
    />
  </app-section>

  <app-action-bar
    [primary]="'common.apply' | t"
    primaryIcon="check"
    [secondary]="known() ? ('admin.source.remove' | t) : undefined"
    secondaryIcon="trash"
    [secondaryDanger]="true"
    [stacked]="true"
    (primaryClick)="apply()"
    (secondaryClick)="remove()"
  />
</div>
