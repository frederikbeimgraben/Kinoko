<app-page-header [title]="'admin.species.create' | t" [back]="true" (backClick)="back()" />

<div class="create">
  <app-section [label]="'admin.species.field.name' | t">
    <app-form-field
      [label]="'admin.species.field.name' | t"
      [hideLabel]="true"
      [value]="draft().name"
      (valueChange)="set('name', $event)"
    />
  </app-section>

  <app-section [label]="'admin.species.field.scientificName' | t">
    <app-form-field
      [label]="'admin.species.field.scientificName' | t"
      [hideLabel]="true"
      [value]="draft().scientificName"
      (valueChange)="set('scientificName', $event)"
    />
  </app-section>

  <app-section [label]="'admin.species.altNamesPlaceholder' | t">
    <app-form-field
      [label]="'admin.species.altNamesPlaceholder' | t"
      [placeholder]="'common.optional' | t"
      [hideLabel]="true"
      [value]="draft().otherNames"
      (valueChange)="set('otherNames', $event)"
    />
  </app-section>

  <app-row-group>
    <app-list-row
      [title]="'admin.species.section.classification' | t"
      [plain]="groupName()"
      [chevron]="true"
      [clickable]="true"
      (chosen)="picking.set('group')"
    />
  </app-row-group>

  <app-section [label]="'admin.species.field.edibility' | t">
    <app-segmented
      [options]="edibilities()"
      [value]="draft().edibility"
      [label]="'admin.species.field.edibility' | t"
      (valueChange)="set('edibility', $event)"
    />
  </app-section>

  <app-row-group>
    <app-check-row
      [title]="'admin.species.field.protectedByLaw' | t"
      [checked]="draft().protected"
      (toggled)="set('protected', $event)"
    />
  </app-row-group>

  <app-section [label]="'admin.species.field.source' | t">
    <app-form-field
      [label]="'admin.species.field.source' | t"
      [hideLabel]="true"
      [placeholder]="'admin.species.sourcePlaceholder' | t"
      [value]="draft().source"
      (valueChange)="set('source', $event)"
    />
  </app-section>
</div>

<app-action-bar
  [primary]="'admin.species.createAndCheckTraits' | t"
  [secondary]="'common.cancel' | t"
  [busy]="saving()"
  (primaryClick)="create()"
  (secondaryClick)="back()"
/>

<app-overlay-host [open]="picking() !== null" [modal]="true" (closed)="picking.set(null)">
  @if (picking() !== null) {
    <app-sheet
      [label]="pickerTitle()"
      [title]="pickerTitle()"
      [modal]="true"
      [detents]="DETENTS"
      (closed)="picking.set(null)"
    >
      <div class="create__choices">
        @for (choice of choices(); track choice.key) {
          <app-list-row
            kind="catalogue"
            [title]="choice.name"
            [clickable]="true"
            [selected]="choice.key === chosen()"
            (chosen)="choose(choice.key)"
          />
        }
      </div>
    </app-sheet>
  }
</app-overlay-host>
