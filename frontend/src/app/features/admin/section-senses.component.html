<app-page-header [title]="'species.section.senses' | t" [back]="true" (backClick)="back()" />

<div class="section">
  @for (block of blocks(); track block.sense) {
    <app-section [label]="title(block.sense)">
      <app-chip-group
        [small]="true"
        [chips]="block.chips"
        [value]="block.chosen"
        [multiple]="true"
        [label]="title(block.sense)"
        (valueChange)="choose(block.sense, $event)"
      />
    </app-section>

    <app-section [label]="title(block.sense)">
      <app-form-field
        [label]="title(block.sense)"
        [hideLabel]="true"
        [multiline]="true"
        [value]="block.note"
        (valueChange)="write(block.sense, $event)"
      />
    </app-section>
  }

  <app-action-bar
    [primary]="'common.apply' | t"
    primaryIcon="check"
    [stacked]="true"
    (primaryClick)="apply()"
  />
</div>
