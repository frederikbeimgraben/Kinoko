<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="section">
  @if (part() === null) {
    <app-state-view icon="search" [title]="'admin.part.notFound' | t" />
  } @else {
    <app-section [label]="'admin.size.section.dimension' | t">
      <app-segmented
        [options]="choices()"
        [value]="dimension()"
        [label]="'admin.size.section.dimension' | t"
        (valueChange)="chooseDimension($event)"
      />
    </app-section>

    <app-section [label]="'common.from' | t">
      <div class="section__number">
        <app-form-field
          [label]="'common.from' | t"
          [hideLabel]="true"
          inputMode="decimal"
          [value]="low()"
          (valueChange)="low.set($event)"
        />
        <span class="section__unit" aria-hidden="true">{{ unitText() }}</span>
      </div>
    </app-section>

    <app-section [label]="'common.to' | t">
      <div class="section__number">
        <app-form-field
          [label]="'common.to' | t"
          [hideLabel]="true"
          inputMode="decimal"
          [value]="high()"
          (valueChange)="high.set($event)"
        />
        <span class="section__unit" aria-hidden="true">{{ unitText() }}</span>
      </div>
    </app-section>

    <app-section [label]="'admin.size.unit' | t">
      <app-segmented
        [options]="units()"
        [value]="unit()"
        [label]="'admin.size.unit' | t"
        (valueChange)="chooseUnit($event)"
      />
    </app-section>
  }
</div>

@if (part() !== null) {
  <app-action-bar
    [primary]="'common.apply' | t"
    [secondary]="'admin.size.remove' | t"
    [secondaryDanger]="true"
    (primaryClick)="apply()"
    (secondaryClick)="remove()"
  />
}
