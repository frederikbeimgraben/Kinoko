<app-page-header [title]="'species.section.hymenium' | t" [back]="true" (backClick)="back()" />

<div class="section">
  <app-section [label]="'admin.hymenium.type' | t">
    <app-segmented
      [options]="kinds()"
      [value]="kind() ?? ''"
      [label]="'admin.hymenium.type' | t"
      (valueChange)="chooseKind($event)"
    />
  </app-section>

  @for (one of fields(); track one.field) {
    <app-section [label]="one.title">
      <app-chip-group
        [small]="true"
        [chips]="one.chips"
        [value]="one.value"
        [label]="one.title"
        (valueChange)="chooseField(one.field, $event)"
      />
    </app-section>
  }

  @if (colours().length > 0) {
    <app-section [label]="'common.colour' | t">
      <app-row-group>
        @for (row of colours(); track row.key) {
          <app-list-row
            [title]="row.title"
            [subline]="row.subline"
            [swatch]="row.swatch"
            [chevron]="true"
            [clickable]="true"
            (chosen)="openColour(row.at)"
          />
        }
      </app-row-group>
    </app-section>
  }
</div>

<app-action-bar [primary]="'common.apply' | t" (primaryClick)="apply()" />
