<app-page-header [title]="'admin.runs.title' | t" [back]="!wide()" [wide]="wide()" (backClick)="back()" />

<div class="runs">
  @if (active(); as run) {
    <button class="runs__active tap" type="button" (click)="open(run.id)">
      <span class="runs__head">
        <i class="runs__dot runs__dot--running"></i>
        <span class="runs__name">{{ run.title }}</span>
        <app-level-pill [text]="run.state" />
      </span>
      <span class="runs__sub">{{ run.subline }}</span>
      <app-progress [value]="run.percent" />
    </button>
  }

  @if (!loaded()) {
    <app-row-group-skeleton [count]="5" [label]="true" [lines]="2" trail="value" />
  } @else if (rows().length === 0 && active() === null) {
    <app-state-view icon="hourglass" [title]="'admin.runs.empty' | t" />
  } @else if (rows().length > 0) {
    <app-section [label]="'admin.runs.section.recent' | t">
      <app-row-group>
        @for (row of rows(); track row.id) {
          <app-list-row
            [title]="row.title"
            [subline]="row.subline"
            [value]="row.duration"
            [clickable]="true"
            (chosen)="open(row.id)"
          >
            <i lead class="runs__dot" [class.runs__dot--failed]="row.failed"></i>
          </app-list-row>
        }
      </app-row-group>
    </app-section>
  }
</div>

<app-action-bar [primary]="'admin.runs.start' | t" (primaryClick)="starting.set(true)" />

<app-confirm-dialog
  [open]="starting()"
  [title]="'admin.runs.startConfirm' | t"
  [meta]="missing()"
  [danger]="false"
  [confirmLabel]="'admin.runs.startAction' | t"
  [confirmDisabled]="missing() !== ''"
  (confirmed)="start()"
  (cancelled)="starting.set(false)"
>
  <app-segmented
    [options]="choices()"
    [value]="kind()"
    [label]="'admin.runs.startConfirm' | t"
    (valueChange)="chooseKind($event)"
  />
</app-confirm-dialog>
