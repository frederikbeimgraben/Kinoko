<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="role">
  @if (missing()) {
    <p class="note">{{ 'rolle.nichtGefunden' | t }}</p>
  } @else {
    @if (!locked()) {
      <app-form-field
        [label]="'rolle.name' | t"
        [hideLabel]="true"
        [value]="name()"
        [placeholder]="'rolle.namePlatzhalter' | t"
        (valueChange)="name.set($event)"
      />
      @if (creating()) {
        <app-form-field
          [label]="'rolle.slug' | t"
          [hideLabel]="true"
          [value]="slug()"
          [placeholder]="'rolle.slugPlatzhalter' | t"
          (valueChange)="slug.set($event)"
        />
      }
      <app-form-field
        [label]="'rolle.beschreibung' | t"
        [hideLabel]="true"
        [value]="description()"
        [placeholder]="'admin.role.namePlaceholder' | t"
        (valueChange)="description.set($event)"
      />
    }

    @for (group of areas(); track group.area) {
      <section class="role__block">
        <h2 class="role__section">{{ group.titel }}</h2>
        <div class="role__rights">
          @for (right of group.rights; track right.key) {
            <app-check-row
              [title]="right.titel"
              [checked]="right.checked"
              [locked]="locked()"
              (toggled)="toggle(right.key, $event)"
            />
          }
        </div>
      </section>
    }
  }
</div>

@if (!locked() && !missing()) {
  <app-action-bar
    [primary]="'rolle.speichern' | t"
    [secondary]="creating() ? undefined : ('admin.role.delete' | t)"
    [secondaryDanger]="true"
    (primaryClick)="save()"
    (secondaryClick)="confirming.set(true)"
  />
}

<app-confirm-dialog
  [open]="confirming()"
  [title]="deleteQuestion()"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="confirming.set(false)"
/>
