<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="role">
  @if (missing()) {
    <app-state-view icon="lock" [title]="'admin.role.notFound' | t" />
  } @else if (waiting()) {
    <app-row-group-skeleton [count]="3" />
    <app-row-group-skeleton [count]="4" [label]="true" />
  } @else {
    <app-form-field
      [label]="'common.name' | t"
      [hideLabel]="true"
      [value]="displayName()"
      [placeholder]="'admin.role.namePlaceholder' | t"
      [readOnly]="locked()"
      (valueChange)="name.set($event)"
    />
    @if (creating()) {
      <app-form-field
        [label]="'admin.role.slug' | t"
        [hideLabel]="true"
        [value]="slug()"
        [placeholder]="'admin.role.slugPlaceholder' | t"
        (valueChange)="slug.set($event)"
      />
    }
    <app-form-field
      [label]="'admin.role.description' | t"
      [hideLabel]="true"
      [value]="description()"
      [placeholder]="'admin.role.description' | t"
      (valueChange)="description.set($event)"
    />

    @for (group of areas(); track group.area) {
      <app-section [label]="group.titel">
        <app-row-group>
          @for (right of group.rights; track right.key) {
            <app-check-row
              [title]="right.titel"
              [checked]="right.checked"
              [locked]="locked()"
              (toggled)="toggle(right.key, $event)"
            />
          }
        </app-row-group>
      </app-section>
    }
  }
</div>

@if (!missing() && !waiting()) {
  <app-action-bar
    [primary]="'common.save' | t"
    [secondary]="locked() || creating() ? undefined : ('admin.role.delete' | t)"
    [secondaryDanger]="true"
    [busy]="saving()"
    (primaryClick)="save()"
    (secondaryClick)="confirming.set(true)"
  />
}

<app-confirm-dialog
  [open]="confirming()"
  [title]="deleteQuestion()"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="confirming.set(false)"
/>
