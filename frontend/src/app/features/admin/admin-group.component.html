<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="adminGroup">
  @if (group(); as one) {
    <app-form-field
      [label]="'common.name' | t"
      [hideLabel]="true"
      [value]="name()"
      [placeholder]="'common.name' | t"
      (valueChange)="name.set($event)"
    />
    <app-group-members [group]="one" [removable]="true" (removed)="removeMember($event)" />
  } @else if (loaded()) {
    <app-state-view icon="account" [title]="'group.notFound' | t" />
  } @else {
    <app-row-group-skeleton [count]="1" />
    <app-row-group-skeleton [count]="3" [label]="true" [lines]="2" />
  }
</div>

@if (group()) {
  <app-action-bar
    [primary]="'common.save' | t"
    [secondary]="'group.delete' | t"
    [secondaryDanger]="true"
    [split]="true"
    [leadFirst]="true"
    [busy]="saving()"
    (primaryClick)="save()"
    (secondaryClick)="asking.set(true)"
  />
}

<app-confirm-dialog
  [open]="asking()"
  [title]="question()"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="asking.set(false)"
/>
