<app-page-header [title]="'admin.groups.title' | t" [back]="true" [wide]="wide()" (backClick)="back()" />

<div class="adminGroups">
  <app-search-field
    [value]="search()"
    [placeholder]="'admin.groups.search' | t"
    (valueChange)="onSearch($event)"
  />
  @if (!loaded()) {
    <app-row-group-skeleton [count]="4" [lines]="2" trail="chevron" />
  } @else if (rows().length === 0) {
    <app-state-view icon="account" [title]="'admin.groups.empty' | t" />
  } @else {
    <app-row-group>
      @for (row of rows(); track row.id) {
        <app-list-row
          [title]="row.name"
          [subline]="row.subline"
          [clickable]="true"
          [chevron]="true"
          (chosen)="open(row.id)"
        />
      }
    </app-row-group>
  }
</div>
