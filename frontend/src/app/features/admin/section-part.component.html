<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="section">
  @if (part() === null) {
    <app-state-view icon="search" [title]="'admin.part.notFound' | t" />
  } @else {
    <app-section [label]="'admin.part.section.sizes' | t">
      <app-row-group>
        @for (row of sizes(); track row.dimension) {
          <app-list-row
            [title]="row.title | t"
            [value]="row.value"
            [unit]="row.unit"
            [chevron]="true"
            [clickable]="true"
            (chosen)="openSize(row.dimension)"
          />
        }
        <app-add-row
          [label]="'admin.part.addSize' | t"
          [action]="'admin.part.addSize' | t"
          (pressed)="openSize()"
        />
      </app-row-group>
    </app-section>

    <app-section [label]="'admin.part.section.colours' | t">
      <app-row-group>
        @for (row of colours(); track row.key) {
          <app-list-row
            [title]="row.title"
            [subline]="row.subline"
            [swatch]="row.swatch"
            [chevron]="true"
            [clickable]="true"
            (chosen)="openColour(row.at)"
          />
        }
        <app-add-row
          [label]="'admin.part.addColour' | t"
          [action]="'admin.part.addColour' | t"
          (pressed)="addColour()"
        />
      </app-row-group>
    </app-section>

    <app-section [label]="'species.section.colourChange' | t">
      <app-row-group>
        @for (row of changes(); track row.key) {
          <app-list-row
            [title]="row.title"
            [plain]="row.subline"
            [chevron]="true"
            [clickable]="true"
            (chosen)="openChange(row.at)"
          />
        }
        <app-add-row
          [label]="'admin.part.addChange' | t"
          [action]="'admin.part.addChange' | t"
          (pressed)="addChange()"
        />
      </app-row-group>
    </app-section>

    <app-section [label]="'admin.part.description' | t">
      <app-form-field
        [label]="'admin.part.description' | t"
        [hideLabel]="true"
        [multiline]="true"
        [value]="description()"
        (valueChange)="description.set($event)"
      />
    </app-section>

    <app-section [label]="'admin.part.comment' | t">
      <app-form-field
        [label]="'admin.part.comment' | t"
        [hideLabel]="true"
        [multiline]="true"
        [placeholder]="'common.optional' | t"
        [value]="comment()"
        (valueChange)="comment.set($event)"
      />
    </app-section>

    <app-action-bar
      [primary]="'common.apply' | t"
      primaryIcon="check"
      [secondary]="known() ? ('admin.part.remove' | t) : undefined"
      secondaryIcon="trash"
      [secondaryDanger]="true"
      [stacked]="true"
      (primaryClick)="apply()"
      (secondaryClick)="remove()"
    />
  }
</div>
