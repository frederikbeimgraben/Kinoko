<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="section">
  @if (part() === null) {
    <app-state-view icon="search" [title]="'admin.part.notFound' | t" />
  } @else {
    <app-section [label]="'admin.colour.section.mode' | t">
      <app-segmented
        [options]="choices()"
        [value]="mode()"
        [label]="'admin.colour.section.mode' | t"
        (valueChange)="chooseMode($event)"
      />
    </app-section>

    <app-section [label]="modeName()">
      <app-row-group>
        @for (stop of stops(); track stop.at) {
          <app-list-row
            [title]="stop.name"
            [subline]="stop.note"
            [swatch]="stop.hex"
            [selected]="stop.at === open()"
            [clickable]="true"
            (chosen)="openStop(stop.at)"
          >
            @if (stops().length > 1) {
              <button
                action
                class="section__remove tap"
                type="button"
                data-press="scale"
                [attr.aria-label]="'common.remove' | t"
                (click)="removeStop(stop.at)"
              >
                <app-svg-icon name="close" [size]="20" [strokeWidth]="2" />
              </button>
            }
          </app-list-row>
        }
        @if (addable()) {
          <app-add-row
            [label]="'admin.part.addColour' | t"
            [action]="'admin.part.addColour' | t"
            (pressed)="addStop()"
          />
        }
      </app-row-group>
    </app-section>

    @if (stops().length > 0) {
      <app-section [label]="'admin.colour.section.tone' | t">
        <div class="section__palette">
          <app-colour-picker
            [colours]="swatches()"
            [value]="chosen()"
            [labels]="false"
            [label]="'admin.colour.section.tone' | t"
            (valueChange)="chooseHex($event)"
          />
        </div>
      </app-section>

      <app-section [label]="'admin.species.field.name' | t">
        <app-form-field
          [label]="'admin.species.field.name' | t"
          [hideLabel]="true"
          [value]="chosenName()"
          (valueChange)="setName($event)"
        />
      </app-section>
    }
  }
</div>

@if (part() !== null) {
  <app-action-bar
    [primary]="'common.apply' | t"
    [secondary]="'admin.colour.remove' | t"
    [secondaryDanger]="true"
    (primaryClick)="apply()"
    (secondaryClick)="remove()"
  />
}
