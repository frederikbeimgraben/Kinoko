<app-page-header [title]="title() | t" [back]="true" (backClick)="backClick.emit()" />

<div class="about">
  @for (section of sections(); track section.heading) {
    <section class="about__block">
      <h2 class="about__heading">{{ section.heading | t }}</h2>
      <p class="about__body">{{ section.body | t }}</p>
    </section>
  }
</div>
