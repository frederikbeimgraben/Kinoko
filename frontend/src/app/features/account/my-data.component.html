<app-page-header [title]="'account.myData' | t" [back]="true" (backClick)="back()" />

<div class="data">
  <div class="data__table">
    <app-key-value-table>
      <app-key-value-row [key]="'entry.finds' | t" [value]="finds().toString()" />
      <app-key-value-row [key]="'entry.markers' | t" [value]="markers().toString()" />
      <app-key-value-row [key]="'entry.zones' | t" [value]="zones().toString()" />
      <app-key-value-row [key]="'entry.images' | t" [value]="photos().toString()" />
      <app-key-value-row [key]="'map.combination.list' | t" [value]="combinations().toString()" />
    </app-key-value-table>
  </div>

  <app-push-button kind="tonal" (click)="export()">{{ 'account.exportJson' | t }}</app-push-button>
  <app-push-button kind="danger" (click)="asking.set(true)">{{
    'account.deleteAllData' | t
  }}</app-push-button>
</div>

<app-confirm-dialog
  [open]="asking()"
  [title]="'account.deleteAllConfirmTitle' | t"
  [meta]="meta()"
  [danger]="true"
  [confirmDisabled]="deleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="asking.set(false)"
/>
