<app-page-header [title]="'account.myData' | t" [back]="back()" (backClick)="toAccount()" />

<div class="pad">
  <app-account-stats [cols]="4" [withCombinations]="false" />
  <app-row-group>
    <app-list-row
      [title]="'account.export.title' | t"
      [chevron]="true"
      [clickable]="true"
      (chosen)="exporting.set(true)"
    />
  </app-row-group>
  <app-push-button kind="danger" icon="trash" [wide]="true" (click)="asking.set(true)">
    {{ 'account.deleteAllData' | t }}
  </app-push-button>
</div>

@if (exporting()) {
  <app-form-sheet
    [title]="'account.export.title' | t"
    [submit]="'account.export.action' | t"
    submitIcon="download"
    (submitted)="export()"
    (cancelled)="exporting.set(false)"
  >
    <app-data-export-body
      [format]="format()"
      [parts]="parts()"
      [counts]="counts()"
      (formatChange)="format.set($event)"
      (partToggle)="toggle($event)"
    />
  </app-form-sheet>
}

<app-confirm-dialog
  [open]="asking()"
  [title]="'account.deleteAllQuestion' | t"
  [meta]="meta()"
  [danger]="true"
  [confirmLabel]="'account.deleteAllData' | t"
  [confirmDisabled]="deleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="asking.set(false)"
/>
