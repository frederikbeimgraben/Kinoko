<app-form-sheet
  [title]="title()"
  [submit]="submit()"
  [secondary]="'common.cancel' | t"
  [busy]="busy()"
  (submitted)="submitted.emit(text())"
  (secondaryPressed)="cancelled.emit()"
  (cancelled)="cancelled.emit()"
>
  <app-form-field
    [label]="label()"
    [hideLabel]="!section()"
    [section]="section()"
    [placeholder]="placeholder()"
    [value]="text()"
    (valueChange)="text.set($event)"
  />
</app-form-sheet>
