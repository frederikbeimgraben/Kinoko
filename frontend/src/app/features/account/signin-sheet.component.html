<app-confirm-dialog
  [open]="pending()"
  [stack]="true"
  [aboveNav]="!wide()"
  [danger]="false"
  [meta]="ssoMissing() ? ('account.signInUnavailable' | t) : undefined"
  [confirmLabel]="signInLabel()"
  [cancelLabel]="'account.signInLater' | t"
  [confirmDisabled]="ssoMissing()"
  [confirmBusy]="signingIn()"
  (confirmed)="signIn()"
  (cancelled)="later()"
/>
