@if (pending()) {
  <app-overlay-host class="signin" [open]="true" [modal]="true" [cover]="true" (closed)="later()">
    <app-sheet
      [label]="'anmelden.blatt' | t"
      [title]="'anmelden.titel' | t"
      [modal]="true"
      [detents]="detents"
      (closed)="later()"
    >
      <div class="signin__content">
        @if (!wide()) {
          <h2 class="signin__title">{{ 'anmelden.titel' | t }}</h2>
        }
      </div>
      <app-action-bar
        #footer
        foot
        [primary]="'anmelden.knopf' | t"
        [secondary]="'anmelden.spaeter' | t"
        [ghost]="true"
        (primaryClick)="signIn()"
        (secondaryClick)="later()"
      />
    </app-sheet>
  </app-overlay-host>
}
