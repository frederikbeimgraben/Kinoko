<div class="signin" role="status">
  @if (failure()) {
    <p class="signin__text">{{ 'account.signInFailed' | t }}</p>
    <app-push-button kind="tonal" (click)="toMap()">{{ 'nav.karte' | t }}</app-push-button>
  } @else {
    <p class="signin__text">{{ 'account.signInInProgress' | t }}</p>
  }
</div>
