<app-page-header [title]="'bild.meine' | t" [back]="true" (backClick)="back()" />

<div class="mine">
  @if (loaded() && rows().length === 0) {
    <app-empty-state [text]="'bild.meineLeer' | t" />
  } @else {
    <ul class="mine__list">
      @for (row of rows(); track row.id) {
        <li>
          <app-row-group>
            <div class="mine__row">
              <app-private-image class="mine__thumb" [path]="row.thumbPath" [alt]="row.alt" />
              <div class="mine__text">
                <span class="mine__title">{{ row.species }}</span>
                <span class="mine__sub">{{ row.submitted }}</span>
                @if (row.reason; as reason) {
                  <span class="mine__reason">{{ reason }}</span>
                }
              </div>
              <app-level-pill [text]="row.badgeText" [kind]="row.badge" />
            </div>
          </app-row-group>
        </li>
      }
    </ul>
    @if (more()) {
      <div class="mine__more">
        <app-push-button kind="tonal" [disabled]="loading()" (click)="loadMore()">
          {{ 'bild.mehr' | t }}
        </app-push-button>
      </div>
    }
  }
</div>
