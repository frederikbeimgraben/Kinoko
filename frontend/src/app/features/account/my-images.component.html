<app-page-header [title]="'bild.meine' | t" [back]="back()" (backClick)="toAccount()" />

<div class="pad">
  @if (!loaded()) {
    <app-row-group-skeleton [count]="3" [lines]="2" lead="thumb" trail="badge" />
  } @else if (rows().length === 0) {
    <app-state-view icon="image" [title]="'bild.meineLeer' | t" />
  } @else {
    <app-row-group class="motion-list-in">
      @for (row of rows(); track row.id) {
        <app-list-row
          [title]="row.title"
          [subline]="row.sub"
          [badge]="row.badge"
          [badgeKind]="row.kind"
          [thumbed]="true"
          [clickable]="row.link !== null"
          (chosen)="open(row)"
        >
          <app-private-image lead [path]="row.thumb" [alt]="row.title" />
        </app-list-row>
      }
    </app-row-group>
    @if (more()) {
      <app-push-button kind="tonal" [busy]="busy()" [disabled]="busy()" (click)="next()">
        {{ 'bild.mehr' | t }}
      </app-push-button>
    }
  }
</div>
