<app-page-header [title]="'group.title' | t" [back]="back()" (backClick)="toAccount()" />

<div class="area">
  <div class="pad">
    @if (loaded()) {
      <app-row-group class="motion-list-in">
        @for (row of rows(); track row.id) {
          <app-list-row
            [title]="row.name"
            [subline]="row.sub"
            [clickable]="true"
            [chevron]="true"
            (chosen)="open(row.id)"
          />
        }
        <app-add-row
          [label]="'group.joinTitle' | t"
          [action]="'group.joinTitle' | t"
          (pressed)="openSheet('join')"
        />
      </app-row-group>
    } @else {
      <app-row-group-skeleton [count]="3" [lines]="2" />
    }
  </div>
  <app-floating-button class="fab" icon="plus" [label]="'group.create' | t" (pressed)="openSheet('create')" />
</div>

@if (sheet() === 'create') {
  <app-group-sheet
    [title]="'group.create' | t"
    [label]="'common.name' | t"
    [submit]="'group.createSubmit' | t"
    [required]="'group.nameRequired' | t"
    [busy]="busy()"
    (submitted)="create($event)"
    (cancelled)="sheet.set(null)"
  />
}

@if (sheet() === 'join') {
  <app-group-sheet
    [title]="'group.joinTitle' | t"
    [label]="'group.inviteCode' | t"
    [submit]="'group.joinSubmit' | t"
    [required]="'group.codeRequired' | t"
    [error]="joinError()"
    [busy]="busy()"
    (submitted)="join($event)"
    (edited)="joinError.set(null)"
    (cancelled)="sheet.set(null)"
  />
}
