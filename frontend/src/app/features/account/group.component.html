<app-page-header [title]="title()" [back]="true" (backClick)="back()" />

<div class="group">
  @if (group(); as one) {
    <app-group-members [group]="one" [removable]="mine()" (removed)="removeMember($event)" />
  } @else {
    <p class="note">{{ 'group.notFound' | t }}</p>
  }
</div>

@if (group()) {
  <app-action-bar
    [primary]="mine() ? ('group.delete' | t) : ('group.leave' | t)"
    [danger]="true"
    [split]="true"
    (primaryClick)="asking.set(true)"
  />
}

<app-confirm-dialog
  [open]="asking()"
  [title]="question()"
  [confirmLabel]="mine() ? ('common.delete' | t) : ('group.leave' | t)"
  (confirmed)="confirm()"
  (cancelled)="asking.set(false)"
/>
