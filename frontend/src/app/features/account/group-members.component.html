<app-section [label]="'group.inviteCode' | t">
  <app-row-group>
    <app-list-row [title]="group().inviteCode">
      <app-icon-button action icon="share" kind="plain" [label]="'group.share' | t" (pressed)="share()" />
    </app-list-row>
  </app-row-group>
</app-section>

<app-section [label]="'group.members' | t">
  <app-row-group>
    @for (row of rows(); track row.userId) {
      <app-list-row [title]="row.name" [subline]="row.sub">
        @if (removable() && !row.owner) {
          <app-icon-button
            action
            icon="close"
            kind="plain"
            [label]="'group.removeMember' | t"
            (pressed)="removed.emit(row.userId)"
          />
        }
      </app-list-row>
    }
  </app-row-group>
</app-section>
