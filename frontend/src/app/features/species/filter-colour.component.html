<app-fold-section [label]="'filter.colour.title' | t">
  <div class="grp">
    @for (part of parts(); track part.part) {
      <app-expand-row
        [label]="part.label"
        [value]="part.name"
        [dot]="part.chosen ?? undefined"
        [tall]="true"
        [open]="part.open"
        (openChange)="toggle(part.part)"
      >
        <app-colour-picker
          [colours]="swatches()"
          [value]="part.chosen"
          [label]="part.label"
          [nearest]="tones()"
          [nearestLabel]="tonesLabel()"
          (valueChange)="choose(part.part, $event)"
        />
      </app-expand-row>
    }
  </div>
</app-fold-section>
