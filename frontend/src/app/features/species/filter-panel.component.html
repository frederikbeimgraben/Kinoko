@if (wide() && filter.group() !== null) {
  <app-back-head [title]="title()" (backClick)="back()" />
}
@switch (filter.group()) {
  @case (null) {
    @for (card of cards(); track $index) {
      <div class="panel__card">
        @for (row of card; track row.key) {
          <app-list-row
            [title]="row.label"
            [value]="row.value"
            [accent]="true"
            kind="filter"
            [chevron]="true"
            [clickable]="true"
            (chosen)="filter.showGroup(row.key)"
          />
        }
      </div>
    }
  }
  @case ('colour') {
    <app-species-filter-colour />
  }
  @case ('size') {
    <app-species-filter-size />
  }
  @default {
    <app-species-filter-group [group]="filter.group()!" />
  }
}
@if (wide() && resettable()) {
  <button class="panel__reset tap" type="button" data-press="scale" (click)="reset()">
    {{ 'common.reset' | t }}
  </button>
}
