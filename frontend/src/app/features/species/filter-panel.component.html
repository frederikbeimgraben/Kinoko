@if (wide()) {
  <div class="fcount">
    <span>{{ count() }}</span>
    @if (resettable()) {
      <button
        class="fcount__reset tap"
        type="button"
        appRipple
        [attr.aria-label]="'common.reset' | t"
        (click)="reset()"
      >
        <app-svg-icon name="undo" [size]="20" />
      </button>
    }
  </div>
}
@for (group of flatGroups; track group.key) {
  <app-fold-section [label]="flatLabel(group.labelOf)">
    <app-chip-group
      [chips]="chipsOf(group.key)"
      [value]="chosenIn(group.key)"
      [multiple]="true"
      [small]="true"
      [label]="flatLabel(group.labelOf)"
      (valueChange)="chipsChanged(group.key, $event)"
    />
  </app-fold-section>
  @if (group.key === 'capShape') {
    <app-species-filter-colour />
  }
}
