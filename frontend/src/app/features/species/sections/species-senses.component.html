@if (senses().length > 0) {
  <app-section [label]="'species.section.senses' | t">
    <app-row-group>
      @for (sense of senses(); track sense.titleKey) {
        <app-list-row class="sense" [title]="sense.titleKey | t" [subline]="sense.text" [wrap]="true" />
      }
    </app-row-group>
  </app-section>
}
