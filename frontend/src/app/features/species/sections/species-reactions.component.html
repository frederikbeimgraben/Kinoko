@if (rows().length > 0) {
  <app-section [label]="'species.section.reactions' | t">
    <app-row-group>
      @for (row of rows(); track row.key) {
        <app-list-row class="reaction" [title]="row.label" [subline]="row.sub" [plain]="row.plain">
          <span trail class="reaction__trail">
            @if (row.contested) {
              <app-svg-icon
                class="reaction__contested"
                name="warning"
                [size]="18"
                [strokeWidth]="1.8"
                [label]="'species.reaction.contested' | t"
              />
            }
            @if (row.swatch.kind !== 'none') {
              <span
                class="reaction__swatch"
                role="img"
                [class.reaction__swatch--ring]="row.swatch.kind === 'ring'"
                [style.background]="background(row.swatch)"
                [attr.aria-label]="row.swatch.label"
              ></span>
            }
          </span>
        </app-list-row>
      }
    </app-row-group>
    @if (sources().length > 0) {
      <app-fold-section class="reaction__sources" [label]="'species.reaction.sources' | t" [open]="false">
        <app-row-group>
          @for (source of sources(); track $index) {
            <app-list-row
              kind="link"
              [title]="source.label"
              [subline]="source.sub"
              [chevron]="source.url !== null"
              [clickable]="source.url !== null"
              (chosen)="open(source.url)"
            />
          }
        </app-row-group>
        @if (hasDagger()) {
          <p class="reaction__legend">{{ dagger }} {{ 'species.reaction.partlyConfirmed' | t }}</p>
        }
      </app-fold-section>
    }
  </app-section>
}
