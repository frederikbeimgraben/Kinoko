@if (period(); as time) {
  <app-section [label]="'species.section.period' | t">
    <app-row-group>
      <app-list-row [title]="'species.section.growth' | t" [plain]="time.text" />
    </app-row-group>
    <div class="time__curve">
      <app-species-season [slug]="slug()" />
    </div>
  </app-section>
}
