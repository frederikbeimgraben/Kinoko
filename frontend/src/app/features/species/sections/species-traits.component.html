@if (traits().length > 0) {
  <app-section [label]="'species.section.traits' | t">
    <app-row-group>
      @for (trait of traits(); track trait.titleKey) {
        <app-list-row class="trait" [title]="trait.titleKey | t" [subline]="trait.text" [wrap]="true" />
      }
    </app-row-group>
  </app-section>
}
