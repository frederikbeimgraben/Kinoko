@if (rows().length > 0) {
  <app-section [label]="'species.section.hymenium' | t">
    <app-row-group>
      @for (row of rows(); track row.labelKey) {
        <app-list-row [title]="row.labelKey | t" [plain]="row.value" />
      }
      @if (colours().length > 0) {
        <app-list-row class="hymenium__colour" [title]="'common.colour' | t" [plain]="colourLabel()">
          <app-colour-field trail [colours]="colours()" [mode]="mode()" [label]="colourLabel()" />
        </app-list-row>
      }
    </app-row-group>
  </app-section>
}
