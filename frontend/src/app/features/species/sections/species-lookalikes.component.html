@if (rows().length > 0) {
  <app-section [label]="label() || ('species.section.lookalikes' | t)">
    @if (noted()) {
      <app-german-hint />
    }
    <app-row-group>
      @for (row of rows(); track row.slug) {
        <app-list-row
          kind="catalogue"
          [title]="row.name"
          [subline]="row.note"
          [sublineLang]="catalogueLang"
          [thumbed]="true"
          [chevron]="true"
        >
          <app-private-image
            lead
            class="lookalike__photo"
            [path]="row.image ?? ''"
            [alt]="row.name"
            [colour]="row.colour"
          />
          <!-- Per LookalikeRow.dc.html the photo, the name and the note open the species. -->
          <button
            lead
            class="lookalike__open"
            type="button"
            appRipple
            [attr.aria-label]="row.name"
            (click)="opened.emit(row.slug)"
          ></button>
          <app-icon-button
            trail
            class="lookalike__compare"
            icon="compare"
            kind="plain"
            [label]="'species.compare' | t"
            (pressed)="compared.emit(row.slug)"
          />
        </app-list-row>
      }
    </app-row-group>
  </app-section>
}
