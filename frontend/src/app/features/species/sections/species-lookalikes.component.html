@if (rows().length > 0) {
  <app-section [label]="label() || ('species.section.lookalikes' | t)">
    <app-row-group>
      @for (row of rows(); track row.slug) {
        <app-list-row kind="catalogue" [title]="row.name" [subline]="row.note" [thumbed]="true">
          <app-private-image
            lead
            class="lookalike__photo"
            [path]="row.image ?? ''"
            [alt]="row.name"
            [colour]="row.colour"
          />
          <span trail class="lookalike__ways">
            <app-icon-button
              class="lookalike__compare"
              icon="compare"
              kind="plain"
              [label]="'species.compare' | t"
              (pressed)="compared.emit(row.slug)"
            />
            <button
              class="lookalike__open tap"
              type="button"
              data-press="scale"
              [attr.aria-label]="row.name"
              (click)="opened.emit(row.slug)"
            >
              <app-svg-icon name="chevron" [size]="24" [strokeWidth]="1.8" tone="dim" />
            </button>
          </span>
        </app-list-row>
      }
    </app-row-group>
  </app-section>
}
