<app-section [label]="'species.section.classification' | t">
  @if (species().edibilityNote) {
    <app-german-hint />
  }
  <app-row-group>
    <app-list-row kind="catalogue" [title]="'species.field.edibility' | t">
      <app-level-pill
        trail
        [text]="edibility().text"
        [colour]="edibility().colour"
        [background]="edibility().background"
      />
    </app-list-row>
    <app-list-row kind="catalogue" [title]="'species.field.protection' | t">
      <app-level-pill
        trail
        [text]="protection().text"
        [colour]="protection().colour"
        [background]="protection().background"
      />
    </app-list-row>
    <app-list-row kind="catalogue" [title]="'species.field.trade' | t">
      <app-level-pill
        trail
        [text]="trade().text"
        [colour]="trade().colour"
        [background]="trade().background"
      />
    </app-list-row>
    @if (species().edibilityNote; as note) {
      <app-list-row
        class="features__note"
        [title]="'species.field.edibilityNote' | t"
        [subline]="note"
        [sublineLang]="catalogueLang"
        [wrap]="true"
      />
    }
  </app-row-group>
  <app-safety-notice />
</app-section>
