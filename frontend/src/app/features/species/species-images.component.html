@if (lead(); as lead) {
  <button type="button" class="gallery__lead" [attr.aria-label]="openLabel(lead)" (click)="show(lead)">
    <img
      class="gallery__image"
      [src]="lead.url"
      [alt]="label(lead)"
      [width]="lead.width"
      [height]="lead.height"
    />
  </button>
  @if (others().length || signedIn()) {
    <ul class="gallery__strip" [attr.aria-label]="'bild.streifen' | t">
      @for (image of others(); track image.id) {
        <li>
          <button
            type="button"
            class="gallery__thumb"
            [attr.aria-label]="openLabel(image)"
            (click)="show(image)"
          >
            <img class="gallery__image" [src]="image.thumbUrl" [alt]="label(image)" />
          </button>
        </li>
      }
      @if (signedIn()) {
        <li>
          <button
            type="button"
            class="gallery__thumb gallery__add"
            [attr.aria-label]="'bild.einreichen' | t"
            (click)="submit()"
          >
            <app-svg-icon name="plus" [size]="18" />
          </button>
        </li>
      }
    </ul>
  }
  <app-image-credit [photographer]="lead.photographer" [licence]="lead.licence" />
} @else if (signedIn()) {
  <button
    type="button"
    class="gallery__lead gallery__add"
    [attr.aria-label]="'bild.einreichen' | t"
    (click)="submit()"
  >
    <app-svg-icon name="plus" [size]="22" />
    <span>{{ 'bild.einreichen' | t }}</span>
  </button>
} @else {
  <div class="gallery__lead gallery__add gallery__add--still">
    <span>{{ 'bild.keine' | t }}</span>
  </div>
}
<app-image-viewer [image]="open()" [title]="speciesName()" (closed)="open.set(null)" />
