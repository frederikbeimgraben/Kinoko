<div class="group__card">
  @for (choice of choices(); track choice.value) {
    <app-choice-row
      [label]="choice.label"
      [count]="choice.count.toString()"
      [checked]="checked(choice.value)"
      (toggled)="filter.toggle(group(), choice.value)"
    />
  }
</div>
@if (hasGap()) {
  <div class="group__card">
    <app-choice-row
      [label]="'filter.keepUnspecified' | t"
      [checked]="filter.keeps(group())"
      (toggled)="filter.toggleKeepUnknown(group())"
    />
  </div>
}
