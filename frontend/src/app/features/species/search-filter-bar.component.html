<app-search-field
  [value]="value()"
  [loading]="state.loading()"
  [placeholder]="placeholder()"
  (valueChange)="valueChange.emit($event)"
/>
@if (showsMarks()) {
  <div class="chiprow">
    <app-filter-chip
      [label]="'common.filter' | t"
      icon="filter"
      [on]="filtered()"
      (chosen)="filter.openSheet()"
    />
    @for (chip of chips(); track chip.group + chip.value) {
      <app-filter-chip [label]="chip.label" [on]="true" [clear]="true" (removed)="drop(chip)" />
    }
  </div>
}
