<ng-template #hitRows>
  @for (row of rows(); track row.slug) {
    @if (row.head) {
      <div class="lbl">{{ row.head }}</div>
    }
    <app-species-row
      [species]="row.species"
      [active]="row.slug === active()"
      [soft]="row.slug === soft() && row.slug !== active()"
      [shareKey]="row.slug"
      (chosen)="chosen.emit(row.slug)"
    />
  }
</ng-template>

@if (failed()) {
  <app-state-view
    class="results__state"
    kind="error"
    icon="wifi-off"
    [title]="'state.noConnection' | t"
    [action]="'common.retry' | t"
    (actionClick)="retry.emit()"
  />
} @else if (loading()) {
  <app-skeleton class="results__skeleton" kind="rows" [count]="skeletonRows" />
} @else if (rows().length === 0) {
  <app-state-view
    class="results__state"
    icon="search"
    [title]="'species.noHits' | t"
    [action]="filtered() ? ('filter.resetAll' | t) : ''"
    (actionClick)="resetFilter.emit()"
  />
} @else {
  <app-infinite-list class="results__list" [hasMore]="hasMore()" (more)="more.emit()">
    <div class="results__rows motion-list-in">
      <ng-container [ngTemplateOutlet]="hitRows" />
      @if (gapRows().length > 0) {
        <div class="results__gap">
          <span>{{ gapText() }}</span>
          <i></i>
        </div>
        @for (row of gapRows(); track row.slug) {
          <app-species-row
            class="results__muted"
            [species]="row.species"
            [muted]="true"
            [shareKey]="row.slug"
            (chosen)="chosen.emit(row.slug)"
          />
        }
      }
    </div>
  </app-infinite-list>
}
