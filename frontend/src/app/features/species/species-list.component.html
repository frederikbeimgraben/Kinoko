<app-page-header [title]="'nav.tab.species' | t">
  @if (countText(); as count) {
    <span class="species__count">{{ count }}</span>
  }
</app-page-header>
@if (wide()) {
  <div class="species species--wide">
    <div class="species__column">
      @if (filter.group() === null) {
        <app-search-field
          [value]="query()"
          [placeholder]="'species.search.placeholder' | t"
          [loading]="loading()"
          (valueChange)="query.set($event)"
        />
      }
      <app-species-filter-panel />
    </div>
    <div class="species__pane">
      @if (filtered()) {
        <p class="species__summary">{{ summary() }}</p>
      }
      <app-species-results
        [hits]="hits()"
        [unassessable]="unassessable()"
        [loading]="loading()"
        [failed]="failed()"
        [hasMore]="hasMore()"
        (chosen)="open($event)"
        (more)="more()"
        (retry)="state.reload()"
        (resetFilter)="reset()"
      />
    </div>
  </div>
} @else {
  <div class="species">
    <app-search-field
      [value]="query()"
      [placeholder]="'species.search.placeholder' | t"
      [loading]="loading()"
      (valueChange)="query.set($event)"
    />
    @if (showsMarks()) {
      <div class="species__marks">
        <button
          class="species__filter tap"
          type="button"
          data-press="scale"
          [class.species__filter--on]="filtered()"
          (click)="filter.openSheet()"
        >
          <app-svg-icon name="filter" [size]="17" [strokeWidth]="1.8" />
          {{ 'common.filter' | t }}
        </button>
        @for (chip of chips(); track chip.group + chip.value) {
          <app-filter-chip [label]="chip.label" (removed)="drop(chip)" />
        }
      </div>
    }
    <app-species-results
      [hits]="hits()"
      [unassessable]="unassessable()"
      [loading]="loading()"
      [failed]="failed()"
      [hasMore]="hasMore()"
      (chosen)="open($event)"
      (more)="more()"
      (retry)="state.reload()"
      (resetFilter)="reset()"
    />
  </div>
  <app-species-filter-sheet />
}
