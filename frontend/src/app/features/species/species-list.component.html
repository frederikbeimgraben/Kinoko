@if (wide()) {
  <app-species-desk>
    <app-state-view class="species__choose" icon="species" [title]="'species.detail.choose' | t" />
  </app-species-desk>
} @else {
  <app-species-search-bar />
  @if (!catalogue.loading() && !catalogue.failed() && filter.query().trim() === '') {
    <app-species-filter-chips />
  }
  <app-species-results
    [hits]="listing.hits()"
    [unassessable]="listing.unassessable()"
    [sort]="filter.sort()"
    [loading]="catalogue.loading()"
    [failed]="catalogue.failed()"
    [hasMore]="listing.hasMore()"
    [soft]="catalogue.activeSpecies()"
    (chosen)="open($event)"
    (more)="listing.more()"
    (retry)="catalogue.reload()"
    (resetFilter)="filter.clearAll()"
  />
  <app-species-filter-sheet />
}
