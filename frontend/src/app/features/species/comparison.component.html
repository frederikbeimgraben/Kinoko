<app-page-header [title]="'vergleich.titel' | t" [back]="true" (backClick)="back()" />

@if (viewport(); as ansicht) {
  <div class="comparison-page">
    <app-card class="flush" [attr.aria-label]="ansicht.label">
      <app-key-value-table>
        <app-key-value-row key="" [values]="ansicht.names" />
        @for (row of ansicht.rows; track row.key) {
          <app-key-value-row [key]="row.label" [values]="row.values" />
        }
      </app-key-value-table>
    </app-card>
    <p class="note note--sub">{{ 'vergleich.hinweis' | t }}</p>
  </div>
} @else if (unknown()) {
  <app-empty-state
    icon="species"
    [text]="'vergleich.fehlt' | t"
    [action]="'art.zuDenArten' | t"
    (actionClick)="back()"
  />
}
