<app-overlay-host [open]="open()" [modal]="true" (closed)="closed.emit()">
  @if (open()) {
    <app-sheet
      [label]="'species.compare' | t"
      [title]="'species.compare' | t"
      [modal]="true"
      [dismissible]="true"
      (closed)="closed.emit()"
    >
      <div class="entry">
        <div class="entry__bar">
          <app-search-field
            [value]="query()"
            [placeholder]="'species.search.placeholder' | t"
            (valueChange)="query.set($event)"
          />
        </div>
        @if (query().trim() === '') {
          <app-species-lookalikes
            [lookalikes]="lookalikes()"
            (compared)="picked.emit($event)"
            (opened)="opened.emit($event)"
          />
        } @else {
          <app-section [label]="'species.title' | t">
            <div class="entry__hits">
              @for (hit of hits(); track hit.slug) {
                <app-species-row [species]="hit.row" (chosen)="picked.emit(hit.slug)" />
              } @empty {
                <p class="entry__empty">{{ 'state.noSpeciesMatch' | t }}</p>
              }
            </div>
          </app-section>
        }
      </div>
    </app-sheet>
  }
</app-overlay-host>
