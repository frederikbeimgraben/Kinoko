<app-species-page [slug]="slug()" />

<app-form-sheet
  [title]="title()"
  [submit]="action()"
  [busy]="busy()"
  (submitted)="save()"
  (cancelled)="cancel()"
>
  <div class="form">
    <app-photo-strip
      mode="edit"
      [max]="1"
      [pending]="files()"
      [removable]="!busy()"
      (pendingChange)="files.set($event)"
    />
    @if (busy()) {
      <app-progress class="form__progress" [value]="percent() ?? 0" />
    }
    <app-row-group>
      <app-list-row
        [title]="'image.field.origin' | t"
        [plain]="licenceLabel(licence())"
        [chevron]="true"
        [clickable]="!busy()"
        (chosen)="picking.set(true)"
      />
    </app-row-group>
    <app-form-field
      [label]="'image.field.author' | t"
      [value]="photographer()"
      (valueChange)="photographer.set($event)"
    />
    @if (curates()) {
      <app-form-field
        [label]="'image.field.sourcePlaceholder' | t"
        [value]="source()"
        (valueChange)="source.set($event)"
      />
    }
    <app-form-field
      kind="date"
      [label]="'image.field.takenOn' | t"
      [value]="takenOn()"
      [display]="takenOnText()"
      (valueChange)="takenOn.set($event)"
    />
    <app-form-field
      [label]="'image.field.caption' | t"
      [placeholder]="'image.field.captionPlaceholder' | t"
      [multiline]="true"
      [value]="caption()"
      (valueChange)="caption.set($event)"
    />
    @if (curates()) {
      <app-check-row
        [title]="'image.setAsCoverToggle' | t"
        [checked]="cover()"
        (toggled)="cover.set($event)"
      />
    }
  </div>
</app-form-sheet>

<app-option-sheet
  [open]="picking()"
  [title]="'image.field.licence' | t"
  [options]="licences()"
  [selected]="licence()"
  (chosen)="setLicence($event)"
  (closed)="picking.set(false)"
/>
