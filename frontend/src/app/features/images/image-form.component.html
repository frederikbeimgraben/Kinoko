<ng-template #fields>
  <div class="form">
    <div class="form__photo">
      <app-photo-strip
        mode="edit"
        [max]="1"
        [pending]="files()"
        [removable]="!busy()"
        (pendingChange)="setFiles($event)"
      />
      @if (photoError(); as message) {
        <p class="form__error" role="alert">{{ message }}</p>
      } @else if (failed()) {
        <p class="form__error" role="alert">{{ 'image.submit.failed' | t }}</p>
      }
    </div>
    @if (busy()) {
      <app-progress class="form__progress" [value]="percent() ?? 0" />
    }
    @if (curates()) {
      <app-form-field
        [label]="'image.field.author' | t"
        [value]="photographer()"
        [error]="photographerError()"
        (valueChange)="photographer.set($event)"
      />
      <app-form-field
        [label]="'image.field.sourcePlaceholder' | t"
        [placeholder]="'image.field.sourceHint' | t"
        [value]="source()"
        (valueChange)="source.set($event)"
      />
      <div class="form__group">
        <span class="form__label">{{ 'image.field.licence' | t }}</span>
        <app-segmented
          [label]="'image.field.licence' | t"
          [options]="curatedLicences()"
          [value]="licence()"
          [locked]="busy()"
          (valueChange)="setLicence($event)"
        />
      </div>
    } @else {
      <app-row-group>
        <app-list-row
          [title]="'image.field.origin' | t"
          [plain]="licenceLabel(licence())"
          [chevron]="true"
          [clickable]="!busy()"
          (chosen)="picking.set(true)"
        />
      </app-row-group>
      <app-form-field
        [label]="'image.field.author' | t"
        [value]="photographer()"
        [error]="photographerError()"
        (valueChange)="photographer.set($event)"
      />
      <app-form-field
        kind="date"
        [label]="'image.field.takenOn' | t"
        [value]="takenOn()"
        [display]="takenOnText()"
        (valueChange)="takenOn.set($event)"
      />
    }
    <app-form-field
      [label]="'image.field.caption' | t"
      [placeholder]="(curates() ? 'common.optional' : 'image.field.captionPlaceholder') | t"
      [multiline]="true"
      [value]="caption()"
      (valueChange)="caption.set($event)"
    />
    <app-form-field
      [label]="'image.field.captionEn' | t"
      [placeholder]="'common.optional' | t"
      [multiline]="true"
      [value]="captionEn()"
      (valueChange)="captionEn.set($event)"
    />
    @if (curates()) {
      <app-row-group>
        <app-list-row [title]="'image.cover' | t" [clickable]="!busy()" (chosen)="cover.set(!cover())">
          <app-switch
            action
            [checked]="cover()"
            [label]="'image.setAsCoverToggle' | t"
            (checkedChange)="cover.set($event)"
          />
        </app-list-row>
      </app-row-group>
    }
  </div>
</ng-template>

<!-- A curator adds a photo on a page of its own (board ImageAdd). Each other person submits it in a sheet (board ImageSubmit). -->
<ng-template #page>
  <app-page-header [title]="title()" [back]="true" (backClick)="cancel()" />
  <div class="page" [class.page--wide]="wide()">
    <ng-container [ngTemplateOutlet]="fields" />
    <app-action-bar
      [primary]="action()"
      primaryIcon="check"
      [stacked]="true"
      [busy]="busy()"
      (primaryClick)="save()"
    />
  </div>
</ng-template>

@if (!curates()) {
  <app-species-page [slug]="slug()" />
  <app-form-sheet
    [title]="title()"
    [submit]="action()"
    [busy]="busy()"
    (submitted)="save()"
    (cancelled)="cancel()"
  >
    <ng-container [ngTemplateOutlet]="fields" />
  </app-form-sheet>
} @else if (wide()) {
  <app-species-desk [active]="slug()">
    <ng-container [ngTemplateOutlet]="page" />
  </app-species-desk>
} @else {
  <ng-container [ngTemplateOutlet]="page" />
}

<app-option-sheet
  [open]="picking()"
  [title]="'image.field.licence' | t"
  [options]="licences()"
  [selected]="licence()"
  (chosen)="setLicence($event)"
  (closed)="picking.set(false)"
/>
