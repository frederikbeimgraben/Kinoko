<app-image-viewer
  class="view"
  [image]="photo()"
  [title]="title()"
  [index]="index()"
  [count]="count()"
  (back)="back()"
/>
@if (canSetLead()) {
  <app-action-bar
    [primary]="'image.setCover' | t"
    [secondary]="'image.remove' | t"
    [quiet]="true"
    [secondaryDanger]="true"
    (primaryClick)="setCover()"
    (secondaryClick)="remove()"
  />
} @else if (canRemove()) {
  <app-action-bar [primary]="'image.remove' | t" [danger]="true" (primaryClick)="remove()" />
}
