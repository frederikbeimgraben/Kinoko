<app-image-viewer
  class="view"
  [image]="photo()"
  [title]="title()"
  [index]="index()"
  [count]="count()"
  (back)="back()"
>
  @if (canSetLead()) {
    <app-list-row facts kind="catalogue" [title]="'image.cover' | t">
      <app-switch
        trail
        [checked]="isLead()"
        [disabled]="isLead()"
        [label]="'image.cover' | t"
        (checkedChange)="setCover()"
      />
    </app-list-row>
  }
</app-image-viewer>
@if (canRemove()) {
  <app-action-bar [primary]="'image.remove' | t" [ghost]="true" [danger]="true" (primaryClick)="remove()" />
}
