@if (editing()) {
  <app-find-form
    [location]="location()"
    [start]="find()"
    [heading]="'entry.fund.editTitle' | t"
    [editing]="true"
    [busy]="busy()"
    (submitted)="save($event)"
    (cancelled)="editing.set(false)"
  />
} @else {
  <div class="findsheet">
    <div>
      <div class="findsheet__head">
        <h2 class="findsheet__title">{{ speciesName() }}</h2>
        <div class="findsheet__headActions">
          @if (geteilt()) {
            <app-badge variant="success">{{ 'entry.badge.shared' | t }}</app-badge>
          }
          <app-icon-button icon="delete" [label]="'fund.loeschen' | t" (pressed)="deleteAsk.set(true)" />
        </div>
      </div>
      <p class="findsheet__sub">{{ subline() }}</p>
    </div>
    <app-photo-gallery [findId]="find().id" />
    @if (find().note) {
      <p class="findsheet__note">{{ find().note }}</p>
    }
    @if (valueText(); as value) {
      <app-card class="flush">
        <app-list-row [title]="'entry.fund.forecastHere' | t" [subline]="valueScope()" [value]="value" />
      </app-card>
    }
  </div>
  <app-action-bar
    [primary]="'entry.marker.openInMapsApp' | t"
    [secondary]="'common.edit' | t"
    (primaryClick)="toGoogleMaps()"
    (secondaryClick)="editing.set(true)"
  />
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'entry.fund.delete' | t"
  [meta]="'fund.loeschenText' | t"
  [confirmLabel]="'objekt.loeschen' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
