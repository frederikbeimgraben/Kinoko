@if (editing()) {
  <app-find-form
    [location]="location()"
    [start]="find()"
    [editing]="true"
    [busy]="busy()"
    [held]="held()"
    (submitted)="save($event)"
    (heldRemoved)="removePhoto($event)"
  />
} @else {
  <div class="objectsheet">
    <app-photo-gallery [findId]="find().id" />
    @if (find().note; as note) {
      <p class="findsheet__note">{{ note }}</p>
    }
    @if (valueText(); as value) {
      <app-card class="flush">
        <app-list-row
          class="findsheet__value"
          kind="catalogue"
          [title]="'entry.fund.forecastHere' | t"
          [subline]="valueScope()"
          [value]="value"
        />
      </app-card>
    }
  </div>
  <app-action-bar
    [primary]="'common.edit' | t"
    [secondary]="'common.delete' | t"
    [quiet]="true"
    [secondaryDanger]="true"
    [split]="true"
    (primaryClick)="editing.set(true)"
    (secondaryClick)="deleteAsk.set(true)"
  >
    <app-button class="findsheet__main" variant="primary" [block]="true" (click)="showOnMap()">
      <app-svg-icon name="map" [size]="16" />
      {{ 'entry.showOnMap' | t }}
    </app-button>
  </app-action-bar>
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'entry.fund.delete' | t"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
