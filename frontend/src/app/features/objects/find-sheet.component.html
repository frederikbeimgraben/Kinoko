@if (editing()) {
  <app-find-form
    [location]="location()"
    [start]="find()"
    [editing]="true"
    [busy]="busy()"
    [held]="strip()"
    (submitted)="save($event)"
    (heldRemoved)="removePhoto($event)"
  />
} @else {
  <div class="overlay-body objectsheet" appScrollFade>
    <app-object-title [title]="speciesName()" [sub]="sub()" [photo]="thumbPhoto()" />
    @if (strip().length > 0) {
      <app-photo-strip mode="view" [photos]="strip()" (opened)="openPhoto($event)" />
    }
    @if (find().note; as note) {
      <app-section [label]="'entry.field.note' | t">
        <p class="objectsheet__note">{{ note }}</p>
      </app-section>
    }
    <app-row-group>
      <app-list-row
        [title]="'entry.field.visibility' | t"
        [badge]="(shared() ? 'entry.badge.shared' : 'entry.badge.private') | t"
        [badgeKind]="shared() ? 'ok' : ''"
      />
      @if (groupName(); as group) {
        <app-list-row [title]="'entry.field.group' | t" [plain]="group" />
      }
      <app-map-app-link [target]="location()" />
    </app-row-group>
  </div>
  <app-action-bar
    foot
    [primary]="'common.edit' | t"
    primaryIcon="edit"
    [secondary]="'common.delete' | t"
    secondaryIcon="trash"
    [secondaryDanger]="true"
    (primaryClick)="sheet.setEditing(true)"
    (secondaryClick)="deleteAsk.set(true)"
  />
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'entry.fund.delete' | t"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
@if (viewing() !== null) {
  <app-photo-dialog [photos]="held()" [index]="viewing() ?? 0" (closed)="closeGallery()" />
}
