@if (editing()) {
  <app-find-form
    [location]="location()"
    [start]="find()"
    [editing]="true"
    [busy]="busy()"
    [held]="strip()"
    (submitted)="save($event)"
    (heldRemoved)="removePhoto($event)"
  />
} @else {
  <div class="objectsheet">
    <div class="findsheet__head">
      <app-object-title [title]="speciesName()" [sub]="sub()" [photo]="thumbPhoto()" />
      @if (shared()) {
        <app-level-pill class="findsheet__badge" [text]="'entry.badge.shared' | t" kind="ok" />
      }
    </div>
    <app-photo-strip mode="view" [photos]="strip()" (opened)="openPhoto($event)" />
    @if (find().note; as note) {
      <p class="findsheet__note">{{ note }}</p>
    }
    @if (valueText(); as value) {
      <app-row-group>
        <app-list-row
          class="findsheet__value"
          kind="catalogue"
          [title]="'entry.fund.forecastHere' | t"
          [subline]="valueScope()"
          [value]="value"
        />
      </app-row-group>
    }
  </div>
  <app-action-bar
    [primary]="'common.edit' | t"
    [secondary]="'common.delete' | t"
    [quiet]="true"
    [secondaryDanger]="true"
    [split]="true"
    (primaryClick)="editing.set(true)"
    (secondaryClick)="deleteAsk.set(true)"
  >
    <app-push-button class="findsheet__main" kind="primary" [wide]="true" (click)="showOnMap()">
      <app-svg-icon name="map" [size]="16" />
      {{ 'entry.showOnMap' | t }}
    </app-push-button>
  </app-action-bar>
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'entry.fund.delete' | t"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
@if (viewing() !== null) {
  <app-photo-dialog [photos]="held()" [index]="viewing() ?? 0" (closed)="closeGallery()" />
}
