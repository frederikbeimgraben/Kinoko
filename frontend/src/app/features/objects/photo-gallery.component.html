@if (images().length > 0) {
  <div class="gallery">
    @for (shot of images(); track shot.id; let spot = $index) {
      <button class="gallery__tile tap" type="button" data-press="scale" (click)="open(spot, $event)">
        <app-private-image class="gallery__image" [path]="shot.path" [alt]="shot.label" />
      </button>
    }
  </div>
}
@if (viewing()) {
  <app-photo-dialog [photos]="held()" [index]="start()" (closed)="close()" />
}
