@if (editing()) {
  <app-object-form
    [heading]="'entry.zone.editTitle' | t"
    kind="zone"
    [start]="start()"
    [editing]="true"
    [busy]="busy()"
    [nameMissingText]="'zone.nameFehlt' | t"
    (submitted)="save($event)"
    (cancelled)="editing.set(false)"
  >
    <app-button variant="secondary" [block]="true" (click)="editCorners()">
      {{ 'entry.zone.changeOutline' | t }}
    </app-button>
  </app-object-form>
} @else {
  <div class="objectsheet">
    <div class="objectsheet__head">
      <div class="objectsheet__heading">
        <h2 class="objectsheet__title">{{ zone().name }}</h2>
        <p class="objectsheet__sub">{{ subline() }}</p>
      </div>
      <app-icon-button icon="delete" [label]="'zone.loeschen' | t" (pressed)="deleteAsk.set(true)" />
    </div>
    @if (editingCorners()) {
      <p class="note">{{ 'zone.eckpunkteHinweis' | t }}</p>
    } @else if (forecastRow(); as row) {
      <app-card class="flush">
        <app-list-row [title]="row.label" [subline]="'entry.zone.areaMeanCaption' | t" [value]="row.value" />
        <app-list-row
          [title]="'entry.zone.ownFindsInZone' | t"
          [subline]="'entry.zone.allSpeciesAllYears' | t"
          [value]="row.finds"
        />
      </app-card>
    } @else {
      <p class="note">{{ 'zone.wertFehlt' | t }}</p>
    }
  </div>
  @if (editingCorners()) {
    <app-action-bar
      [primary]="'zone.eckpunkteFertig' | t"
      [secondary]="'common.cancel' | t"
      (primaryClick)="applyCorners()"
      (secondaryClick)="cancelCorners()"
    />
  } @else {
    <app-action-bar
      [primary]="'common.edit' | t"
      [secondary]="'entry.zone.editVertices' | t"
      (primaryClick)="editing.set(true)"
      (secondaryClick)="editCorners()"
    />
  }
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'zone.loeschenFrage' | t"
  [meta]="'zone.loeschenText' | t"
  [confirmLabel]="'objekt.loeschen' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
