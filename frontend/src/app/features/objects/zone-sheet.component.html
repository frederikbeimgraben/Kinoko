@if (editing()) {
  <app-object-form
    [heading]="'entry.zone.editTitle' | t"
    kind="zone"
    [start]="start()"
    [editing]="true"
    [busy]="busy()"
    [nameMissingText]="'zone.nameFehlt' | t"
    (submitted)="save($event)"
    (cancelled)="editing.set(false)"
  >
    <app-button class="zonesheet__outline" variant="secondary" [block]="true" (click)="editCorners()">
      {{ 'entry.zone.changeOutline' | t }}
    </app-button>
  </app-object-form>
} @else {
  <div class="objectsheet">
    <div>
      <div class="objectsheet__head">
        <span class="objectsheet__dot" [style.background]="colour()"></span>
        <h2 class="objectsheet__title">{{ zone().name }}</h2>
      </div>
      <p class="objectsheet__sub">{{ subline() }}</p>
    </div>
    @if (zone().note; as note) {
      <p class="objectsheet__note">{{ note }}</p>
    }
    <app-card class="flush">
      <app-list-row
        kind="catalogue"
        [title]="'entry.marker.openInMapsApp' | t"
        [chevron]="true"
        [clickable]="true"
        (chosen)="toGoogleMaps()"
      />
    </app-card>
  </div>
  @if (editingCorners()) {
    <app-action-bar
      [primary]="'zone.eckpunkteFertig' | t"
      [secondary]="'common.cancel' | t"
      (primaryClick)="applyCorners()"
      (secondaryClick)="cancelCorners()"
    />
  } @else {
    <app-action-bar
      [primary]="'common.edit' | t"
      [secondary]="'common.delete' | t"
      [quiet]="true"
      [secondaryDanger]="true"
      [split]="true"
      (primaryClick)="editing.set(true)"
      (secondaryClick)="deleteAsk.set(true)"
    />
  }
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [title]="'entry.zone.deleteTitle' | t"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
