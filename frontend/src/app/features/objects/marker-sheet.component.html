@if (editing()) {
  <app-object-form
    [start]="start()"
    kind="marker"
    [location]="place()"
    [busy]="busy()"
    [nameMissingText]="'marker.nameFehlt' | t"
    (submitted)="save($event)"
    (locationClick)="sheet.startRelocating()"
  />
} @else {
  <div class="overlay-body objectsheet" appScrollFade>
    <app-object-title [title]="marker().name" [sub]="sub()" [colour]="colour()" icon="flag" />
    @if (marker().note; as note) {
      <app-section [label]="'entry.field.note' | t">
        <p class="objectsheet__note">{{ note }}</p>
      </app-section>
    }
    <app-row-group>
      <app-map-app-link [target]="location()" />
    </app-row-group>
  </div>
  <app-action-bar
    foot
    [primary]="'common.edit' | t"
    primaryIcon="edit"
    [secondary]="'common.delete' | t"
    secondaryIcon="trash"
    [secondaryDanger]="true"
    (primaryClick)="sheet.setEditing(true)"
    (secondaryClick)="deleteAsk.set(true)"
  />
}
<app-confirm-dialog
  [open]="deleteAsk()"
  [meta]="marker().name"
  [aboveNav]="!wide()"
  [stageScrim]="!wide()"
  [title]="'entry.marker.deleteTitle' | t"
  [confirmLabel]="'common.delete' | t"
  (confirmed)="remove()"
  (cancelled)="deleteAsk.set(false)"
/>
