<app-overlay-host
  class="object"
  [class.object--corners]="editingCorners() || relocating()"
  [open]="map.object() !== null"
  [modal]="!editingCorners() && !relocating()"
  (closed)="hostClosed()"
>
  <app-sheet
    appSheetHeight
    class="object__sheet"
    [class.object__sheet--hidden]="relocating()"
    [label]="sheetName()"
    [title]="headTitle()"
    [modal]="!editingCorners()"
    [dismissible]="true"
    (closed)="dismiss()"
  >
    @if (find(); as entry) {
      <app-find-sheet [find]="entry" (closed)="close()" />
    } @else if (marker(); as entry) {
      <app-marker-sheet [marker]="entry" (closed)="close()" />
    } @else if (zone(); as entry) {
      <app-zone-sheet [zone]="entry" (closed)="close()" />
    } @else if (missing()) {
      <p class="note object__missing">{{ 'objekt.nichtGefunden' | t }}</p>
    }
  </app-sheet>
</app-overlay-host>

@if (relocating()) {
  <div class="object__aim">
    <div #cross class="object__crosshair">
      <app-crosshair [label]="aimTitle()" />
    </div>
    <app-step-bar [label]="aimTitle()" [actions]="aimActions()" (chosen)="$event.run()" />
  </div>
}
