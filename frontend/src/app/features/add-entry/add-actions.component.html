@if (menu()) {
  @for (choice of choices; track choice.key) {
    <app-popover-item [icon]="choice.icon" [label]="choice.label | t" (chosen)="chosen.emit(choice.key)" />
  }
} @else {
  <app-row-group>
    @for (choice of choices; track choice.key) {
      <app-list-row
        [title]="choice.label | t"
        [icon]="choice.icon"
        [chevron]="true"
        [clickable]="true"
        (chosen)="chosen.emit(choice.key)"
      />
    }
  </app-row-group>
}
