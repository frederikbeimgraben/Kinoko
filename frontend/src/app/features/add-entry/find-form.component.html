@if (pickerOpen()) {
  <div class="form__body">
    @if (!wide()) {
      <h2 class="form__title">{{ 'map.species.choose' | t }}</h2>
    }
    <app-species-picker
      [species]="pickerSpecies()"
      [selected]="selectedSpecies()?.slug ?? null"
      [label]="'map.species.choose' | t"
      (chosen)="selectSpecies($event)"
    />
  </div>
  <app-action-bar [primary]="'common.cancel' | t" [ghost]="true" (primaryClick)="pickerOpen.set(false)" />
} @else {
  <div class="form__body">
    @if (!wide()) {
      <div class="form__head">
        <h2 class="form__title">{{ heading() }}</h2>
        <span class="form__note">{{ coordinates() }}</span>
      </div>
    }
    <app-form-field
      [label]="'species.fieldLabel' | t"
      [value]="speciesName()"
      [placeholder]="'map.species.choose' | t"
      [readOnly]="true"
      [chevron]="editing()"
      (displayClick)="pickerOpen.set(true)"
    />
    <div class="form__pair">
      <app-form-field
        kind="date"
        [label]="'entry.field.date' | t"
        [value]="date()"
        [display]="dateText()"
        (valueChange)="dateChoice.set($event)"
      />
      <app-form-field
        kind="number"
        [label]="'entry.field.count' | t"
        [placeholder]="'common.optional' | t"
        [value]="count()"
        (valueChange)="countChoice.set($event)"
      />
    </div>
    <app-form-field
      [label]="'entry.field.note' | t"
      [multiline]="true"
      [placeholder]="'common.optional' | t"
      [value]="note()"
      (valueChange)="noteChoice.set($event)"
    />
    @if (withPhotos()) {
      <div>
        <p class="form__label">{{ 'entry.field.photos' | t }}</p>
        <app-photo-picker [files]="photos()" (filesChange)="photos.set($event)" />
      </div>
    }
    <div>
      <p class="form__label">{{ 'entry.field.visibility' | t }}</p>
      <app-segmented
        [options]="segments()"
        [value]="visibility()"
        [label]="'entry.field.visibility' | t"
        (valueChange)="setVisibility($event)"
      />
    </div>
  </div>
  <app-action-bar
    [primary]="'common.save' | t"
    [secondary]="secondaryLabel()"
    [ghost]="!editing() && !wide()"
    [busy]="busy()"
    (primaryClick)="submit()"
    (secondaryClick)="cancelled.emit()"
  />
}
