<ng-template #body>
  @switch (state.step()) {
    @case ('actions') {
      <div class="addentry__brief">
        <h2 class="addentry__title">{{ 'entry.create' | t }}</h2>
        <app-add-actions (chosen)="start($event)" />
      </div>
      <app-action-bar [primary]="'common.cancel' | t" [ghost]="true" (primaryClick)="cancel()" />
    }
    @case ('findForm') {
      <app-find-form
        [location]="state.location()!"
        [heading]="'entry.reportFind.title' | t"
        [busy]="saving()"
        (submitted)="saveFind($event)"
        (cancelled)="cancel()"
      />
    }
    @case ('markerForm') {
      <app-object-form
        [heading]="'entry.setMarker.title' | t"
        [location]="state.location()"
        kind="marker"
        [nameMissingText]="'marker.nameFehlt' | t"
        [busy]="saving()"
        (submitted)="saveMarker($event)"
        (cancelled)="cancel()"
        (valuesChange)="onZoneValues($event)"
      />
    }
    @case ('zoneForm') {
      <app-object-form
        [heading]="'entry.zone.saveTitle' | t"
        kind="zone"
        [nameMissingText]="'zone.nameFehlt' | t"
        [busy]="saving()"
        (submitted)="saveZone($event)"
        (cancelled)="cancel()"
        (valuesChange)="onZoneValues($event)"
      />
    }
  }
</ng-template>

@if (state.running()) {
  <div class="addentry">
    @if (state.showsCrosshair() && !wide()) {
      <div class="addentry__crosshair">
        <app-crosshair [label]="'entry.setLocation.title' | t" />
      </div>
    }
    @if (asStepBar()) {
      <app-step-bar
        appSheetHeight
        [label]="title()"
        [note]="stepNote()"
        [actions]="barActions()"
        (chosen)="$event.run()"
      />
    } @else if (asPopover()) {
      <app-popover
        [open]="true"
        [anchor]="anchor"
        [rows]="true"
        [label]="'entry.create' | t"
        (closed)="cancel()"
      >
        <app-add-actions (chosen)="start($event)" />
      </app-popover>
    } @else {
      <app-overlay-host
        class="addentry__overlay"
        [class.addentry__overlay--form]="state.onForm()"
        [class.addentry__overlay--object]="state.step() !== 'findForm'"
        [open]="true"
        [modal]="state.dark()"
        [cover]="state.onForm()"
        (closed)="cancel()"
      >
        <app-sheet
          appSheetHeight
          [label]="title()"
          [title]="title()"
          [note]="coordinates()"
          [detents]="detents()"
          [modal]="true"
          [dismissible]="true"
          (closed)="cancel()"
        >
          <ng-container [ngTemplateOutlet]="body" />
        </app-sheet>
      </app-overlay-host>
    }
  </div>
}
