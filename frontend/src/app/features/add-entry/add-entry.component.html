<ng-template #body>
  @switch (state.step()) {
    @case ('actions') {
      <div class="addentry__brief">
        <app-add-actions (chosen)="start($event)" />
      </div>
    }
    @case ('findForm') {
      <app-find-form [location]="state.location()!" [busy]="saving()" (submitted)="saveFind($event)" />
    }
    @case ('markerForm') {
      <app-object-form
        kind="marker"
        [nameMissingText]="'marker.nameFehlt' | t"
        [busy]="saving()"
        (submitted)="saveMarker($event)"
        (valuesChange)="onZoneValues($event)"
      />
    }
    @case ('zoneForm') {
      <app-object-form
        kind="zone"
        [nameMissingText]="'zone.nameFehlt' | t"
        [busy]="saving()"
        (submitted)="saveZone($event)"
        (valuesChange)="onZoneValues($event)"
      />
    }
  }
</ng-template>

@if (state.running()) {
  <div class="addentry">
    @if (state.showsCrosshair() && !wide()) {
      <div class="addentry__crosshair">
        <app-crosshair [label]="'entry.setLocation.title' | t" />
      </div>
    }
    @if (asStepBar()) {
      <app-step-bar
        appSheetHeight
        [label]="title()"
        [note]="stepNote()"
        [actions]="barActions()"
        (chosen)="$event.run()"
      />
    } @else if (asPopover()) {
      <app-popover [open]="true" [anchor]="anchor" [label]="'entry.create' | t" (closed)="cancel()">
        <app-add-actions (chosen)="start($event)" />
      </app-popover>
    } @else {
      <app-overlay-host
        class="addentry__overlay"
        [class.addentry__overlay--form]="state.onForm()"
        [class.addentry__overlay--object]="state.step() !== 'findForm'"
        [open]="true"
        [modal]="state.dark()"
        (closed)="cancel()"
      >
        <app-sheet
          appSheetHeight
          [label]="title()"
          [title]="title()"
          [note]="coordinates()"
          [style.--sheet-title-size.px]="titleSize()"
          [style.--sheet-title-weight]="titleBold() ? 700 : null"
          [style.--sheet-title-tracking]="titleBold() ? '-0.01em' : null"
          [modal]="true"
          [dismissible]="true"
          (closed)="cancel()"
        >
          <ng-container [ngTemplateOutlet]="body" />
        </app-sheet>
      </app-overlay-host>
    }
  </div>
}
