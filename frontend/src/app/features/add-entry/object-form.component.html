<div class="overlay-body form__body" appScrollFade [class.form__body--busy]="busy()">
  @if (location(); as point) {
    <app-row-group>
      <app-list-row
        [title]="'entry.field.location' | t"
        [plain]="place()"
        [chevron]="true"
        [clickable]="true"
        (chosen)="locationClick.emit(current())"
      />
    </app-row-group>
  }
  <app-form-field
    [label]="'common.name' | t"
    [placeholder]="'entry.field.namePlaceholder' | t"
    [value]="name()"
    (valueChange)="setName($event)"
  />
  <app-form-field
    [label]="'entry.field.note' | t"
    [multiline]="true"
    [placeholder]="'common.optional' | t"
    [value]="noteText()"
    (valueChange)="setNote($event)"
  />
  <app-section [label]="'common.colour' | t">
    <div class="form__chips" role="group" [attr.aria-label]="'common.colour' | t">
      @for (chip of chips(); track chip.value) {
        <app-filter-chip
          [label]="chip.label"
          [dot]="chip.hex"
          [on]="chip.value === colour()"
          (chosen)="setColour(chip.value)"
        />
      }
    </div>
  </app-section>
  @if (area() !== null) {
    <app-row-group>
      <app-list-row [title]="'entry.zone.area' | t" [value]="areaText()" [unit]="'unit.hectare' | t" />
    </app-row-group>
  }
</div>
<app-action-bar
  foot
  [primary]="'common.save' | t"
  [busy]="busy()"
  [secondary]="marker() ? undefined : ('entry.zone.changeOutline' | t)"
  [tonalSecondary]="true"
  (primaryClick)="submit()"
  (secondaryClick)="outlineClick.emit(current())"
/>
