<app-sheet [label]="'faktor.hinzufuegen' | t" [detent]="2" [modal]="true">
  <div class="choose" role="group" [attr.aria-label]="'faktor.hinzufuegen' | t">
    @for (gruppe of groups(); track gruppe.titel) {
      <h3 class="picker__group">{{ gruppe.titel | t }}</h3>
      @for (layer of gruppe.layers; track layer.id) {
        <app-list-row
          [title]="layer.label"
          [subline]="subline(layer)"
          [value]="layer.unit"
          [clickable]="!assigned().has(layer.id)"
          [class.picker__row--off]="assigned().has(layer.id)"
          (chosen)="chosen.emit(layer)"
        />
      }
    }
  </div>
  <app-action-bar [primary]="'faktor.abbrechen' | t" (primaryClick)="closed.emit()" />
</app-sheet>
