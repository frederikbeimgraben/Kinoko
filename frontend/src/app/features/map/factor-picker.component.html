<div class="overlay-body picker">
  <div class="overlay-body__head">
    <h2 class="overlay-body__title">{{ 'map.factor.choose' | t }}</h2>
    <button
      class="overlay-body__close tap"
      type="button"
      data-press="scale"
      [attr.aria-label]="'common.close' | t"
      (click)="closed.emit()"
    >
      <app-svg-icon name="close" [size]="18" />
    </button>
  </div>
  <div class="picker__card" appScrollFade role="group" [attr.aria-label]="'map.factor.choose' | t">
    @for (group of groups(); track group.title) {
      @for (row of group.rows; track row.layer.id) {
        <app-list-row
          kind="filter"
          [title]="row.name"
          [icon]="row.icon"
          [value]="row.unit"
          [chevron]="true"
          [clickable]="true"
          (chosen)="chosen.emit(row.layer)"
        />
      }
    }
  </div>
</div>
