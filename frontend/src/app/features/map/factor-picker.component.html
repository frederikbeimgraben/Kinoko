<div class="overlay-body picker">
  <div class="overlay-body__head">
    <h2 class="overlay-body__title">{{ 'map.factor.choose' | t }}</h2>
    <button
      class="overlay-body__close tap"
      type="button"
      data-press="scale"
      [attr.aria-label]="'common.close' | t"
      (click)="closed.emit()"
    >
      <app-svg-icon name="close" [size]="18" />
    </button>
  </div>
  <div class="picker__card" role="group" [attr.aria-label]="'map.factor.choose' | t">
    @for (group of groups(); track group.title) {
      <h3 class="picker__group">{{ group.title | t }}</h3>
      @for (layer of group.layers; track layer.id) {
        <app-list-row
          [title]="layer.label"
          [subline]="subline(layer)"
          [value]="unit(layer)"
          [chevron]="true"
          [clickable]="!assigned().has(layer.id)"
          [class.picker__row--off]="assigned().has(layer.id)"
          (chosen)="chosen.emit(layer)"
        />
      }
    }
  </div>
</div>
