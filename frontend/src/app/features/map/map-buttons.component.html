<app-floating-button
  icon="layers"
  [label]="'map.layers.button' | t"
  [variant]="layersOpen() ? 'primary' : 'default'"
  (pressed)="layersToggled.emit()"
/>
@if (showsLocation()) {
  <app-floating-button
    icon="location"
    [label]="'map.location' | t"
    [disabled]="!locationAllowed()"
    (pressed)="located.emit()"
  />
}
@if (turned()) {
  <app-floating-button
    icon="compass"
    [label]="'map.compass' | t"
    [rotation]="needle()"
    (pressed)="northed.emit()"
  />
}
