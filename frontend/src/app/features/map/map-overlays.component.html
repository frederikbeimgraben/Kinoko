<ng-template #body>
  @switch (open()) {
    @case ('species') {
      <div class="overlay-body">
        <app-species-picker
          [species]="view.speciesChoices()"
          [selected]="state.species()"
          [label]="'map.species.choose' | t"
          (chosen)="chooseSpecies($event)"
        />
      </div>
    }
    @case ('layer') {
      <div class="overlay-body">
        <app-layer-list
          [layers]="view.layers()"
          [selected]="state.layer()"
          [label]="'map.tab.layer' | t"
          (chosen)="chooseLayer($event)"
        />
      </div>
    }
    @case ('factor') {
      @if (factor(); as chosen) {
        @if (factorLayer(); as layer) {
          <app-factor-sheet
            [factor]="chosen"
            [layer]="layer"
            [histogram]="histogram()"
            (apply)="factorApplied.emit($event)"
            (removed)="factorRemoved.emit($event)"
          />
        }
      }
    }
    @case ('save') {
      <div class="overlay-body overlay-body--roomy">
        <app-form-field [label]="'common.name' | t" [value]="name()" (valueChange)="name.set($event)" />
      </div>
      <app-action-bar [primary]="'common.save' | t" [inline]="wide()" (primaryClick)="confirmName()" />
    }
    @case ('combinations') {
      <app-combinations
        [saved]="combination.saved()"
        (picked)="pick($event)"
        (removed)="combination.delete($event)"
      />
    }
  }
</ng-template>

<app-overlay-host [open]="shown()" (closed)="dismiss()">
  <app-sheet
    [label]="'nav.tab.map' | t"
    [title]="title()"
    [style.--sheet-title-size.px]="open() === 'save' ? null : 20"
    [compact]="open() === 'save'"
    [modal]="true"
    [dismissible]="true"
    (closed)="dismiss()"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </app-sheet>
</app-overlay-host>
