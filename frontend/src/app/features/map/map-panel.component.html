<div class="panel__head">
  @if (onForecast()) {
    <app-filter-chip
      icon="mushroom"
      [label]="view.speciesTitle()"
      [caret]="true"
      (chosen)="titleChosen.emit()"
    />
  } @else {
    <span class="panel__head-spacer"></span>
  }
  <b class="panel__when">{{ view.weekText() }}</b>
</div>

@if (view.failed()) {
  <app-error-state class="panel__failed" [text]="'map.dataFailed' | t" (retry)="view.retry()" />
} @else if (view.loading()) {
  <app-timeline [weeks]="[]" [loading]="true" [label]="'map.timeline' | t" />
} @else if (!view.noSpecies() && !view.forecastMissing()) {
  <app-timeline
    [weeks]="view.weeks()"
    [active]="view.activeWeek()"
    [dimmed]="dimmed()"
    [align]="wide() ? 'centre' : 'end'"
    [label]="'map.timeline' | t"
    (chosen)="weekChosen.emit($event)"
  />
}

<app-segmented
  [options]="views()"
  [value]="state.view()"
  [label]="'map.view' | t"
  [loading]="view.loading()"
  (valueChange)="setView($event)"
/>
