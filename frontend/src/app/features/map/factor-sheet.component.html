<app-sheet [label]="'faktor.titel' | t" [detent]="2" [modal]="true">
  <app-sheet-head head [title]="layer().label" [week]="timeScope()" [arrows]="false" />
  <div class="factor">
    <app-segmented
      [options]="conditions()"
      [value]="draft().condition"
      [label]="'faktor.bedingung' | t"
      (valueChange)="setCondition($event)"
    />

    <div>
      <h3 class="factor__title">{{ distributionText() }}</h3>
      @if (histogramm(); as distribution) {
        <app-histogram
          [anteile]="distribution.anteile"
          [label]="distributionText()"
          [von]="fromShare()"
          [bis]="toShare()"
        />
      }
      <app-range-slider
        [min]="layer().low"
        [max]="layer().high"
        [step]="step()"
        [from]="values().von"
        [to]="values().bis"
        [handles]="handles()"
        (fromChange)="setFrom($event)"
        (toChange)="setTo($event)"
      />
      <div class="factor__ends">
        <span>{{ scaleFrom() }}</span>
        <span>{{ condition() }}</span>
        <span>{{ scaleTo() }}</span>
      </div>
    </div>

    <app-key-value-row [key]="'faktor.bedingung' | t" [value]="condition()" />

    <p class="note note--sub">{{ shareText() }}</p>
  </div>
  <div class="factor__footer">
    <app-icon-button
      icon="delete"
      variant="secondary"
      [label]="'faktor.entfernen' | t"
      (pressed)="remove.emit(draft())"
    />
    <app-action-bar
      class="factor__actions"
      [primary]="'faktor.uebernehmen' | t"
      [secondary]="'faktor.abbrechen' | t"
      (primaryClick)="apply.emit(draft())"
      (secondaryClick)="closed.emit()"
    />
  </div>
</app-sheet>
