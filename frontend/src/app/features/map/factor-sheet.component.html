@if (withHead()) {
  <app-sheet-head [title]="layer().label" [icon]="glyph()" [week]="layer().note" [arrows]="false" />
}
<div class="factor">
  <app-segmented
    [options]="conditions()"
    [value]="draft().condition"
    [label]="'map.factor.condition' | t"
    (valueChange)="setCondition($event)"
  />

  <div>
    <h3 class="factor__title">{{ distribution() }}</h3>
    @if (histogram(); as shares) {
      <app-histogram
        [shares]="shares.shares"
        [label]="distribution()"
        [from]="fromShare()"
        [to]="toShare()"
      />
    }
    <app-range-slider
      [min]="layer().low"
      [max]="layer().high"
      [step]="step()"
      [from]="values().low"
      [to]="values().high"
      [handles]="handles()"
      (fromChange)="setFrom($event)"
      (toChange)="setTo($event)"
    />
    <div class="factor__ends">
      <span>{{ scaleFrom() }}</span>
      <span>{{ bound() }}</span>
      <span>{{ scaleTo() }}</span>
    </div>
  </div>

  <div class="factor__applied">
    <span class="factor__key">{{ 'map.factor.condition' | t }}</span>
    <output class="factor__box">{{ condition() }}</output>
  </div>
</div>
<app-action-bar
  [primary]="'common.apply' | t"
  [secondary]="'map.factor.remove' | t"
  [secondaryDanger]="true"
  (primaryClick)="apply.emit(draft())"
  (secondaryClick)="removed.emit(draft())"
/>
