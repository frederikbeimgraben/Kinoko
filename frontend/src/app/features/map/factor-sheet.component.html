@if (withHead()) {
  <app-sheet-head [title]="name()" [icon]="glyph()" [week]="period()" />
}
<div class="overlay-body factor" appScrollFade>
  <app-segmented
    [options]="conditions()"
    [value]="draft().condition"
    [label]="'map.factor.condition' | t"
    (valueChange)="setCondition($event)"
  />

  <app-section [label]="head()">
    @if (histogram(); as shares) {
      <app-histogram
        [shares]="shares.shares"
        [label]="distribution()"
        [from]="fromShare()"
        [to]="toShare()"
      />
    }
    <app-range-slider
      [min]="layer().low"
      [max]="layer().high"
      [step]="step()"
      [from]="values().low"
      [to]="values().high"
      [handles]="handles()"
      (fromChange)="setFrom($event)"
      (toChange)="setTo($event)"
    />
    <div class="factor__ends">
      <span>{{ scaleFrom() }}</span>
      <span>{{ bound() }}</span>
      <span>{{ scaleTo() }}</span>
    </div>
  </app-section>

  <app-form-field [label]="'map.factor.condition' | t" [value]="condition()" [readOnly]="true" />

  <app-row-group>
    <app-list-row [title]="'map.factor.period' | t" [plain]="period()" />
  </app-row-group>
</div>
<app-action-bar
  foot
  [primary]="'common.apply' | t"
  [secondary]="'map.factor.remove' | t"
  [secondaryDanger]="true"
  (primaryClick)="apply.emit(draft())"
  (secondaryClick)="removed.emit(draft())"
/>
