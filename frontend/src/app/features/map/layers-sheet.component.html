@if (wide()) {
  <app-popover [open]="true" [anchor]="anchor" [label]="'map.layers.button' | t" (closed)="closed.emit()">
    <app-layers-body class="layers__pop" />
  </app-popover>
} @else {
  <app-overlay-host [open]="true" [modal]="true" (closed)="closed.emit()">
    <app-sheet
      [label]="'map.layers.button' | t"
      [title]="'map.layers.button' | t"
      [modal]="true"
      [dismissible]="true"
      (closed)="closed.emit()"
    >
      <div class="overlay-body" appScrollFade>
        <app-layers-body />
      </div>
      <div foot class="layers__end"></div>
    </app-sheet>
  </app-overlay-host>
}
