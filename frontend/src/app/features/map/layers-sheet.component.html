<app-popover [open]="true" [anchor]="anchor" [label]="'map.layers.button' | t" (closed)="closed.emit()">
  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.basemap.title' | t }}</h3>
    <app-segmented
      [options]="choices()"
      [value]="background()"
      [label]="'map.basemap.title' | t"
      (valueChange)="chooseBackground($event)"
    />
  </section>

  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.layers.title' | t }}</h3>
    <div class="layers__switches">
      <app-choice-row
        [label]="'map.layers.sharedFinds' | t"
        [count]="count(sharedFindCount())"
        [checked]="showSharedFinds()"
        (toggled)="showSharedFindsChange.emit($event)"
      />
      <app-choice-row
        [label]="'map.layers.myMarkers' | t"
        [count]="count(markerCount())"
        [checked]="showMarkers()"
        (toggled)="showMarkersChange.emit($event)"
      />
      <app-choice-row
        [label]="'entry.zones' | t"
        [count]="count(zoneCount())"
        [checked]="showZones()"
        (toggled)="showZonesChange.emit($event)"
      />
      @if (showsLayer()) {
        <app-choice-row
          [label]="'map.forecastBelow' | t"
          [checked]="forecastBelow()"
          (toggled)="forecastBelowChange.emit($event)"
        />
      }
    </div>
  </section>

  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.opacity' | t }}</h3>
    <app-range-slider
      [from]="0"
      [to]="percent()"
      [handles]="'to'"
      [variant]="'dot'"
      (toChange)="onOpacity($event)"
    />
  </section>
</app-popover>
