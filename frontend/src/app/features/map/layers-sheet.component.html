<button
  class="layers__scrim tap"
  type="button"
  data-press="tint"
  [attr.aria-label]="'common.close' | t"
  (click)="closed.emit()"
></button>
<div class="layers__card" role="dialog" [attr.aria-label]="'map.layers.button' | t">
  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.basemap.title' | t }}</h3>
    <app-segmented
      [options]="choices()"
      [value]="background()"
      [label]="'map.basemap.title' | t"
      (valueChange)="chooseBackground($event)"
    />
  </section>

  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.layers.title' | t }}</h3>
    <div class="layers__switches">
      <app-check-row
        [title]="'map.layers.sharedFinds' | t"
        [value]="count(sharedFindCount())"
        [checked]="showSharedFinds()"
        (toggled)="showSharedFindsChange.emit($event)"
      />
      <app-check-row
        [title]="'map.layers.myMarkers' | t"
        [value]="count(markerCount())"
        [checked]="showMarkers()"
        (toggled)="showMarkersChange.emit($event)"
      />
      <app-check-row
        [title]="'entry.zones' | t"
        [value]="count(zoneCount())"
        [checked]="showZones()"
        (toggled)="showZonesChange.emit($event)"
      />
      @if (showsLayer()) {
        <app-check-row
          [title]="'map.forecastBelow' | t"
          [checked]="forecastBelow()"
          (toggled)="forecastBelowChange.emit($event)"
        />
      }
    </div>
  </section>

  <section class="layers__part">
    <h3 class="layers__title">{{ 'map.opacity' | t }}</h3>
    <app-range-slider [from]="percent()" [to]="100" [handles]="'from'" (fromChange)="onOpacity($event)" />
  </section>
</div>
