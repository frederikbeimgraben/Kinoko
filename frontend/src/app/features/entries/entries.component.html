<ng-template #list>
  @if (waiting()) {
    <app-skeleton kind="rows" shape="item" lead="thumb" trail="chevron" [count]="5" [labels]="[0]" />
  } @else if (rows().length === 0) {
    <app-state-view icon="entries" [title]="emptyText() | t" />
  } @else {
    <app-entry-list class="motion-list-in" [rows]="rows()" (chosen)="open($event)" />
  }
</ng-template>

<app-page-header [title]="'entry.list.title' | t">
  @if (signedIn()) {
    <app-icon-button
      icon="filter"
      [kind]="filtered() ? 'tonal' : 'plain'"
      [label]="'common.filter' | t"
      (pressed)="filterOpen.set(true)"
    />
  }
</app-page-header>

@if (signedIn()) {
  <div class="chips" role="group" [attr.aria-label]="'entry.list.title' | t">
    @for (one of segments; track one.value) {
      <app-filter-chip
        [label]="one.label | t"
        [icon]="one.icon"
        [on]="segment() === one.value"
        (chosen)="selectSegment(one.value)"
      />
    }
  </div>
  @if (zoneChip(); as zone) {
    <div class="chips chips--active">
      <app-filter-chip icon="zone" [label]="zone.name" [on]="true" [clear]="true" (removed)="clearZone()" />
    </div>
  }
  <div class="area">
    @if (wide()) {
      <div class="frame">
        <app-surface class="surface">
          <div class="scroll" appScrollFade><ng-container [ngTemplateOutlet]="list" /></div>
        </app-surface>
      </div>
    } @else {
      <div class="scroll" appScrollFade><ng-container [ngTemplateOutlet]="list" /></div>
      <app-floating-button class="fab" icon="plus" [label]="'entry.create' | t" (pressed)="startEntry()" />
    }
  </div>
} @else {
  <app-state-view
    class="guest"
    icon="entries"
    [title]="'state.notSignedIn' | t"
    [action]="'account.signIn' | t"
    [text]="ssoMissing() ? ('account.signInUnavailable' | t) : ''"
    [actionBusy]="signingIn()"
    [actionDisabled]="ssoMissing()"
    (actionClick)="signIn()"
  />
}

@if (banner(); as state) {
  <app-banner
    [kind]="state.offline ? 'noConnection' : 'pending'"
    [text]="state.text"
    [count]="state.count"
    [chev]="false"
    [actionIcon]="state.offline ? undefined : 'refresh'"
    [actionLabel]="state.offline ? undefined : 'entry.pending.send'"
    (actionClick)="send()"
  />
}

<app-filter-sheet
  [open]="filterOpen()"
  [title]="'common.filter' | t"
  [resetEnabled]="filtered()"
  [primaryLabel]="matchCount()"
  (resetClick)="resetFilter()"
  (primaryClick)="filterOpen.set(false)"
  (closed)="filterOpen.set(false)"
>
  <app-entries-filter-body
    [filter]="filter()"
    [groups]="groupList()"
    [zones]="zones()"
    [today]="today"
    (filterChange)="changeFilter($event)"
  />
</app-filter-sheet>
