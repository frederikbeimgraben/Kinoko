<app-page-header [title]="'entry.list.title' | t">
  @if (signedIn()) {
    <button class="entries__add tap" type="button" data-press="scale" (click)="startEntry()">
      <app-svg-icon name="plus" [size]="16" [strokeWidth]="2" />
      {{ 'entry.create' | t }}
    </button>
  }
</app-page-header>
<div class="entries">
  @if (offline()) {
    <app-banner kind="pending" />
  }
  <app-segmented
    [options]="segments()"
    [value]="segment()"
    [label]="'entry.list.title' | t"
    (valueChange)="selectSegment($event)"
  />
  @if (segment() === 'finds') {
    <div class="marks">
      <button
        class="marks__button tap"
        type="button"
        data-press="scale"
        [class.marks__button--on]="filtered()"
        (click)="filterOpen.set(true)"
      >
        <app-svg-icon name="filter" [size]="17" [strokeWidth]="1.8" />
        {{ 'common.filter' | t }}
      </button>
    </div>
  }
  @if (rows().length === 0) {
    <app-empty-state
      icon="entries"
      [text]="emptyText() | t"
      [action]="signedIn() ? undefined : ('account.signIn' | t)"
      (actionClick)="signIn()"
    />
  } @else if (segment() === 'finds') {
    <div class="entries__list">
      @for (row of rows(); track row.key) {
        <app-entry-row [entry]="row.entry" [pending]="row.pending" (chosen)="open(row)" />
      }
    </div>
  } @else {
    <div class="entries__list">
      @for (row of rows(); track row.key) {
        @if (row.pending) {
          <app-entry-row [entry]="row.entry" [pending]="true" />
        } @else {
          <app-list-row
            [title]="row.entry.title"
            [subline]="row.entry.meta"
            [chevron]="true"
            [clickable]="row.object !== null"
            (chosen)="open(row)"
          >
            <span lead class="entries__dot" [style.background]="row.colour"></span>
          </app-list-row>
        }
      }
    </div>
  }
</div>
