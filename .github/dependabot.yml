version: 2

# Minor and patch updates come as one pull request per ecosystem. A project
# with one maintainer cannot review more update pull requests.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      klein:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      klein:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      klein:
        update-types: [minor, patch]
