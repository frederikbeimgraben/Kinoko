name: CI

# The backend jobs run in the Nix dev shell of the flake. The shell holds
# the C libraries of the data pipeline (LightGBM, netCDF, GDAL) that cgo needs.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  be-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Format
        run: nix develop .#backend -c bash -c 'cd backend && test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
      - name: Vet
        run: nix develop .#backend -c bash -c 'cd backend && go vet ./...'
      - name: golangci-lint
        run: nix develop .#backend -c bash -c 'cd backend && golangci-lint run ./...'
      - name: Repository rules (size, comment language)
        run: nix develop .#backend -c bash -c 'cd backend && go run ./tools/lintrules .'

  be-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Unit and HTTP tests
        run: nix develop .#backend -c bash -c 'cd backend && go test -race -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -1'

  be-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the service
        run: nix develop .#backend -c backend/build.sh
      - name: Start the service
        working-directory: backend
        run: |
          export PILZE_DB=$RUNNER_TEMP/pilze.sqlite PILZE_PIPELINE=false
          nix develop ..#backend -c ./kinoko serve &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8111/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::The service does not answer"
          exit 1
      # The app stamps the same "git describe". Both must show the same version.
      - name: Version of the build
        working-directory: frontend
        run: |
          app=$(node -e "import('./tools/stamp-version.mjs').then((m) => console.log(m.describe()))")
          service=$(curl -sf http://127.0.0.1:8111/api/config | jq -r .version)
          [ "$app" = "$service" ] || { echo "::error::app $app, service $service"; exit 1; }
      - name: Schemathesis
        working-directory: backend
        run: >
          pipx run schemathesis run openapi.yaml
          --url http://127.0.0.1:8111/api
          --phases examples,coverage
          --max-failures 25
          --report junit
          --report-dir schemathesis-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis
          path: backend/schemathesis-report
          if-no-files-found: ignore
          retention-days: 7

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
      - name: Build the service and the app with Nix
        run: nix build .#backend .#frontend --print-build-logs

  fe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint

  fe-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck

  fe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # test:ci runs once and measures the coverage. npm test is the watch mode.
      - working-directory: frontend
        run: npm run test:ci

  fe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # The budgets in frontend/angular.json stop the build.
      - working-directory: frontend
        run: npm run build

  fe-contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run api:generate
      - name: The generated client agrees with the contract
        run: git diff --exit-code -- frontend/src/app/core/api/contract.d.ts

  fe-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run build:e2e
      - name: Flows
        working-directory: frontend
        run: npm run e2e:flows
      - name: Baselines against the design
        working-directory: frontend
        run: npm run boards:check
      - name: Boards
        working-directory: frontend
        run: npm run e2e:boards
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diffs
          path: |
            frontend/e2e/ergebnisse
            frontend/e2e/bericht
          if-no-files-found: ignore
          retention-days: 7

  fe-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      # The PWA category stops the job. The performance category warns.
      - name: Lighthouse
        working-directory: frontend
        run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: frontend/lighthouse-bericht
          if-no-files-found: ignore
          retention-days: 7
