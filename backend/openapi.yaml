        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        combinations:
          type: array
          items:
            $ref: "#/components/schemas/Combination"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
      required: [me, finds, markers, zones, combinations, photos]

    Permission:
