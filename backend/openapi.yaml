      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Machine-readable key, for example not_found or last_admin.
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
      required: [type, title, status, code]

    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
      required: [field, code]

    Health:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Config:
      type: object
      properties:
        oidcIssuer:
          type: string
        oidcClientId:
          type: string
        origin:
          type: string
        version:
          type: string
      required: [oidcIssuer, oidcClientId, origin, version]

    Me:
      type: object
      properties:
