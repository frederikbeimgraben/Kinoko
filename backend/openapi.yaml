          $ref: "#/components/schemas/PhotoState"
        rejectReason:
          oneOf:
            - type: string
            - type: "null"
        reviewedById:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ownerId
        - width
        - height
        - photographer
        - ownerName
        - licence
        - lead
        - state
        - createdAt
        - updatedAt

    PhotoPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    TextWrite:
      type: object
      properties:
        locale:
          type: string
        value:
          type: string
          minLength: 1
          maxLength: 2000
      required: [locale, value]

    TextEntry:
      type: object
      properties:
        key:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
        changed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required: [key, values, changed, updatedAt]

    TextsCatalogue:
      type: object
      properties:
        revision:
          type: string
        locales:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TextEntry"
      required: [revision, locales, entries]

    RoleBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required: [id, slug, name]

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          oneOf:
            - type: string
            - type: "null"
        builtIn:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        peopleCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - builtIn
        - permissions
        - peopleCount
        - createdAt
        - updatedAt

    RoleCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
        name:
          type: string
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required: [slug, name]

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          oneOf:
            - type: string
            - type: "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RolePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    FriendGroup:
      type: object
      required: [id, name, ownerId, inviteCode, members, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        inviteCode:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/FriendGroupMember"
        createdAt:
          type: string
          format: date-time
    FriendGroupWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    FriendGroupMember:
      type: object
      required: [userId, name, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
    FriendGroupJoin:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
    GlossaryEntry:
      type: object
      required: [id, term, termEn, definition, definitionEn, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        term:
          type: string
        termEn:
          type: string
          description: The English term. Empty if nobody has written it.
        definition:
          type: string
        definitionEn:
          type: string
          description: The English definition. Empty if nobody has written it.
        updatedByName:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
    GlossaryEntryWrite:
      type: object
      required: [term, definition]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 80
        termEn:
          type: string
          maxLength: 80
          description: Without the field, a create stores an empty text and an update keeps the old one.
        definition:
          type: string
          minLength: 1
          maxLength: 600
        definitionEn:
          type: string
          maxLength: 600
          description: Without the field, a create stores an empty text and an update keeps the old one.
    PersonName:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
        email:
          oneOf:
            - type: string
            - type: "null"
        name:
          oneOf:
            - type: string
            - type: "null"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBrief"
        groupAdmin:
          type: boolean
          description: The admin group of the SSO makes the person an admin without a stored role.
        createdAt:
          type: string
          format: date-time
      required: [id, sub, roles, groupAdmin, createdAt]

    PersonPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    PipelineRunSpeciesEntry:
      type: object
      properties:
        speciesId:
          type: string
          format: uuid
        state:
          type: string
        recordCount:
          type: integer
        findCount:
          type: integer
      required: [speciesId, state, recordCount, findCount]

    PipelineRunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/RunKind"
        state:
          $ref: "#/components/schemas/RunState"
        queuedAt:
          type: string
          format: date-time
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        finishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        triggeredById:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        speciesName:
          description: The name of the species when the run has only one species, else null.
          oneOf:
            - type: string
            - type: "null"
        speciesCount:
          type: integer
        recordCount:
          type: integer
        progressDone:
          type: integer
        progressTotal:
          type: integer
      required:
        - id
        - kind
        - state
        - queuedAt
        - speciesCount
        - recordCount
        - progressDone
        - progressTotal

    PipelineRunStep:
      type: object
      properties:
        position:
          type: integer
        name:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        durationS:
          oneOf:
            - type: integer
            - type: "null"
      required: [position, name, state, durationS]

    PipelineRunDetail:
      allOf:
        - $ref: "#/components/schemas/PipelineRunSummary"
        - type: object
          properties:
            logPath:
              oneOf:
                - type: string
                - type: "null"
            metricBrier:
              oneOf:
                - type: number
                - type: "null"
            metricBrierPrevious:
              oneOf:
                - type: number
                - type: "null"
            progressDone:
              type: integer
            progressTotal:
              type: integer
            species:
              type: array
              items:
                $ref: "#/components/schemas/PipelineRunSpeciesEntry"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/PipelineRunStep"
            logTail:
              type: array
              items:
                type: string
              maxItems: 200
            inputs:
              description: The data sources that the run read, from pipeline_run_input.
              type: array
              items:
                $ref: "#/components/schemas/PipelineRunInput"
          required:
            - species
            - steps
            - logTail
            - progressDone
            - progressTotal

    PipelineRunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRunSummary"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
      required: [items, nextCursor]

    DataSourceKind:
      type: string
      enum:
        - gbif-archive
        - tree-species-map
        - dem
        - soilgrids
        - germany-outline
        - trees-grid
        - tree-scales
        - site-grid
        - weather-checkpoints
        - model-bundle
        - static-layers

    DataSourceState:
      type: string
      enum: [missing, validating, processing, ready, failed]

    VersionState:
      type: string
      enum: [validating, processing, ready, failed, superseded]

    RemoteSourceId:
      type: string
      enum: [dwd-hyras, dwd-soil-moisture, gbif-occurrences]

    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    Accept:
      type: object
      properties:
        extensions:
          type: array
          items:
            type: string
        mediaTypes:
          type: array
          items:
            type: string
        maxBytes:
          type: integer
      required: [extensions, mediaTypes, maxBytes]

    DataSource:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/DataSourceKind"
        required:
          type: boolean
        perSpecies:
          description: True for model-bundle.
          type: boolean
        usedBy:
          type: array
          items:
            type: string
            enum: [training, render, layers, occurrences]
        state:
          $ref: "#/components/schemas/DataSourceState"
        satisfiedBy:
          description: The kind whose derived output satisfies this kind, for example tree-species-map for trees-grid.
          oneOf:
            - $ref: "#/components/schemas/DataSourceKind"
            - type: "null"
        accept:
          $ref: "#/components/schemas/Accept"
        activeVersion:
          oneOf:
            - $ref: "#/components/schemas/DataSourceVersion"
            - type: "null"
        latestVersion:
          oneOf:
            - $ref: "#/components/schemas/DataSourceVersion"
            - type: "null"
      required: [kind, required, perSpecies, usedBy, state, satisfiedBy, accept, activeVersion, latestVersion]

    DataSourceDetail:
      allOf:
        - $ref: "#/components/schemas/DataSource"
        - type: object
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/DataSourceVersion"
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
            openUpload:
              oneOf:
                - $ref: "#/components/schemas/Upload"
                - type: "null"
          required: [versions, nextCursor, openUpload]

    DataSourceArtifact:
      type: object
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
      required: [name, sizeBytes]

    DataSourceVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/DataSourceKind"
        version:
          type: integer
        origin:
          type: string
          enum: [upload, derived, training]
        derivedFromId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        speciesId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        state:
          $ref: "#/components/schemas/VersionState"
        active:
          type: boolean
        fileName:
          oneOf:
            - type: string
            - type: "null"
        sizeBytes:
          oneOf:
            - type: integer
            - type: "null"
        sha256:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceArtifact"
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                detail:
                  oneOf:
                    - type: string
                    - type: "null"
              required: [code, detail]
            - type: "null"
        createdBy:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  oneOf:
                    - type: string
                    - type: "null"
              required: [id, name]
            - type: "null"
        createdAt:
          type: string
          format: date-time
        processedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        activatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - id
        - kind
        - version
        - origin
        - derivedFromId
        - speciesId
        - state
        - active
        - fileName
        - sizeBytes
        - sha256
        - metadata
        - artifacts
        - error
        - createdBy
        - createdAt
        - processedAt
        - activatedAt

    UploadCreate:
      description: speciesId is only for a model-bundle with one species.
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256"
        speciesId:
          type: string
          format: uuid
        activate:
          type: boolean
          default: true
      required: [fileName, sizeBytes]

    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/DataSourceKind"
        speciesId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        fileName:
          type: string
        sizeBytes:
          type: integer
        receivedBytes:
          type: integer
        partSize:
          type: integer
        state:
          type: string
          enum: [open, complete, aborted, expired]
        expiresAt:
          type: string
          format: date-time
        versionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
      required: [id, kind, speciesId, fileName, sizeBytes, receivedBytes, partSize, state, expiresAt, versionId]

    RemoteSource:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/RemoteSourceId"
        url:
          type: string
          format: uri
        cadence:
          type: string
        state:
          type: string
          enum: [empty, bootstrapping, ok, stale, failed]
        years:
          type: array
          items:
            type: integer
        files:
          type: integer
        sizeBytes:
          type: integer
        lastCheckedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        lastChangedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        error:
          oneOf:
            - type: string
            - type: "null"
      required: [source, url, cadence, state, years, files, sizeBytes, lastCheckedAt, lastChangedAt, error]

    PipelineRunInput:
      type: object
      properties:
        kind:
          type: string
        versionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        version:
          oneOf:
            - type: integer
            - type: "null"
      required: [kind, versionId, version]
