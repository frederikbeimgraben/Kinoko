      operationId: getPipelineRun
      tags: [pipeline-runs]
      x-permission: run.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /data-sources:
    get:
      operationId: listDataSources
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataSource"
                required: [items]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /data-sources/{kind}:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
    get:
      operationId: getDataSource
      tags: [data-sources]
      x-permission: data.manage
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Cursor"
        - name: speciesId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /data-sources/{kind}/uploads:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
    post:
      operationId: createDataSourceUpload
      tags: [data-sources]
      x-permission: data.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another upload of this kind is open (code upload_open).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: sizeBytes is more than the limit of the kind (code too_large).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
        "507":
          description: Not enough free disk space (code disk_full).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /data-source-uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDataSourceUpload
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: appendDataSourceUpload
      tags: [data-sources]
      x-permission: data.manage
      description: Appends one part at the offset Upload-Offset. The part is at most partSize bytes.
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 16777216
      responses:
        "200":
          description: Part stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: offset_mismatch (the header Upload-Offset gives the current offset) or upload_closed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The part is larger than partSize or goes past sizeBytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The body is not application/octet-stream.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      operationId: abortDataSourceUpload
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "204":
          description: Aborted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The upload is complete (code upload_closed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /data-source-uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: completeDataSourceUpload
      tags: [data-sources]
      x-permission: data.manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
      responses:
        "202":
          description: Version made, validation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: incomplete, checksum_mismatch or upload_closed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"

  /data-sources/{kind}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDataSourceVersion
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDataSourceVersion
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: in_use (active and required, no other ready version) or run_active.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /data-sources/{kind}/versions/{versionId}/activate:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: activateDataSourceVersion
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: not_ready or run_active.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /data-sources/{kind}/versions/{versionId}/reprocess:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: reprocessDataSourceVersion
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: run_active, or the version has no original file (code no_original).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /data-sources/{kind}/versions/{versionId}/log:
    parameters:
      - $ref: "#/components/parameters/DataSourceKind"
      - $ref: "#/components/parameters/VersionId"
    get:
      operationId: getDataSourceVersionLog
      tags: [data-sources]
      x-permission: data.manage
      parameters:
        - name: tail
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: string
                required: [lines]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /remote-sources:
    get:
      operationId: listRemoteSources
      tags: [data-sources]
      x-permission: data.manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemoteSource"
                required: [items]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /remote-sources/{source}/refresh:
    parameters:
      - name: source
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RemoteSourceId"
    post:
      operationId: refreshRemoteSource
      tags: [data-sources]
      x-permission: data.manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromYear:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                toYear:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                force:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Queued as a pipeline run of kind fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A fetch run is queued or running (code run_active).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpeciesSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Limit40:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 40
    Limit50:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    DataSourceKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DataSourceKind"
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Since:
      name: since
      in: query
      schema:
        type: string
        format: date-time

  responses:
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Validation:
      description: Unprocessable Entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Machine-readable key, for example not_found or last_admin.
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
      required: [type, title, status, code]

    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
      required: [field, code]

    Health:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Config:
      type: object
      properties:
        oidcIssuer:
          type: string
          description: Issuer URL of the SSO. Empty when the service has no SSO.
        oidcName:
          type: string
          description: Name of the SSO for the sign-in button. Empty without an SSO.
        oidcClientId:
          type: string
        origin:
          type: string
        version:
          type: string
      required: [oidcIssuer, oidcName, oidcClientId, origin, version]

    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
        email:
          type: string
        name:
          type: string
      required: [id, sub, email, name]

    MyPermissions:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required: [permissions]

    AccountExport:
      type: object
      properties:
        me:
          $ref: "#/components/schemas/Me"
        finds:
          type: array
          items:
            $ref: "#/components/schemas/Find"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/Marker"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        combinations:
          type: array
          items:
            $ref: "#/components/schemas/Combination"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
      required: [me, finds, markers, zones, combinations, photos]

    Permission:
      type: string
      enum:
        - species.edit
        - image.review
        - image.submit
        - find.review
        - role.manage
        - role.assign
        - text.edit
        - run.manage
        - group.manage
        - data.manage

    Area:
      type: string
      enum: [species, interface, access, data]

    SpeciesCountsEntry:
      type: object
      properties:
        speciesId:
          type: string
          format: uuid
        records:
          type: integer
        finds:
          type: integer
        photos:
          type: integer
      required: [speciesId, records, finds, photos]

    AdminSummary:
      description: Counts of the admin overview. A field is absent when the viewer does not have its permission.
      type: object
      properties:
        texts:
          type: integer
        photos:
          type: integer
        photosPending:
          type: integer
        species:
          type: integer
        roles:
          type: integer
        permissions:
          type: integer
        people:
          type: integer
        finds:
          type: integer
        findsPending:
          type: integer
        runs:
          type: integer
        runsRunning:
          type: integer
        groups:
          type: integer
        groupMembers:
          type: integer
        glossary:
          type: integer
        terms:
          type: integer
          description: The count of categories, all kinds together.
        dataSourcesMissing:
          type: integer
        dataSourcesFailed:
          type: integer

    PermissionEntry:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/Permission"
        area:
          $ref: "#/components/schemas/Area"
      required: [key, area]

    Visibility:
      type: string
      enum: [private, shared]

    ReviewState:
      type: string
      enum: [open, accepted, rejected]

    ReviewDecision:
      type: string
      enum: [accepted, rejected]

    PhotoState:
      type: string
      enum: [private, submitted, approved, rejected]

    RunKind:
      type: string
      enum: [training, render, full, fetch]

    RunState:
      type: string
      enum: [queued, running, finished, failed]

    ColourMode:
      type: string
      enum: [single, gradient, distinct]

    TriggerGroup:
      type: string
      enum: [mechanical, reagent, environment]

    Edibility:
      type: string
      enum: [edible, conditionally_edible, inedible, poisonous, deadly]

    Protection:
      type: string
      enum: [none, personal_use, strict]

    BodyPart:
      type: string
      enum: [fruitbody, cap, stem, ring, stem_base, gills, flesh, spore_print, spore, tubes, pores]

    Dimension:
      type: string
      enum: [width, height, thickness, length]

    Unit:
      type: string
      enum: [cm, mm, um]

    Speed:
      type: string
      enum: ["immediate", "30s", "1min", "3min", "longer", "permanent"]

    Rule:
      type: string
      enum: [intersection, graded]

    Condition:
      type: string
      enum: [below, above, between]

    TaxonRank:
      type: string
      enum: [division, class, order, family, genus]

    Group:
      type: string
      enum:
        - bolete
        - rough_stemmed_bolete
        - slippery_jack
        - chanterelle
        - hedgehog
        - milkcap
        - brittlegill
        - parasol
        - agaricus
        - inkcap
        - puffball
        - funnel
        - blewit
        - honey_fungus
        - scalycap
        - toughshank
        - porcelain
        - oyster
        - lions_mane
        - polypore
        - cauliflower
        - knight
        - parachute
        - woodwax
        - amanita
        - morel
        - jelly_ear
        - spike
        - webcap
        - domecap
        - pinkgill
        - spine_fungus
        - cup_fungus

    Frequency:
      type: string
      enum: [very_common, common, scattered, rare, very_rare]

    RedListStatus:
      type: string
      enum:
        - critically_endangered
        - endangered
        - vulnerable
        - unknown_extent
        - extremely_rare
        - near_threatened
        - data_deficient

    HymeniumType:
      type: string
      enum: [gills, tubes, pores, spines, folds]

    GillAttachment:
      type: string
      enum: [free, adnate, emarginate, decurrent]

    GillSpacing:
      type: string
      enum: [close, normal, distant]

    GillEdge:
      type: string
      enum: [smooth, serrate, ciliate]

    CapShape:
      type: string
      enum:
        - hemispherical
        - convex
        - flat
        - depressed
        - funnel
        - conical
        - bell
        - egg
        - spherical
        - shell
        - pear
        - club
        - cylindrical

    CapFeature:
      type: string
      enum: [umbonate, hygrophanous, zoned, sunken, irregular, navelled]

    CapMargin:
      type: string
      enum:
        - inrolled
        - wavy
        - striate
        - cracked
        - fringed
        - incurved
        - overhanging
        - sharp
        - lobed

    StemFeature:
      type: string
      enum:
        - ring
        - bulb
        - hollow
        - fibrous
        - flocked
        - solid
        - banded
        - netted
        - hairy
        - rooting
        - striate
        - volva
        - brittle

    Phase:
      type: string
      enum: [young, old]

    Season:
      type: string
      enum: [spring, summer, autumn, winter]

    TermKind:
      type: string
      enum: [smell, taste, tree, trigger]

    NameKind:
      type: string
      enum: [common, synonym]

    SourceScope:
      type: string
      enum: [profile, further]

    TraitKey:
      type: string
      enum:
        - fruitbody
        - cap
        - tubes
        - gills
        - folds
        - spines
        - pores
        - milk
        - stem
        - flesh
        - smell
        - taste
        - spore_print
        - reagents
        - habitat
        - season
        - edibility
        - protection

    Licence:
      type: string
      enum: [own, cc0, cc_by_4, cc_by_sa_4, public_domain]

    PhotoSize:
      type: string
      enum: [thumb, list, full]

    MarkerColour:
      type: string
      enum: [green, yellow, orange, red, violet, grey]

    HexColour:
      type: string
      pattern: "^#[0-9a-f]{6}$"

    GeoPoint:
      type: object
      properties:
        type:
          type: string
          const: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
      required: [type, coordinates]

    GeoPolygon:
      type: object
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
      required: [type, coordinates]

    ColourValue:
      type: object
      properties:
        name:
          type: string
        hex:
          $ref: "#/components/schemas/HexColour"
        nearest:
          description: The hex of the nearest standard colour. It names the colour in other languages.
          oneOf:
            - $ref: "#/components/schemas/HexColour"
            - type: "null"
      required: [name, hex]

    StandardColour:
      type: object
      properties:
        key:
          type: string
        hex:
          $ref: "#/components/schemas/HexColour"
      required: [key, hex]

    TermRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TermKind"
      required: [id, slug, name, kind]

    ColourGroup:
      type: object
      properties:
        part:
          $ref: "#/components/schemas/BodyPart"
        mode:
          $ref: "#/components/schemas/ColourMode"
        colours:
          type: array
          items:
            $ref: "#/components/schemas/ColourValue"
      required: [part, mode, colours]

    ColourChange:
      type: object
      properties:
        part:
          $ref: "#/components/schemas/BodyPart"
        kind:
          $ref: "#/components/schemas/TriggerGroup"
        from:
          oneOf:
            - $ref: "#/components/schemas/ColourValue"
            - type: "null"
        to:
          $ref: "#/components/schemas/ColourValue"
        speed:
          oneOf:
            - $ref: "#/components/schemas/Speed"
            - type: "null"
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/TermRef"
      required: [part, kind, to, triggers]

    Measurement:
      type: object
      properties:
        dimension:
          $ref: "#/components/schemas/Dimension"
        unit:
          $ref: "#/components/schemas/Unit"
        low:
          type: number
        high:
          type: number
      required: [dimension, unit, low, high]

    PartNote:
