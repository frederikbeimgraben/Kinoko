openapi: 3.1.0
info:
  title: Kinoko API
  version: 1.0.0
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: system
  - name: account
  - name: species
  - name: taxa
  - name: terms
  - name: finds
  - name: markers
  - name: zones
  - name: combinations
  - name: photos
  - name: texts
  - name: access
  - name: pipeline-runs
  - name: internal

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /config:
    get:
      operationId: getConfig
      tags: [system]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /me:
    get:
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/permissions:
    get:
      operationId: getMyPermissions
      tags: [account]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPermissions"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/export:
    get:
      operationId: exportMyData
      tags: [account]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/data:
    delete:
      operationId: deleteMyData
      tags: [account]
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
    post:
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendGroupWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /groups/join:
    post:
      operationId: joinGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendGroupJoin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGroup
      tags: [groups]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    put:
      operationId: updateGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendGroupWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendGroup"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      operationId: deleteGroup
      tags: [groups]
      responses:
        "204":
          description: No Content
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /groups/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeGroupMember
      tags: [groups]
      responses:
        "204":
          description: No Content
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /glossary:
    get:
      operationId: listGlossary
      tags: [glossary]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GlossaryEntry"
    post:
      operationId: createGlossaryEntry
      tags: [glossary]
      x-permission: text.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlossaryEntryWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /glossary/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateGlossaryEntry
      tags: [glossary]
      x-permission: text.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlossaryEntryWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      operationId: deleteGlossaryEntry
      tags: [glossary]
      x-permission: text.edit
      responses:
        "204":
          description: No Content
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /species/bundle:
    get:
      operationId: getSpeciesBundle
      tags: [species]
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesBundle"
        "304":
          description: Not Modified
        "422":
          $ref: "#/components/responses/Validation"

  /species:
    get:
      operationId: listSpecies
      tags: [species]
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit40"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema:
            type: string
        - name: taxonId
          in: query
          schema:
            type: string
            format: uuid
        - name: "edibility[]"
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Edibility"
        - name: "hymenium[]"
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HymeniumType"
        - name: "capShape[]"
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CapShape"
        - name: "terms[]"
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: "months[]"
          in: query
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 12
        - name: colour[cap]
          in: query
          description: A standard colour. A species matches when the nearest standard colour of one of its catalogue colours for this part is this colour.
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[stem]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[gills]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[flesh]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[sporePrint]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[tubes]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: colour[pores]
          in: query
          schema:
            $ref: "#/components/schemas/HexColour"
        - name: size
          in: query
          description: Repeatable. Key is part.dimension, value is min-max in the unit of the catalogue, one side may be empty.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              pattern: "^[0-9.]*-[0-9.]*$"
            example:
              cap.width: "4-20"
              stem.height: "5-"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesPage"
        "422":
          $ref: "#/components/responses/Validation"

    post:
      operationId: createSpecies
      tags: [species]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /species/{slug}:
    parameters:
      - $ref: "#/components/parameters/SpeciesSlug"
    get:
      operationId: getSpecies
      tags: [species]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

    put:
      operationId: replaceSpecies
      tags: [species]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      operationId: deleteSpecies
      tags: [species]
      x-permission: species.edit
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /species/{slug}/forecast:
    parameters:
      - $ref: "#/components/parameters/SpeciesSlug"
    put:
      operationId: setSpeciesForecast
      tags: [species]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /species/{slug}/counts:
    parameters:
      - $ref: "#/components/parameters/SpeciesSlug"
    get:
      operationId: getSpeciesCounts
      tags: [species]
      x-permission: species.edit
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesCounts"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /taxa/{rank}/{slug}:
    get:
      operationId: getTaxonPage
      tags: [taxa]
      security: []
      parameters:
        - name: rank
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaxonRank"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /terms:
    get:
      operationId: listTerms
      tags: [terms]
      security: []
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/TermKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Term"
                required: [items]
        "422":
          $ref: "#/components/responses/Validation"

    post:
      operationId: createTerm
      tags: [terms]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /terms/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateTerm
      tags: [terms]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /terms/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: mergeTerm
      tags: [terms]
      x-permission: species.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                into:
                  type: string
                  format: uuid
              required: [into]
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /finds:
    get:
      operationId: listFinds
      tags: [finds]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
        - name: mine
          in: query
          schema:
            type: boolean
            default: true
        - name: speciesId
          in: query
          schema:
            type: string
            format: uuid
        - name: bbox
          in: query
          description: minLon,minLat,maxLon,maxLat
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

    post:
      operationId: createFind
      tags: [finds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Find"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /finds/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getFind
      tags: [finds]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Find"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

    put:
      operationId: putFind
      tags: [finds]
      description: Creates the find with this id, or replaces it. Idempotent for the offline queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Find"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Find"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      operationId: deleteFind
      tags: [finds]
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /finds/{id}/review:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reviewFind
      tags: [finds]
      x-permission: find.review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  $ref: "#/components/schemas/ReviewDecision"
              required: [decision]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Find"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /finds/reviews/accept-all:
    post:
      operationId: acceptAllOpenFinds
      tags: [finds]
      x-permission: find.review
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /markers:
    get:
      operationId: listMarkers
      tags: [markers]
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

    post:
      operationId: createMarker
      tags: [markers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkerWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /markers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMarker
      tags: [markers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

    put:
      operationId: putMarker
      tags: [markers]
      description: Creates the marker with this id, or replaces it. Idempotent for the offline queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkerWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "422":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      operationId: deleteMarker
      tags: [markers]
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /zones:
    get:
