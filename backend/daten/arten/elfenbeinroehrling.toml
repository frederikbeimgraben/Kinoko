weitereNamen = ["Weymouthsröhrling"]
synonyme = ["Boletus placidus", "Uloporus placidus", "Suillus plorans subsp. placidus", "Boletus fusipes", "Gyrodon placidus", "Viscipellis fusipes", "Ixocomus fusipes"]
