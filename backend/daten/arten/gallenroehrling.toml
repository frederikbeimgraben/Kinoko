name = "Gemeiner Gallenröhrling"
lateinisch = "Tylopilus felleus"
gruppe = "roehrling"
speisewert = "giftig"
marktfaehig = false
sammelbar = false
jahreszeiten = ["fruehling", "sommer", "herbst"]
baeume = []
speisewertHinweis = "Schon ein kleines Stück Fleisch auf der Zunge schmeckt sehr bitter; ein einziger Fruchtkörper verdirbt ein ganzes Gericht. Er enthält etwas Bufotenin. Vereinzelt gab es Vergiftungen mit Erbrechen, Durchfall, Bauchkoliken, Schwindel und Schweißausbrüchen."
beschreibung = "Mittelgroßer bis großer Röhrling mit hell- bis dunkelbraunem Hut, jung weißen, später rosa Röhren und hellbraunem Stiel mit grobem, braunem Netz. Er wächst vor allem von Sommer bis Herbst bei Nadelbäumen im Misch- und Nadelwald auf saurem Boden. Vom Steinpilz unterscheiden ihn vor allem die rosa werdenden Röhren und das grobe, braune Netz am Stiel, denn der Steinpilz hat ein feines, weißes Netz und Röhren, die gelblich bis olivgrün werden. Der Gallenröhrling ist giftig."
beschreibungEn = "A medium-sized to large bolete with a light to dark brown cap, tubes that are white when young and pink later, and a light brown stem with a coarse, brown net. The bitter bolete grows mainly from summer to autumn with conifers in mixed and coniferous woods on acid soil. The key difference from the cep is the tubes, which turn pink, and the coarse, brown net on the stem, because the cep has a fine, white net and tubes that turn yellowish to olive-green. The bitter bolete is poisonous."
entwurf = true
weitereNamen = ["Gallenröhrling", "Bitterröhrling", "Bitterling"]
fruchtschicht = { art = "roehren" }
stielmerkmale = ["genetzt"]

