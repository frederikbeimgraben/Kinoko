fruchtkoerper = "Einzelhüte 2 bis 5, selten bis 7 cm breit, in Büscheln bis 100 cm. Gesprenkelt bräunlich, cremefarben bis haselnussbraun. Viele kleine Porenpilze entspringen einem gemeinsamen Strunk."
poren = "Cremefarben bis hellbraun, herablaufend, im Alter ablösbar."
stiel = "Cremefarben bis hellbraun, mittig angesetzt."
fleisch = "Weiß bis cremefarben, dünn und brüchig."
geruch = "Angenehm pilzig."
geschmack = "Nussig, im Alter bitter."
sporenpulver = "Weiß."
vorkommen = "Am Fuß von Laubbäumen, meist Eiche, seltener Buche. Parasitisch und folgezersetzend, löst Weißfäule aus. Kommt jährlich an derselben Stelle wieder."
zeit = "Frühsommer bis Herbst."

