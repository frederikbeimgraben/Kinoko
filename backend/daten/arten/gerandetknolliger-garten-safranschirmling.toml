name = "Gerandetknolliger Garten-Safranschirmling"
lateinisch = "Chlorophyllum brunneum"
gruppe = "schirmling"
speisewert = "giftig"
marktfaehig = false
sammelbar = false
jahreszeiten = ["sommer", "herbst"]
baeume = []
speisewertHinweis = "Erkennbar an der breiten, tellerartig gerandeten Stielknolle, am einfachen Ring und am stark safranfarben rötenden Fleisch. Er wächst auf Kompost und in Gewächshäusern, kaum im Wald."
beschreibung = "Mittelgroßer bis großer Schirmling mit schmutzig weißem bis hellockerfarbenem Hut mit wolligen, abstehenden braunen Schüppchen, die zur Mitte hin dichter stehen, weißen, freien Lamellen und glattem, hellbräunlichem Stiel ohne Natterung mit verschiebbarem, einfachem Ring und breiter, tellerartig gerandeter Knolle. Er wächst von Juni bis November auf Komposthaufen, in Gewächshäusern und in geschützten Gartenanlagen, im Wald nur selten bei Kompostablagerungen. Vom Parasol unterscheiden ihn vor allem der glatte Stiel ohne Natterung und das stark safranfarben rötende Fleisch, denn der Parasol hat einen deutlich genatterten Stiel und einen doppelten Ring und rötet kaum. Der Gerandetknollige Garten-Safranschirmling ist giftig."
beschreibungEn = "A medium-sized to large parasol with a dirty white to light ochre cap with woolly, upturned brown scales that are denser towards the centre, white free gills and a smooth, light brownish stem without a snakeskin pattern, with a movable, simple ring and a broad, plate-like bulb with a rim. Chlorophyllum brunneum grows from June to November on compost heaps, in greenhouses and in sheltered gardens, and only rarely in woods near compost dumps. The key difference from the parasol is the smooth stem without a snakeskin pattern and the flesh that turns strongly saffron-red, because the parasol has a clear snakeskin pattern on the stem and a double ring and hardly turns red. Chlorophyllum brunneum is poisonous."
entwurf = true
weitereNamen = ["Gerandetknolliger Gartenriesenschirmling", "Safranschirmling-Gartenform", "Rötender Gartenschirmpilz"]
