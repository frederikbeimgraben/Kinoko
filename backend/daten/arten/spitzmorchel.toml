[merkmale]
fruchtkoerper = "5 bis 15, selten bis 20 cm hoch und 3 bis 8 cm breit, olivbeige, dunkel gelbbraun bis graubraun, alt schwärzlich, hohl. Zugespitzt, der Rand ist ganz mit dem Stiel verwachsen. Fast schwarze Formen sind die Schwarze Spitzmorchel und die Gerippte Morchel, rötliche die Fleischfarbene Spitzmorchel. Alle sind ebenso essbar."
stiel = "Weiß, ockergelb bis hellbräunlich, körnig, kammerig hohl. Ein rosa Stiel weist auf die Rosastielige Spitzmorchel hin, die ebenso essbar ist."
fleisch = "Weißlich, dünn, wachsartig, brüchig, im Stiel knorpelig und kammerig hohl."
geruch = "Angenehm."
geschmack = "Mild. Roh ist er giftig."
sporenpulver = "Weißlich bis cremefarben."
vorkommen = "Folgezersetzer, häufig in Rindenmulch, dazu in Auwäldern, Parks, Gärten, an Waldrändern, auf Brandstellen und Waldwiesen, sehr standorttreu."
zeit = "Frühling, in Bayern meist erst ab April bis Mitte Mai, andernorts bis Juni."

