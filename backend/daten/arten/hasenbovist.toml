[[verwechslungen]]
slug = "beutelstaeubling"
unterschied = "Kleiner, bis 25 cm hoch, Außenhaut mit spitzen ablösbaren Warzen, Fleisch alt purpurbraun."
eigenerUnterschied = "Ballon-, sack- oder kreiselförmig und meist viel größer, ohne abgesetzten Stielteil, auf Wiesen und Weiden."

[[verwechslungen]]
slug = "flaschenbovist"
unterschied = "Kleiner, keulig bis birnenförmig mit stielartigem Fuß, mit körnigen Stacheln besetzt."

[[verwechslungen]]
slug = "riesenbovist"
unterschied = "Deutlich größer, kugelig, Haut glatt und lederartig, Geruch unangenehm."
eigenerUnterschied = "Nur 3 bis 16 cm breit, jung mit plattenartigen Erhebungen, auf Wiesen und Weiden, gern in Gebirgslagen."

[[verwechslungen]]
slug = "weisser-knollenblaetterpilz"
unterschied = "Jung kugelig, im Schnitt aber mit Hut, Lamellen und Stiel angelegt, Basis in einer häutigen Scheide."

[[verwechslungen]]
slug = "wiesenstaeubling"
unterschied = "Kleiner, kugel- bis birnenförmig, Basis mit weißem Myzelfilz und kräftigen Strängen."
eigenerUnterschied = "Größer, die Außenhaut reißt im Alter netzig felderig auf."

