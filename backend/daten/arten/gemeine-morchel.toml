speisewertHinweis = "Roh giftig, nur durchgegart essen. Morcheln sind besonders geschützt, deshalb nur kleine Mengen für den Eigenbedarf."
beschreibung = "Mittelgroße Morchel mit hellbraunem, graubraunem bis rußbraunem, wabenartigem Hut mit tiefen Kammern und eher waagerecht verlaufenden Rippen, der ohne Einbuchtung mit dem weißlichen, hohlen Stiel verwachsen ist. Sie wächst von Februar bis Juni in Auwäldern, in Gärten und Parks auf kalkreichen oder sandigen Böden und ist sehr standorttreu. Von der Zipfellorchel unterscheidet sie vor allem der wabig gekammerte Hut, denn die Zipfellorchel hat einen zipfelig gelappten Hut, dessen Rand frei vom Stiel absteht."
beschreibungEn = "A medium-sized morel with a light brown, grey-brown to sooty brown, honeycomb-like cap with deep pits and mostly horizontal ridges, joined without a groove to the whitish, hollow stem. Morchella vulgaris grows from February to June in floodplain woods, in gardens and parks on calcareous or sandy soil, and comes back at the same places. The key difference from Discina fastigiata is the honeycomb-like cap with pits, because Discina fastigiata has a cap with irregular lobes whose margin stands free from the stem."
entwurf = true
weitereNamen = ["Graue Speisemorchel"]
synonyme = ["Morchella esculenta var. vulgaris"]
stielmerkmale = ["hohl"]

