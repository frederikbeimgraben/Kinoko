lamellen = "Grauweiß bis etwas gelblich, alt mit rostbraunen Flecken, ausgebuchtet angewachsen, Schneiden glatt und dunkler punktiert."
stiel = "3 bis 7,5, selten bis 8,5 cm lang und 1 bis 1,5, selten 2 cm dick, weißlich bis grauweiß, etwas heller als der Hut, schwarzbraun bis schwärzlich fein geschuppt, längsfaserig. Basis schwach verdickt und leicht spindelig, Myzel weiß."
fleisch = "Weißlich, cremeweiß bis blassgrau, in der Stielspitze grau marmoriert, im Hutbereich oft dunkler, nicht gilbend."
geruch = "Unbedeutend bis mehlartig, alt mehlartig ranzig."
