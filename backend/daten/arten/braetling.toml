[merkmale]
hut = "4 bis 17, selten bis 23 cm breit, orangebraun, rotbraun bis orangefuchsig, in der Mitte rötlich fleckend, matt und feinsamtig, im Alter federig rissig. Rand eingebogen."
lamellen = "Ockergelb, auf Druck dunkelbraun, ziemlich gedrängt, im Alter etwas herablaufend, mit Zwischenlamellen."
milch = "Weiß, reichlich, klebrig, mild. Sie trocknet dunkelbraun ein."
stiel = "5 bis 12, selten bis 14 cm hoch, haselnussbraun bis blass ockerbräunlich, bereift, auf Druck dunkelbraun, zur Basis verjüngt."
fleisch = "Weißlich, bei Verletzung und im Alter rostbraun fleckend."
geruch = "Deutlich nach Heringslake, fischartig."
geschmack = "Mild, angenehm pilzig."
sporenpulver = "Cremeweiß."
vorkommen = "Symbiosepilz im Mischwald. In Deutschland stark zurückgegangen."
zeit = "Frühsommer bis Herbstanfang, nur selten später."

