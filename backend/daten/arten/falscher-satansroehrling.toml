marktfaehig = false
sammelbar = false
jahreszeiten = ["sommer", "herbst"]
baeume = ["buche", "eiche", "kastanie"]
speisewertHinweis = "Roh giftig und unverträglich. Er trägt purpurrote bis blutrote Röhren, einen kräftig roten Stiel mit rotem Netz und chromgelbes Fleisch, das sofort stark blaut. Dem Satansröhrling sehr ähnlich."
haeufigkeit = "sehrSelten"
beschreibung = "Kräftiger Röhrling mit purpurrosa bis gold- oder rostgelbem, körnigem Hut, der auf Druck blaut, purpur- bis blutroten Röhren und kräftig rotem Stiel mit rotem Netz; das chromgelbe Fleisch blaut sofort stark. Er wächst von Juni bis November im Laub- und Nadelwald, gern bei Rotbuche, Kastanie und Eiche, und ist sehr selten. Vom sehr ähnlichen Satansröhrling unterscheidet ihn vor allem der gelbe bis purpurrosa Hut, denn der Satansröhrling hat einen weißlich grauen Hut. Der Gelbhütige Purpurröhrling ist giftig."
beschreibungEn = "A stout bolete with a purple-pink to golden or rust-yellow, granular cap that turns blue when pressed, purple-red to blood-red tubes and a strong red stem with a red net; the chrome-yellow flesh turns strongly blue at once. Imperator luteocupreus grows from June to November in broadleaf and coniferous woods, often with beech, chestnut and oak, and is very rare. The key difference from the very similar devil's bolete is the yellow to purple-pink cap, because the devil's bolete has a whitish-grey cap. Imperator luteocupreus is poisonous."
entwurf = true
