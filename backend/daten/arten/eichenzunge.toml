geruch = "Angenehm pilzig."
geschmack = "Mild und säuerlich."
sporenpulver = "Hellbraun."
vorkommen = "Meist parasitisch an Eichen, seltener folgezersetzend, löst Braunfäule aus. Sehr selten, in Deutschland vom Aussterben bedroht."
zeit = "Sommer bis Spätherbst."

