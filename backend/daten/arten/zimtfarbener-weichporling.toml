name = "Zimtfarbener Weichporling"
lateinisch = "Hapalopilus rutilans"
gruppe = "porling"
speisewert = "toedlichGiftig"
marktfaehig = false
sammelbar = false
jahreszeiten = ["fruehling", "sommer", "herbst", "winter"]
baeume = []
beschreibung = "Stielloser Porling mit tellerförmig vom Holz abstehendem, jung gelbockerlichem, später zimt- bis rosabraunem Fruchtkörper, gleichfarbigen Poren und durchgehend zimt- bis rosabraunem, weichem Fleisch. Er wächst das ganze Jahr, meist an Laubholz. Vom ähnlichen Schwefelporling unterscheidet ihn vor allem das Fleisch, denn der Schwefelporling hat gelbes, im Alter weißes Fleisch und gelbe Poren. Der Zimtfarbene Weichporling ist tödlich giftig."
beschreibungEn = "A polypore without a stem whose fruit body stands out from the wood like a plate and is ochre-yellowish when young and later cinnamon-brown to pink-brown, with pores of the same colour and soft flesh that is cinnamon-brown to pink-brown throughout. It grows all year, mostly on broadleaf wood. The key difference from the similar chicken of the woods is the flesh, because chicken of the woods has yellow flesh that turns white with age and yellow pores. Hapalopilus rutilans is deadly poisonous."
entwurf = true
weitereNamen = ["Zimtfarbiger Weichporling"]
speisewertHinweis = "Tödlich giftig. Zu erkennen am durchgehend zimt- bis rosabraunen weichen Fleisch und an den gleichfarbigen Poren des stiellosen, tellerförmig abstehenden Fruchtkörpers an Laubholz."
synonyme = ["Hapalopilus nidulans"]
fruchtschicht = { art = "poren" }

