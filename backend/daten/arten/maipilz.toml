[merkmale]
hut = "3 bis 15, selten bis 20 cm breit, weiß, cremeweiß bis gelblich, matt, oft bereift fleckig. Rand jung eingerollt, im Alter von der Mitte her bräunlich schuppig. Form oft unregelmäßig verbogen."
lamellen = "Weiß, später gelblich, schmal und sehr dicht, am Stiel ausgebuchtet angewachsen, manchmal mit einem Zahn herablaufend, mit vielen Zwischenlamellen."
stiel = "5 bis 8, selten bis 10 cm lang, 1 bis 3, selten bis 4 cm dick, weißlich bis gelblich, kräftig, faserig, zur Basis oft leicht keulig. Nie ein Ring oder ein Rest davon."
fleisch = "Weiß, teils gelblich bis gelbbraun, dick und fest, bei Verletzung ohne Verfärbung. Im Längsschnitt ist das Hutfleisch immer dicker als die Lamellen hoch sind."
geruch = "Mehlig bis gurkenartig, am besten an zerdrücktem Fleisch zu prüfen."
geschmack = "Mehlig, mild."
sporenpulver = "Weiß."
vorkommen = "Folgezersetzer auf Wiesen, in Parks, Laubwäldern und Auwald, bei Espe und Pappel, nur vereinzelt bei Lärche, meist auf kalkreichem Boden. In Hexenringen, sehr häufig."
zeit = "Frühling bis Frühsommer."

