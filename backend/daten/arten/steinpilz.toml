karte = "boletus_edulis"
speisewertHinweis = "Bei einem Fund ohne oder mit kaum sichtbarem Netz am Stiel und mit gelblichen Röhren entscheidet eine Geschmacksprobe, ob ein bitterer Gallenröhrling vorliegt."
beschreibung = "Kräftiger Röhrling mit wildlederartig hell- bis haselnussbraunem Hut, oft weißlichem Hutrand und dickem, hellem Stiel mit feinem Netz. Er wächst in ganz Deutschland von Juni bis November im Nadel- und Laubwald, gern bei Fichte, Tanne und Kiefer, auch bei Buche und Eiche. Vom Gallenröhrling unterscheidet ihn vor allem das Netz am Stiel: Es ist weiß und wird erst im Alter bräunlich, der Gallenröhrling hat ein grobes, dunkelbraunes Netz."
beschreibungEn = "A stout bolete with a suede-like, light to hazel-brown cap, an often whitish cap margin and a thick, pale stem with a fine net. It grows throughout Germany from June to November in coniferous and broadleaf woods, often with spruce, fir and pine, also with beech and oak. The key difference from the bitter bolete is the net on the stem: it is white and becomes brownish only with age, while the bitter bolete has a coarse, dark brown net."
entwurf = true
