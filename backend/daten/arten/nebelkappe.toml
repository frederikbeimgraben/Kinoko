jahreszeiten = ["sommer", "herbst"]
baeume = []
warnung = "123pilzsuche führt die Nebelkappe als giftig. Sie galt lange als Speisepilz; ein Teil der Sammler bekommt auch nach dem Garen Magen-Darm-Beschwerden."
karte = "nebelkappe"
speisewertHinweis = "123pilzsuche führt sie als giftig. Der Stoff Nebularin löst Magen-Darm-Beschwerden aus, auch nach dem Garen. In der Schweiz ist sie nicht marktfähig."
beschreibung = "Großer Trichterling mit graubraunem bis weißgrauem, etwas radialfaserigem Hut mit meist eingerolltem Rand, weißlichen bis cremegelben, angewachsenen bis herablaufenden, leicht ablösbaren Lamellen und graubraunem, faserigem Stiel mit knollig verdickter Basis. Er wächst von August bis November als Folgezersetzer im Mischwald, gern in Hexenringen, und ist im Spätherbst ein Massenpilz. Vom tödlich giftigen Riesenrötling unterscheiden ihn vor allem der unangenehm süßliche Geruch nach Raps und das cremegelbliche Sporenpulver, denn der Riesenrötling riecht säuerlich mehlig, hat rosabraunes Sporenpulver und Lamellen, die praktisch nie herablaufen. Die Nebelkappe ist giftig."
beschreibungEn = "A large funnel with a grey-brown to white-grey, slightly radially fibrous cap with a margin that is mostly inrolled, whitish to cream-yellow, adnate to decurrent gills that come off easily, and a grey-brown, fibrous stem with a bulbous base. It grows from August to November as a saprobe in mixed woods, often in fairy rings, and appears in large numbers in late autumn. The key difference from the deadly poisonous livid pinkgill is the unpleasant sweetish smell of oilseed rape and the cream-yellowish spore print, because the livid pinkgill has a sour, mealy smell, a pink-brown spore print and gills that almost never run down the stem. The clouded agaric is poisonous."
entwurf = true
weitereNamen = ["Herbstblattl", "Nebelgrauer Röteltrichterling", "Nebelgrauer Trichterling", "Graukappe", "Graukopf"]
